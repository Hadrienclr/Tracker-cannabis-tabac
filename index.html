<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme:dark)"/>
  <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme:light)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Habit Tracker"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Habit Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0a0a0f;--bg2:#12121c;--bg3:#1a1a28;
      --s:rgba(255,255,255,0.04);--s2:rgba(255,255,255,0.08);
      --b:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.14);
      --t:#e8e8f0;--t2:#9ca3af;--t3:#6b7280;
      --green:#22c55e;--green2:#4ade80;--green3:rgba(34,197,94,0.12);
      --sh:0 2px 16px rgba(0,0,0,0.35);
    }
    @media(prefers-color-scheme:light){:root{
      --bg:#f0f4f8;--bg2:#ffffff;--bg3:#e8edf4;
      --s:rgba(0,0,0,0.04);--s2:rgba(0,0,0,0.08);
      --b:rgba(0,0,0,0.08);--b2:rgba(0,0,0,0.14);
      --t:#0f172a;--t2:#475569;--t3:#94a3b8;
      --green:#16a34a;--green2:#15803d;--green3:rgba(22,163,74,0.1);
      --sh:0 2px 12px rgba(0,0,0,0.08);
    }}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
    #root{height:100%;}
    .shell{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);}
    .hdr{padding:10px 16px 0;flex-shrink:0;}
    .content{flex:1;overflow-y:auto;padding:8px 16px 160px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .content::-webkit-scrollbar{display:none;}
    .tabs{position:fixed;bottom:0;left:0;right:0;padding:6px 6px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,10,15,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--b);display:flex;gap:2px;z-index:50;}
    @media(prefers-color-scheme:light){.tabs{background:rgba(240,244,248,0.96);}}
    /* Tab icon bounce on active */
    .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:9px;font-weight:600;color:var(--t3);transition:all .22s cubic-bezier(.34,1.56,.64,1);}
    .tb.on{background:var(--green3);color:var(--green2);}
    .tb svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
    .tb.on svg{animation:iconBounce .4s cubic-bezier(.34,1.56,.64,1);}
    @keyframes iconBounce{0%{transform:scale(1)}40%{transform:scale(1.35)}70%{transform:scale(0.9)}100%{transform:scale(1.1)}}
    .tc{animation:tIn .22s ease;}
    @keyframes tIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* Cards */
    .card{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
    .xcard{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;position:relative;box-shadow:var(--sh);}
    .xbtn{position:absolute;top:11px;right:11px;background:var(--s);border:1px solid var(--b);border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .clbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;}
    .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .sm{background:var(--bg2);border:1px solid var(--b);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh);}
    .sm .v{font-size:22px;font-weight:700;}
    .sm .l{font-size:9px;color:var(--t3);margin-top:2px;}
    .pb{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px;}
    .pf{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1);}
    .pb.t{height:9px;}
    .pulse{animation:sp .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes sp{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
    .gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
    .gr span{font-size:12px;color:var(--t2);}
    .sban{margin-top:8px;padding:8px 12px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:11px;color:var(--green2);text-align:center;}

    /* Playfair for big numbers only */
    .big-num{font-family:'Playfair Display',serif;font-weight:700;}

    /* Nav */
    .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .nbtn{background:var(--s);border:1px solid var(--b);color:var(--t);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .14s,transform .14s;}
    .nbtn:active{background:var(--s2);transform:scale(0.88);}
    .vpill{display:flex;background:var(--s);border-radius:8px;padding:2px;gap:2px;}
    .vbtn{padding:4px 9px;border-radius:6px;border:none;font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--t3);transition:all .18s;display:flex;align-items:center;gap:3px;}
    .vbtn.on{background:var(--green3);color:var(--green2);}

    /* Calendar */
    .cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
    .cdl{text-align:center;font-size:10px;font-weight:600;color:var(--t3);padding:3px 0;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1.5px solid transparent;font-size:11px;font-weight:500;user-select:none;opacity:0;animation:cPop forwards;transition:transform .14s,background .2s,border-color .2s;}
    .day:active{transform:scale(0.87)!important;}
    .day.td{border-color:rgba(34,197,94,0.6)!important;}
    .day.bop{animation:cBop .36s cubic-bezier(.34,1.56,.64,1) forwards!important;}
    .dot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#a855f7;}
    @keyframes cPop{0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)}}
    @keyframes cBop{0%{transform:scale(1)}35%{transform:scale(1.26)}65%{transform:scale(0.93)}100%{transform:scale(1)}}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
    .wday{border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:10px 2px;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:transform .14s,background .2s;animation:tIn .2s ease;}
    .wday:active{transform:scale(0.92);}
    .wday.td{border-color:rgba(34,197,94,0.6)!important;}
    .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .ym-card{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:8px 6px;cursor:pointer;transition:all .15s;}
    .ym-card:active{transform:scale(0.96);}
    .ym-name{font-size:10px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;}
    .ym-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;}
    .yd{aspect-ratio:1;border-radius:2px;}

    /* Organ flip */
    .organ-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
    .organ-flip{perspective:900px;height:130px;cursor:pointer;}
    .organ-flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
    .organ-flip.flipped .organ-flip-inner{transform:rotateY(180deg);}
    .organ-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;border:1px solid var(--b);background:var(--bg2);box-shadow:var(--sh);}
    .organ-back{transform:rotateY(180deg);background:var(--bg3);padding:10px 9px;justify-content:flex-start;align-items:flex-start;}
    .organ-pb{height:4px;border-radius:2px;background:var(--s2);margin-top:6px;overflow:hidden;width:100%;}
    .organ-pf{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}

    /* Timeline */
    .drug-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
    .drug-tab{padding:4px 10px;border-radius:20px;border:1px solid var(--b);background:var(--s);color:var(--t3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;}
    .drug-tab.on{border-color:currentColor;}
    .rec-step{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}

    /* Milestone */
    .milestone-card{background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(168,85,247,0.06));border:1px solid rgba(34,197,94,0.25);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;}
    .mg{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.2),transparent);pointer-events:none;}

    /* Week bars */
    .wbar-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:3px;height:70px;}
    .wbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
    .wbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;}
    .wbar-lbl{font-size:9px;color:var(--t3);font-weight:600;}
    .wbar-val{font-size:8px;font-weight:700;}

    /* AI box */
    .ai-box{background:var(--green3);border:1px solid rgba(34,197,94,0.2);border-radius:13px;padding:13px;margin-top:8px;}
    .ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:aiP 2s infinite;flex-shrink:0;}
    @keyframes aiP{0%,100%{opacity:1}50%{opacity:.3}}
    .ai-text{font-size:12px;color:var(--t);line-height:1.65;}
    .ai-loading{display:flex;gap:4px;align-items:center;padding:6px 0;}
    .ai-loading span{width:5px;height:5px;border-radius:50%;background:var(--green);animation:dots 1.2s infinite;}
    .ai-loading span:nth-child(2){animation-delay:.2s;}
    .ai-loading span:nth-child(3){animation-delay:.4s;}
    @keyframes dots{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}
    .ai-sec{margin-top:8px;padding-top:8px;border-top:1px solid rgba(34,197,94,0.15);}
    .ai-sec-t{font-size:9px;color:var(--green);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}

    /* Modal — swipe down to close */
    .mo{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:200;display:flex;align-items:flex-end;animation:fadeIn .18s ease;}
    .mb{background:var(--bg2);border:1px solid var(--b);border-radius:22px 22px 0 0;padding:18px 15px;padding-bottom:max(24px,calc(16px + env(safe-area-inset-bottom,0px)));width:100%;animation:sUp .28s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto;touch-action:pan-y;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes sUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    .mh{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 14px;cursor:grab;}
    .ctr-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:11px;border:1.5px solid transparent;margin-bottom:6px;}
    .ctr-row.active{border-color:currentColor;}
    .ctr-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
    .ctr-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
    .ctr-lbl{font-size:13px;font-weight:500;}
    .ctr-sub{font-size:10px;color:var(--t3);margin-top:1px;}
    .ctr-right{display:flex;align-items:center;flex-shrink:0;}
    .ctr-btn{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--b2);background:var(--s);color:var(--t);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;}
    .ctr-btn:active{background:var(--s2);}
    .ctr-val{min-width:36px;text-align:center;font-size:17px;font-weight:700;}
    .slbl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;margin-top:8px;}
    .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
    .tag{padding:5px 10px;border-radius:18px;border:1px solid var(--b);background:var(--s);font-size:11px;font-weight:500;cursor:pointer;color:var(--t3);}
    .tag.on{background:var(--green3);border-color:rgba(34,197,94,0.35);color:var(--green2);}
    .mood-row{display:flex;gap:5px;margin-bottom:10px;}
    .mood-btn{flex:1;padding:8px 2px;border-radius:10px;border:1.5px solid transparent;background:var(--s);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
    .mood-btn.on{border-color:currentColor;}
    .mood-btn span:first-child{font-size:18px;}
    .mood-btn span:last-child{font-size:9px;font-weight:600;}
    textarea{background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--t);font-family:inherit;font-size:13px;padding:9px;width:100%;outline:none;resize:none;margin-top:4px;}
    textarea:focus{border-color:rgba(34,197,94,0.4);}
    input[type="number"],input[type="time"],input[type="text"]{background:var(--s);border:1px solid var(--b);border-radius:8px;color:var(--t);font-family:inherit;font-size:13px;padding:7px 9px;outline:none;}
    input[type="number"],input[type="text"]{width:88px;}
    input[type="time"]{width:auto;}
    .bprim{width:100%;padding:13px;border-radius:11px;background:rgba(34,197,94,0.15);border:1.5px solid rgba(34,197,94,0.3);color:var(--green2);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-top:12px;}
    .bprim:active{background:rgba(34,197,94,0.25);}
    .leg{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:8px;}
    .li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--t3);}
    .ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .ss{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;}
    .ss .m{background:var(--bg2);border:1px solid var(--b);border-radius:9px;padding:8px 4px;text-align:center;}
    .ss .m .v{font-size:15px;font-weight:700;}
    .ss .m .l{font-size:9px;color:var(--t3);margin-top:1px;}
    .drug-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;border:1.5px solid transparent;margin-bottom:7px;cursor:pointer;background:var(--s);}
    .drug-chip.on{background:var(--green3);border-color:rgba(34,197,94,0.25);}
    .toggle{width:42px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
    .toggle.on{background:var(--green);}.toggle.on::after{transform:translateX(18px);}
    .toggle.off{background:var(--b2);}
    .badge{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;border:1px solid transparent;}
    .badge.earned{background:var(--green3);border-color:rgba(34,197,94,0.18);}
    .badge.locked{opacity:.35;}
    .badge-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
    .badge-name{font-size:12px;font-weight:600;}
    .badge-desc{font-size:10px;color:var(--t3);margin-top:1px;}
    .badge-cat{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px;padding-left:2px;}
    .exp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:300;display:flex;flex-direction:column;animation:fadeIn .2s ease;padding:env(safe-area-inset-top,16px) 14px 16px;}
    @media(prefers-color-scheme:light){.exp-overlay{background:rgba(240,244,248,0.97);}}
    .exp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-top:2px;}
    .exp-title{font-size:16px;font-weight:600;color:var(--t);}
    .exp-close{background:var(--s);border:1px solid var(--b);border-radius:9px;color:var(--t);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .exp-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
    .chart-tip{position:absolute;background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:600;pointer-events:none;z-index:10;white-space:nowrap;box-shadow:var(--sh);color:var(--t);}
    .social-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--b);background:var(--s);cursor:pointer;margin-bottom:8px;width:100%;font-family:inherit;font-size:13px;font-weight:500;color:var(--t);}
    .social-btn:active{background:var(--s2);}
    .profile-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid rgba(34,197,94,0.4);}
    .avatar-icon{width:64px;height:64px;border-radius:50%;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--t2);}
    .motiv-area{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px;min-height:80px;color:var(--t);font-family:inherit;font-size:13px;line-height:1.6;width:100%;outline:none;resize:none;}
    .motiv-area:focus{border-color:rgba(34,197,94,0.4);}
    .widget-item{background:var(--bg2);border:1px solid var(--b);border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);margin-bottom:8px;}
    .flame-svg{animation:fw 2s ease-in-out infinite;}
    @keyframes fw{0%,100%{transform:scaleY(1) scaleX(1)}25%{transform:scaleY(1.06) scaleX(0.97)}75%{transform:scaleY(0.96) scaleX(1.03)}}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Drug DB ───────────────────────────────────────────────────────────────────
const ALL_DRUGS={
  tabac:{name:"Tabac",emoji:"🚬",color:"#f97316",risk:"Élevé",riskColor:"#f97316",unit:"cigarettes",unitShort:"cig",defaultOn:true,
    recovery:[{t:"20 min",d:"Tension artérielle normalisée",days:0},{t:"8h",d:"CO sanguin ÷2",days:0},{t:"48h",d:"Nicotine éliminée",days:2},{t:"72h",d:"Bronches dilatées",days:3},{t:"1 sem.",d:"Circulation améliorée",days:7},{t:"1 mois",d:"Risque cardio en baisse",days:30},{t:"3 mois",d:"+30% capacité pulmonaire",days:90},{t:"1 an",d:"Risque infarctus ÷2",days:365}],
    organs:{poumons:80,coeur:70,cerveau:55,foie:15},

// ── Helpers ───────────────────────────────────────────────────────────────────
function isClean(e,active){if(!e)return false;if(e.clean)return true;if(!e.logged)return false;return Object.keys(active).filter(k=>active[k]).every(k=>(e[k]||0)===0);}
function dayColor(e,active){if(!e)return null;if(isClean(e,active))return"#22c55e";const u=Object.keys(active).filter(k=>active[k]&&(e[k]||0)>0);if(!u.length)return null;if(u.length>=3)return"#9f1239";if(u.length===2)return"#ef4444";return ALL_DRUGS[u[0]]?.color||"#6b7280";}
function dayEmoji(e,active){if(!e)return"·";if(isClean(e,active))return"✦";const u=Object.keys(active).filter(k=>active[k]&&(e[k]||0)>0);if(!u.length)return"·";if(u.length>=3)return"💀";if(u.length===2)return"⚠";return ALL_DRUGS[u[0]]?.emoji||"·";}

// ── Score — fixed formula, 100 when all clean ─────────────────────────────────
// Score = weighted: 40pts clean%, 30pts streak, 20pts longest, 10pts logged
function sevrageScore(streak,longest,pct,nClean,daysCount,loggedDays){
  const cleanPct=pct; // already 0-100
  const streakPts=Math.min(streak/30*100,100); // 30j streak = 100pts
  const longestPts=Math.min(longest/30*100,100);
  const loggedPts=daysCount>0?Math.min(loggedDays/daysCount*100,100):0;
  return Math.round(cleanPct*0.4+streakPts*0.3+longestPts*0.2+loggedPts*0.1);
}

// ── Swipe hook ────────────────────────────────────────────────────────────────
function useSwipe(onLeft,onRight){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    let sx=0,sy=0;
    const ts=e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;};
    const te=e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy)*1.4&&Math.abs(dx)>40){if(dx<0)onLeft();else onRight();}};
    el.addEventListener("touchstart",ts,{passive:true});el.addEventListener("touchend",te,{passive:true});
    return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchend",te);};
  },[onLeft,onRight]);
  return ref;
}

// ── Organ flip card ───────────────────────────────────────────────────────────
function OrganCard({organKey,emoji,name,streak,activeDrugs}){
  const [flipped,setFlipped]=useState(false);
  const active=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  // Damage: max damage from all active drugs for this organ
  const maxD=active.reduce((mx,k)=>Math.max(mx,ALL_DRUGS[k]?.organs?.[organKey]||0),0);
  // Heal rate based on streak — 0% at streak 0, 100% at streak 365
  const hr=Math.min(streak/365,1);
  // If no active drug targets this organ, health is 100
  const health=maxD===0?100:Math.round(100-maxD*(1-hr));
  const color=health>=80?"#22c55e":health>=60?"#4ade80":health>=40?"#f97316":"#ef4444";
  const status=health>=80?"Bon état":health>=60?"En récupération":health>=40?"Endommagé":"Critique";
  const tier=health>=70?"high":health>=40?"mid":"low";
  const texts=active.map(k=>ALL_DRUGS[k]?.organTexts?.[organKey]?.[tier]).filter(Boolean);
  const text=texts.length>0?texts[0]:`Santé estimée à ${health}% en fonction de ton streak.`;
  return<div className={`organ-flip${flipped?" flipped":""}`} onClick={()=>setFlipped(f=>!f)}>
    <div className="organ-flip-inner">
      <div className="organ-face">
        <div style={{fontSize:26,marginBottom:4}}>{emoji}</div>
        <div style={{fontSize:11,fontWeight:600,color:"var(--t2)",marginBottom:5}}>{name}</div>
        <div style={{fontSize:20,fontWeight:700,color,lineHeight:1}}>{health}%</div>
        <div style={{fontSize:9,color,marginTop:2}}>{status}</div>

        <div style={{position:"absolute",bottom:6,right:8,opacity:.35,color:"var(--t3)"}}><svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></div>

// ── Drug Timeline slider ──────────────────────────────────────────────────────
function DrugTimeline({streak,activeDrugs}){
  const drugs=Object.keys(activeDrugs).filter(k=>activeDrugs[k]&&ALL_DRUGS[k]?.recovery?.length>0);
  const [sel,setSel]=useState(()=>drugs[0]||null);
  useEffect(()=>{if(drugs.length>0&&!drugs.includes(sel))setSel(drugs[0]);},[drugs.join(",")]);
  if(!drugs.length||!sel)return null;

  const swRef=useSwipe(()=>{const i=drugs.indexOf(sel);if(i<drugs.length-1)setSel(drugs[i+1]);},()=>{const i=drugs.indexOf(sel);if(i>0)setSel(drugs[i-1]);});

            <div style={{width:9,height:9,borderRadius:"50%",flexShrink:0,marginTop:4,background:done?d.color:"var(--s2)",boxShadow:done?`0 0 8px ${d.color}55`:"",border:`1.5px solid ${done?d.color:"var(--b2)"}`}}/>

// ── Next milestone ────────────────────────────────────────────────────────────
function NextMilestone({streak,activeDrugs}){
  const primary=Object.keys(activeDrugs).find(k=>activeDrugs[k]&&ALL_DRUGS[k]?.recovery?.length>0);
  if(!primary)return null;
  const steps=ALL_DRUGS[primary].recovery,d=ALL_DRUGS[primary];
  const next=steps.find(s=>s.days>streak),prev=steps.filter(s=>s.days<=streak).pop();
  if(!next)return<div className="milestone-card"><div className="mg"/><div style={{fontSize:9,color:"var(--green2)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>Tous les caps atteints</div><div style={{fontSize:15,fontWeight:600,color:"var(--t)"}}>Maximum de récupération</div></div>;
  const pct=prev?Math.round(((streak-prev.days)/(next.days-prev.days))*100):Math.round((streak/Math.max(next.days,1))*100);
  const left=next.days-streak;
  return<div className="milestone-card"><div className="mg"/>
    <div style={{fontSize:9,color:"var(--green2)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>Prochain cap — {next.t}</div>
    <div style={{fontSize:15,fontWeight:600,color:"var(--t)",marginBottom:4}}>{next.d}</div>
    <div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}>{d.name} · <span style={{color:d.color,fontWeight:600}}>{left} jour{left>1?"s":""}</span></div>
    <Bar pct={Math.max(pct,3)} color="linear-gradient(90deg,#22c55e,#4ade80)"/>
    <div style={{fontSize:10,color:"var(--green2)",fontWeight:600,marginTop:5}}>{pct}% vers ce cap</div>
  </div>;
}

// ── Interactive chart ─────────────────────────────────────────────────────────
function Chart({spark}){
  const [tip,setTip]=useState(null);
  const svgRef=useRef(null);
  const W=300,H=90,p=8,max=Math.max(...spark.map(d=>d.v),1);
  const pts=spark.map((d,i)=>({x:p+(i/Math.max(spark.length-1,1))*(W-p*2),y:H-p-(d.v/max)*(H-p*2),c:d.color||"#22c55e",label:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;
  function handle(cx){const rect=svgRef.current?.getBoundingClientRect();if(!rect)return;const x=(cx-rect.left)*(W/rect.width);const i=Math.max(0,Math.min(Math.round(((x-p)/(W-p*2))*(spark.length-1)),spark.length-1));setTip({i,pt:pts[i],px:(pts[i].x/W)*rect.width});}
  return<div style={{position:"relative"}}>
    {tip&&<div className="chart-tip" style={{left:Math.min(Math.max(tip.px-55,0),200),top:-28,color:tip.pt.c}}>{tip.pt.label}</div>}
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,touchAction:"none"}}
      onTouchStart={e=>handle(e.touches[0].clientX)} onTouchMove={e=>handle(e.touches[0].clientX)}
      onTouchEnd={()=>setTimeout(()=>setTip(null),2500)} onClick={e=>handle(e.clientX)}>
      <defs><linearGradient id="cg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity=".28"/><stop offset="100%" stopColor="#22c55e" stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill="url(#cg3)"/>
      <path d={path} fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {[0.33,0.66].map(f=>{const y=H-p-f*(H-p*2);return<line key={f} x1={p} y1={y} x2={W-p} y2={y} stroke="var(--b)" strokeWidth="1" strokeDasharray="3,3"/>;})}
      {pts.map((p,i)=>tip?.i===i?<circle key={i} cx={p.x} cy={p.y} r={5} fill={p.c} stroke="var(--bg2)" strokeWidth="2"/>:<circle key={i} cx={p.x} cy={p.y} r={2} fill={p.c} stroke="var(--bg2)" strokeWidth="1.5"/>)}
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}><span style={{fontSize:9,color:"var(--t3)"}}>Il y a 30j</span><span style={{fontSize:9,color:"var(--t3)"}}>Aujourd'hui</span></div>
  </div>;
}

// ── Widget Manager ────────────────────────────────────────────────────────────
function WidgetManager({widgets,setWidgets,onClose}){
  const [dragIdx,setDragIdx]=useState(null);
  const [overIdx,setOverIdx]=useState(null);
  function drop(toIdx){if(dragIdx===null||dragIdx===toIdx){setDragIdx(null);setOverIdx(null);return;}const w=[...widgets];const item=w.splice(dragIdx,1)[0];w.splice(toIdx,0,item);setWidgets(w);setDragIdx(null);setOverIdx(null);}
  return<div className="mo" onClick={onClose}>
    <div className="mb" onClick={e=>e.stopPropagation()}>
      <div className="mh" onClick={onClose}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontSize:15,fontWeight:600,color:"var(--t)"}}>Personnaliser l'accueil</div>
        <button onClick={onClose} style={{background:"var(--s)",border:"1px solid var(--b)",borderRadius:8,padding:"5px 12px",color:"var(--t2)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Fermer</button>
      </div>
      <div style={{fontSize:11,color:"var(--t3)",marginBottom:12}}>Glisse pour réordonner · Bascule pour activer</div>
      {widgets.map((w,i)=><div key={w.id} className="widget-item"
        style={{opacity:dragIdx===i?.5:1,borderColor:overIdx===i?"var(--green)":"var(--b)",background:overIdx===i?"var(--green3)":"var(--bg2)"}}
        draggable onDragStart={()=>setDragIdx(i)} onDragOver={e=>{e.preventDefault();setOverIdx(i);}} onDragEnd={()=>drop(overIdx??i)}>
        <div style={{color:"var(--t3)",flexShrink:0}}><IcoDrag/></div>
        <div style={{flex:1,fontSize:13,fontWeight:500,color:"var(--t)"}}>{w.label}</div>
        <button className={`toggle${w.enabled?" on":" off"}`} onClick={e=>{e.stopPropagation();setWidgets(prev=>prev.map((x,j)=>j===i?{...x,enabled:!x.enabled}:x));}}/>
      </div>)}
    </div>
  </div>;
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [data,setData]=useState(()=>load(STORE,{}));
  const [goals,setGoals]=useState(()=>load(GSTORE,{target:20,notifOn:false,notifTime:"22:00",cigPerDay:20,cigPackCost:10,jointsPerDay:1,weedGPerJoint:0.3,weedGCost:15}));
  const [activeDrugs,setActiveDrugs]=useState(()=>load(DSTORE,DEFAULT_ACTIVE));
  const [profile,setProfile]=useState(()=>load(PSTORE,{loggedIn:false,name:"",photo:null,motivations:""}));
  const [widgets,setWidgets]=useState(()=>load(WSTORE,DEFAULT_WIDGETS));
  const [tab,setTab]=useState("cal");
  const [calView,setCalView]=useState("month");
  const [weekOffset,setWeekOffset]=useState(0);
  const [modal,setModal]=useState(null);
  const [bop,setBop]=useState(null);
  const [calKey,setCalKey]=useState(0);
  const [expand,setExpand]=useState(null);
  const [showProfile,setShowProfile]=useState(false);
  const [showWidgets,setShowWidgets]=useState(false);
  const [pulse,setPulse]=useState(false);
  const prevStreak=useRef(0);

  useEffect(()=>{try{localStorage.setItem(STORE,JSON.stringify(data));}catch{}},[data]);
  useEffect(()=>{try{localStorage.setItem(GSTORE,JSON.stringify(goals));}catch{}},[goals]);
  useEffect(()=>{try{localStorage.setItem(DSTORE,JSON.stringify(activeDrugs));}catch{}},[activeDrugs]);
  useEffect(()=>{try{localStorage.setItem(PSTORE,JSON.stringify(profile));}catch{}},[profile]);
  useEffect(()=>{try{localStorage.setItem(WSTORE,JSON.stringify(widgets));}catch{}},[widgets]);

  const activeList=useMemo(()=>Object.keys(activeDrugs).filter(k=>activeDrugs[k]),[activeDrugs]);
  const daysCount=daysIn(year,month),offset=firstOff(year,month);

  // Entries — recomputed whenever data OR activeDrugs changes
  const entries=useMemo(()=>Array.from({length:daysCount},(_,i)=>{
    const e=data[dk(year,month,i+1)]||null;
    return{d:i+1,e,clean:isClean(e,activeDrugs)};
  }),[data,year,month,daysCount,activeDrugs]);

  const logged=entries.filter(x=>x.e?.logged).length;
  const nClean=entries.filter(x=>x.clean).length;
  const pct=logged?Math.round((nClean/logged)*100):0;
  const totals=useMemo(()=>{const t={};activeList.forEach(k=>{t[k]=entries.reduce((s,x)=>s+(x.e?.[k]||0),0);});return t;},[entries,activeList]);

  const weeklyData=useMemo(()=>{const wks=[];for(let w=0;w<5;w++){const start=w*7+1,end=Math.min(start+6,daysCount);if(start>daysCount)break;const we=entries.filter(x=>x.d>=start&&x.d<=end);const wk={clean:we.filter(x=>x.clean).length};activeList.forEach(k=>{wk[k]=we.reduce((s,x)=>s+(x.e?.[k]||0),0);});wks.push(wk);}return wks;},[entries,daysCount,activeList]);

  // Streak — recomputed whenever data OR activeDrugs changes
  const [streak,longest]=useMemo(()=>{
    let s=0,cur=new Date(today);
    while(true){const k=dk(cur.getFullYear(),cur.getMonth(),cur.getDate());if(isClean(data[k],activeDrugs)){s++;cur.setDate(cur.getDate()-1);}else break;}
    let lg=0,run=0,pd=null;
    for(const k of Object.keys(data).sort()){if(isClean(data[k],activeDrugs)){const d=new Date(k);if(pd&&(d-pd)/86400000===1){run++;}else{run=1;}lg=Math.max(lg,run);pd=d;}else{run=0;pd=null;}}
    return[s,lg];
  },[data,activeDrugs]);

  useEffect(()=>{if(streak>prevStreak.current){setPulse(true);setTimeout(()=>setPulse(false),600);}prevStreak.current=streak;},[streak]);

  const score=sevrageScore(streak,longest,pct,nClean,daysCount,logged);
  const scoreColor=score>=70?"#22c55e":score>=40?"#f97316":"#ef4444";
  const badges=useMemo(()=>computeBadges(data,activeDrugs),[data,activeDrugs]);
  const earnedCount=badges.filter(b=>b.earned).length;

  // ── Correct money saved ──────────────────────────────────────────────────
  // For cigs: days without any cig × (cigPerDay / cigPackSize) × cigPackCost
  // For weed: days without any joint × jointsPerDay × weedGPerJoint × weedGCost
  const moneySaved=useMemo(()=>{
    const cigDaysClean=entries.filter(x=>x.e?.logged&&(x.e?.tabac||0)===0).length;
    const weedDaysClean=entries.filter(x=>x.e?.logged&&(x.e?.cannabis||0)===0).length;
    const cigCostPerDay=(goals.cigPerDay||20)/20*(goals.cigPackCost||10);
    const weedCostPerDay=(goals.jointsPerDay||1)*(goals.weedGPerJoint||0.3)*(goals.weedGCost||15);
    const cigSaved=cigDaysClean*cigCostPerDay;
    const weedSaved=weedDaysClean*weedCostPerDay;
    return{total:(cigSaved+weedSaved).toFixed(2),cig:cigSaved.toFixed(2),weed:weedSaved.toFixed(2)};
  },[entries,goals]);

  const spark=useMemo(()=>Array.from({length:30},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(29-i));
    const k=dk(d.getFullYear(),d.getMonth(),d.getDate());
    const e=data[k],cl=isClean(e,activeDrugs);
    const tot=e?activeList.reduce((s,dr)=>s+(e[dr]||0),0):0;
    const ms=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
    return{v:cl?3:tot===0?2:tot<=2?1:0,color:cl?"#22c55e":tot===0?"var(--t3)":"#ef4444",label:`${d.getDate()} ${ms[d.getMonth()]} — ${cl?"Clean":tot===0?"Non renseigné":tot+" prise(s)"}`};
  }),[data,activeDrugs,activeList]);

  const aiStats=useMemo(()=>({totals,nClean,daysCount,streak,longest,pct,score}),[totals,nClean,daysCount,streak,longest,pct,score]);

  // Calendar
  const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=daysCount;d++)cells.push(d);while(cells.length%7!==0)cells.push(null);
  function getWD(off){const base=new Date(today);const dow=base.getDay()===0?6:base.getDay()-1;base.setDate(base.getDate()-dow+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return{date:d,key:dk(d.getFullYear(),d.getMonth(),d.getDate())};});}
  const weekDays=getWD(weekOffset);
  const prevMonthCb=useCallback(()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);setCalKey(k=>k+1);},[month]);
  const nextMonthCb=useCallback(()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);setCalKey(k=>k+1);},[month]);
  const monthSwipeRef=useSwipe(nextMonthCb,prevMonthCb);
  const weekSwipeRef=useSwipe(()=>setWeekOffset(w=>w+1),()=>setWeekOffset(w=>w-1));
  const yearSwipeRef=useSwipe(()=>setYear(y=>y+1),()=>setYear(y=>y-1));

  function saveEntry(key,d){setData(prev=>({...prev,[key]:d}));setBop(parseInt(key.split("-")[2]));setTimeout(()=>setBop(null),450);}
  function clearEntry(key){setData(prev=>{const n={...prev};delete n[key];return n;});}

  const riskOrder={"Extrême":0,"Très élevé":1,"Élevé":2,"Modéré":3,"Faible":4};
  const sortedDrugs=Object.entries(ALL_DRUGS).sort((a,b)=>(riskOrder[a[1].risk]||9)-(riskOrder[b[1].risk]||9));
  const enabledWidgets=widgets.filter(w=>w.enabled);

  return<div className="shell">
    {/* Header */}
    <div className="hdr">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div>
          <div style={{fontSize:9,letterSpacing:".15em",color:"var(--t3)",textTransform:"uppercase",fontWeight:600}}>Parcours de guérison</div>
          <h1 style={{fontSize:18,fontWeight:700,color:"var(--t)",lineHeight:1.1,letterSpacing:"-.02em"}}>Habit Tracker</h1>
        </div>
        <button onClick={()=>setShowProfile(true)} style={{width:34,height:34,borderRadius:"50%",background:"var(--s)",border:"1px solid var(--b)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,color:"var(--t2)"}}>
          {profile.photo?<img src={profile.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<IcoUser/>}
        </button>
      </div>
    </div>

    <div className="content">

      {/* ══ PARCOURS ══ */}
      {tab==="cal"&&<div className="tc">
        {/* Score card */}
        <div className="card" style={{background:"linear-gradient(135deg,var(--bg2),var(--bg3))"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:9,color:"var(--t3)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>Score de guérison</div>
              <div style={{fontSize:48,fontWeight:700,color:scoreColor,lineHeight:1,letterSpacing:"-.02em"}}>{score}<span style={{fontSize:18}}>/100</span></div>
              <div style={{fontSize:11,color:"var(--t2)",marginTop:3}}>{score>=70?"Bonne progression":score>=40?"En chemin":score>=20?"Continue":"Commence aujourd'hui"}</div>
              <div style={{marginTop:10}}><Bar pct={score} color={`linear-gradient(90deg,${scoreColor},${scoreColor}88)`} thick/></div>
            </div>
            <div style={{paddingLeft:16}}><Flame streak={streak}/></div>
          </div>
        </div>

        {/* Calendar nav */}
        <div className="nav">
          <button className="nbtn" onClick={calView==="year"?()=>setYear(y=>y-1):calView==="week"?()=>setWeekOffset(w=>w-1):prevMonthCb}>‹</button>
          <div style={{display:"flex",alignItems:"center",gap:7}}>
            <span style={{fontSize:13,fontWeight:600}}>{calView==="year"?year:calView==="week"?`${weekDays[0].date.getDate()}–${weekDays[6].date.getDate()} ${MONTHS_S[weekDays[3].date.getMonth()]} ${weekDays[3].date.getFullYear()}`:`${MONTHS[month]} ${year}`}</span>
            <div className="vpill">
              <button className={`vbtn${calView==="month"?" on":""}`} onClick={()=>setCalView("month")}><IcoMonth/>Mois</button>
              <button className={`vbtn${calView==="week"?" on":""}`} onClick={()=>setCalView("week")}><IcoWeek/>Sem.</button>
              <button className={`vbtn${calView==="year"?" on":""}`} onClick={()=>setCalView("year")}><IcoYear/>Année</button>
            </div>
          </div>
          <button className="nbtn" onClick={calView==="year"?()=>setYear(y=>y+1):calView==="week"?()=>setWeekOffset(w=>w+1):nextMonthCb}>›</button>
        </div>

        {calView==="month"&&<div ref={monthSwipeRef} style={{touchAction:"pan-y"}}>
          <div className="cal-hdr">{DAYS.map(d=><div key={d} className="cdl">{d}</div>)}</div>
          <div className="cal-grid" key={calKey}>
            {cells.map((d,i)=>{
              if(!d)return<div key={`e${i}`}/>;
              const e=data[dk(year,month,d)]||null,col=dayColor(e,activeDrugs);
              const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
              return<div key={d} className={`day${isToday?" td":""}${bop===d?" bop":""}`}

                onClick={()=>setModal({y:date.getFullYear(),m:date.getMonth(),d:date.getDate()})}>
                <div style={{fontSize:9,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",marginBottom:2}}>{DAYS_S[i]}</div>
                <div style={{fontSize:14,fontWeight:700,color:col||(isToday?"var(--green2)":"var(--t)"),marginBottom:2}}>{date.getDate()}</div>
                <div style={{fontSize:9,color:"var(--t3)",marginBottom:2}}>{MONTHS_S[date.getMonth()]}</div>
                <div style={{fontSize:13}}>{e?dayEmoji(e,activeDrugs):"·"}</div>
                {e&&activeList.filter(k=>(e[k]||0)>0).slice(0,2).map(k=><div key={k} style={{fontSize:8,color:ALL_DRUGS[k]?.color,marginTop:1}}>{e[k]}{ALL_DRUGS[k]?.emoji}</div>)}
                {e?.mood!=null&&<div style={{fontSize:10,marginTop:1}}>{MOODS[e.mood]?.e}</div>}
              </div>;
            })}
          </div>
        </div>}

        {calView==="year"&&<div ref={yearSwipeRef} style={{touchAction:"pan-y"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
            {Array.from({length:12},(_,mi)=>{
              const dim=daysIn(year,mi),off=firstOff(year,mi);
              const dots=[];for(let i=0;i<off;i++)dots.push(null);for(let d=1;d<=dim;d++)dots.push(d);
              return<div key={mi} className="ym-card" onClick={()=>{setMonth(mi);setCalView("month");}}>
                <div className="ym-name">{MONTHS_S[mi]}</div>
                <div className="ym-dots">{dots.slice(0,35).map((d,i)=>{const e=d?data[dk(year,mi,d)]||null:null;const col=e?dayColor(e,activeDrugs):null;const iT=d&&d===today.getDate()&&mi===today.getMonth()&&year===today.getFullYear();return<div key={i} className="yd" style={{background:col?col+"cc":iT?"rgba(34,197,94,0.4)":"var(--s2)"}}/>;})}</div>
              </div>;
            })}
          </div>
        </div>}

        <div className="leg">
          <div className="li"><div className="ld" style={{background:"#22c55e"}}/>Clean</div>
          {activeList.map(k=><div key={k} className="li"><div className="ld" style={{background:ALL_DRUGS[k]?.color}}/>{ALL_DRUGS[k]?.name}</div>)}
          <div className="li"><div className="ld" style={{background:"#ef4444"}}/>2+</div>
          <div className="li"><div className="ld" style={{background:"#9f1239"}}/>3+</div>
        </div>
        <div className="ss" style={{marginTop:10}}>
          <div className="m"><div className="v" style={{color:"#22c55e"}}>{nClean}</div><div className="l">jours clean</div></div>
          <div className="m"><div className={`v${pulse?" pulse":""}`} style={{color:"var(--green2)",display:"inline-block"}}>{streak}j</div><div className="l">streak</div></div>
          <div className="m"><div className="v" style={{color:"#a3e635"}}>{pct}%</div><div className="l">taux</div></div>
        </div>

        {/* Widgets */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16,marginBottom:10}}>
          <div style={{fontSize:11,fontWeight:600,color:"var(--t2)"}}>Widgets</div>
          <button onClick={()=>setShowWidgets(true)} style={{background:"var(--s)",border:"1px solid var(--b)",borderRadius:8,padding:"4px 10px",color:"var(--t3)",fontSize:11,cursor:"pointer",fontFamily:"inherit"}}>Personnaliser</button>
        </div>
        {enabledWidgets.map(w=><React.Fragment key={w.id}>
          {w.id==="streak"&&<div className="card" style={{display:"flex",alignItems:"center",gap:16}}>
            <Flame streak={streak}/>
            <div>
              <div style={{fontSize:9,color:"var(--t3)",fontWeight:700,textTransform:"uppercase",letterSpacing:".1em",marginBottom:3}}>Score sevrage</div>
              <div style={{fontSize:30,fontWeight:700,color:scoreColor,letterSpacing:"-.01em"}}>{score}<span style={{fontSize:14}}>/100</span></div>
              <div style={{fontSize:10,color:"var(--t2)"}}>Record : {longest}j</div>
            </div>
          </div>}
          {w.id==="lastdays"&&<div className="card">
            <div className="clbl">7 derniers jours</div>
            <div style={{display:"flex",gap:4}}>
              {Array.from({length:7},(_,i)=>{const d=new Date(today);d.setDate(d.getDate()-(6-i));const k=dk(d.getFullYear(),d.getMonth(),d.getDate());const e=data[k];const col=dayColor(e,activeDrugs);const iT=d.toDateString()===today.toDateString();return<div key={i} onClick={()=>setModal({y:d.getFullYear(),m:d.getMonth(),d:d.getDate()})} style={{flex:1,aspectRatio:1,borderRadius:8,background:col?col+"22":"var(--s)",border:`1px solid ${col||(iT?"rgba(34,197,94,0.5)":"var(--b)")}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",color:col||"var(--t3)"}}>
                <div style={{fontSize:9,color:"var(--t3)"}}>{["L","M","M","J","V","S","D"][(d.getDay()+6)%7]}</div>
                <div style={{fontSize:11,fontWeight:600,marginTop:1}}>{d.getDate()}</div>
                {e&&<div style={{fontSize:9}}>{dayEmoji(e,activeDrugs)}</div>}
              </div>;})}
            </div>
          </div>}
          {w.id==="stats"&&<div className="card">
            <div className="clbl">Ce mois — {MONTHS_S[month]}</div>
            <div style={{display:"grid",gridTemplateColumns:`repeat(${Math.min(activeList.length,3)},1fr)`,gap:8}}>
              {activeList.map(k=>{const d=ALL_DRUGS[k];const v=totals[k]||0;return<div key={k} style={{textAlign:"center",padding:"8px 4px",background:"var(--s)",borderRadius:10}}>
                <div style={{fontSize:9,marginBottom:2}}>{d.emoji}</div>
                <div style={{fontSize:18,fontWeight:700,color:v>0?d.color:"var(--t3)"}}>{v}</div>
                <div style={{fontSize:9,color:"var(--t3)"}}>{d.unitShort}</div>
              </div>;})}
            </div>
          </div>}
          {w.id==="milestone"&&<NextMilestone streak={streak} activeDrugs={activeDrugs}/>}
          {w.id==="money"&&<div className="card" style={{background:"rgba(168,85,247,0.07)",borderColor:"rgba(168,85,247,0.18)"}}>
            <div style={{fontSize:11,color:"#a855f7",fontWeight:600,marginBottom:3}}>Économies estimées ce mois</div>
            <div style={{fontSize:30,fontWeight:700,color:"#d8b4fe",letterSpacing:"-.01em"}}>{moneySaved.total}€</div>
            <div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>{moneySaved.cig}€ cigs · {moneySaved.weed}€ weed</div>
          </div>}
          {w.id==="fact"&&<div className="card" style={{background:"var(--green3)",border:"1px solid rgba(34,197,94,0.2)"}}>
            <div style={{fontSize:9,color:"var(--green)",fontWeight:700,marginBottom:5,letterSpacing:".08em",textTransform:"uppercase"}}>Fait médical</div>
            <p style={{fontSize:12,color:"var(--t)",lineHeight:1.6,fontStyle:"italic"}}>{streak>=90?"90j : poumons restaurés, +30% capacité. Risque cardio cliniquement réduit.":streak>=30?"30j : foie partiellement régénéré. Récepteurs dopaminergiques en récupération.":streak>=14?"2 semaines : mémoire à court terme mesurément améliorée.":streak>=7?"7j : circulation sanguine améliorée. Oxygénation cellulaire optimisée.":streak>=3?"72h : substances en cours d'élimination. SNC recalibre ses neurotransmetteurs.":"Chaque heure sans consommer modifie la chimie de ton cerveau."}</p>
          </div>}
        </React.Fragment>)}
      </div>}

      {/* ══ GUÉRISON ══ */}
      {tab==="heal"&&<div className="tc">
        {/* Score — no duplicate streak/flame */}
        <div className="card" style={{background:"linear-gradient(135deg,var(--bg2),var(--bg3))"}}>
          <div style={{fontSize:9,color:"var(--t3)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>Score de guérison</div>
          <div style={{fontSize:48,fontWeight:700,color:scoreColor,lineHeight:1,letterSpacing:"-.02em"}}>{score}<span style={{fontSize:18}}>/100</span></div>
          <div style={{fontSize:11,color:"var(--t2)",marginTop:3}}>Streak {streak}j · Record {longest}j · {pct}% clean</div>
          <div style={{marginTop:10}}><Bar pct={score} color={`linear-gradient(90deg,${scoreColor},${scoreColor}66)`} thick/></div>
        </div>

        <NextMilestone streak={streak} activeDrugs={activeDrugs}/>

        {/* Organ flip cards */}
        <div className="card">
          <div className="clbl">Tes organes — tap pour détails</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            {[{k:"poumons",e:"🫁",n:"Poumons"},{k:"coeur",e:"🫀",n:"Cœur"},{k:"cerveau",e:"🧠",n:"Cerveau"},{k:"foie",e:"🟤",n:"Foie"}].map(o=><OrganCard key={o.k} organKey={o.k} emoji={o.e} name={o.n} streak={streak} activeDrugs={activeDrugs}/>)}
          </div>
          <div style={{fontSize:10,color:"var(--t3)",textAlign:"center"}}>Basé sur le streak actuel · Tap = impact médical détaillé</div>
        </div>

        <DrugTimeline streak={streak} activeDrugs={activeDrugs}/>

        {/* Chart */}
        <div className="xcard">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
            <div className="clbl" style={{margin:0}}>Tendance 30 jours</div>
            <button className="xbtn" style={{position:"relative",top:0,right:0}} onClick={()=>setExpand("spark")}><IcoExpand/></button>
          </div>
          <Chart spark={spark}/>
        </div>

        {/* Weekly bars */}
        <div className="xcard">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div className="clbl" style={{margin:0}}>Par semaine</div>
            <button className="xbtn" onClick={()=>setExpand("weekly")}><IcoExpand/></button>
          </div>
          <div style={{marginBottom:7}}><div style={{fontSize:9,color:"var(--green)",fontWeight:600,marginBottom:4}}>Jours clean</div><WeekBars weeks={weeklyData} metric="clean" color="#22c55e"/></div>
          {activeList.slice(0,2).map(k=><div key={k} style={{marginBottom:7}}><div style={{fontSize:9,color:ALL_DRUGS[k]?.color,fontWeight:600,marginBottom:4}}>{ALL_DRUGS[k]?.emoji} {ALL_DRUGS[k]?.name}</div><WeekBars weeks={weeklyData} metric={k} color={ALL_DRUGS[k]?.color}/></div>)}
        </div>

        <div className="card" style={{background:"var(--green3)",border:"1px solid rgba(34,197,94,0.2)"}}>
          <div style={{fontSize:9,color:"var(--green)",fontWeight:700,marginBottom:5,letterSpacing:".08em",textTransform:"uppercase"}}>Fait médical</div>
          <p style={{fontSize:12,color:"var(--t)",lineHeight:1.6,fontStyle:"italic"}}>{streak>=90?"90j : poumons restaurés, +30% capacité. Risque cardio cliniquement réduit.":streak>=30?"30j : foie partiellement régénéré. Récepteurs dopaminergiques en récupération.":streak>=14?"2 semaines : mémoire à court terme mesurément améliorée.":streak>=7?"7j : circulation sanguine améliorée.":streak>=3?"72h : substances en élimination. SNC recalibre ses neurotransmetteurs.":"Chaque heure sans consommer modifie la chimie de ton cerveau."}</p>
        </div>
      </div>}

      {/* ══ BADGES ══ */}
      {tab==="badges"&&<div className="tc">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div style={{fontSize:12,color:"var(--t2)"}}><span style={{color:"var(--green2)",fontWeight:700}}>{earnedCount}</span>/{badges.length}</div>
          <div style={{fontSize:11,color:"var(--green)",fontWeight:700}}>{Math.round((earnedCount/badges.length)*100)}%</div>
        </div>
        <div style={{marginBottom:12}}><Bar pct={(earnedCount/badges.length)*100} color="linear-gradient(90deg,#22c55e,#4ade80)"/></div>
        {badges.map(b=><React.Fragment key={b.id}>
          {b.cat&&<div className="badge-cat">{b.cat}</div>}
          <div className={`badge${b.earned?" earned":" locked"}`}>
            <div className="badge-icon" style={{filter:b.earned?"none":"grayscale(1) opacity(0.25)"}}>{b.icon}</div>
            <div style={{flex:1}}>
              <div className="badge-name" style={{color:b.earned?"var(--t)":"var(--t3)"}}>{b.name}</div>
              <div className="badge-desc">{b.desc}</div>
            </div>
            {b.earned&&<div style={{color:"var(--green)",fontSize:13,marginLeft:"auto",flexShrink:0}}>✓</div>}
          </div>
        </React.Fragment>)}
      </div>}

      {/* ══ CONFIG ══ */}
      {tab==="goals"&&<div className="tc">
        <div className="card">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <div style={{width:32,height:32,borderRadius:8,background:"var(--s2)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--t2)",flexShrink:0}}><svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/></svg></div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--t)"}}>Substances actives</div>
          </div>
          {sortedDrugs.map(([k,d])=><div key={k} className={`drug-chip${activeDrugs[k]?" on":""}`} onClick={()=>setActiveDrugs(prev=>({...prev,[k]:!prev[k]}))}>
            <div style={{fontSize:17,width:26,textAlign:"center"}}>{d.emoji}</div>
            <div style={{flex:1}}><div style={{fontSize:13,fontWeight:500,color:activeDrugs[k]?d.color:"var(--t3)"}}>{d.name}</div><div style={{fontSize:10,color:"var(--t3)"}}>{d.unit}</div></div>
            <div style={{fontSize:10,padding:"2px 8px",borderRadius:10,fontWeight:600,background:`${d.riskColor}22`,color:d.riskColor,flexShrink:0}}>{d.risk}</div>
            <div style={{marginLeft:8,flexShrink:0}}><div className={`toggle${activeDrugs[k]?" on":" off"}`} style={{background:activeDrugs[k]?d.color:undefined}}/></div>
          </div>)}
        </div>

        {/* Consumption settings — for accurate money calc */}
        <div className="card">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <div style={{width:32,height:32,borderRadius:8,background:"var(--s2)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--t2)",flexShrink:0}}><svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--t)"}}>Ma consommation habituelle</div>
          </div>
          <div style={{fontSize:11,color:"var(--t3)",marginBottom:12}}>Pour calculer tes vraies économies</div>
          {[
            {l:"Cigarettes par jour",k:"cigPerDay",step:1},
            {l:"Prix d'un paquet (€)",k:"cigPackCost",step:0.5},
            {l:"Joints par jour",k:"jointsPerDay",step:0.5},
            {l:"Grammes par joint",k:"weedGPerJoint",step:0.1},
            {l:"Prix cannabis / g (€)",k:"weedGCost",step:0.5},
          ].map(g=><div key={g.k} className="gr"><span>{g.l}</span><input type="number" value={goals[g.k]||0} onChange={e=>setGoals(p=>({...p,[g.k]:+e.target.value}))} min="0" step={g.step}/></div>)}
          <div style={{padding:"10px 12px",background:"var(--green3)",borderRadius:10,border:"1px solid rgba(34,197,94,0.2)"}}>
            <div style={{fontSize:11,color:"var(--green)",fontWeight:600,marginBottom:3}}>Économies ce mois</div>
            <div style={{fontSize:24,fontWeight:700,color:"var(--green2)"}}>{moneySaved.total}€</div>
            <div style={{fontSize:10,color:"var(--t3)",marginTop:2}}>{moneySaved.cig}€ cigs · {moneySaved.weed}€ cannabis</div>
          </div>
        </div>

        <div className="card">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <div style={{width:32,height:32,borderRadius:8,background:"var(--s2)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--t2)",flexShrink:0}}><svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--t)"}}>Objectif mensuel</div>
          </div>
          <div className="gr"><span>Jours clean visés / mois</span><input type="number" value={goals.target} onChange={e=>setGoals(p=>({...p,target:+e.target.value}))} min="1" max="31"/></div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,color:"var(--t)"}}>Progression</span><span style={{fontSize:12,fontWeight:700,color:"var(--green)"}}>{nClean} / {goals.target}</span></div>
          <Bar pct={Math.min((nClean/Math.max(goals.target,1))*100,100)} color="linear-gradient(90deg,#22c55e,#4ade80)" thick/>
          {nClean>=goals.target&&<div className="sban">Objectif atteint !</div>}
        </div>

        <div className="card">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <div style={{width:32,height:32,borderRadius:8,background:"var(--s2)",display:"flex",alignItems:"center",justifyContent:"center",color:"var(--t2)",flexShrink:0}}><svg width={16} height={16} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></div>
            <div style={{fontSize:13,fontWeight:600,color:"var(--t)"}}>Rappel quotidien</div>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:goals.notifOn?10:0}}>
            <div><div style={{fontSize:12,color:"var(--t)",fontWeight:500}}>Notification du soir</div><div style={{fontSize:10,color:"var(--t3)",marginTop:1}}>Rappel de renseigner ta journée</div></div>
            <button className={`toggle${goals.notifOn?" on":" off"}`} onClick={async()=>{if(!goals.notifOn){if("Notification" in window){const p=await Notification.requestPermission();if(p==="granted")setGoals(g=>({...g,notifOn:true}));}else setGoals(g=>({...g,notifOn:true}));}else setGoals(g=>({...g,notifOn:false}));}}/>
          </div>
          {goals.notifOn&&<div className="gr" style={{marginBottom:0}}><span>Heure</span><input type="time" value={goals.notifTime||"22:00"} onChange={e=>setGoals(p=>({...p,notifTime:e.target.value}))}/></div>}
        </div>

        <div className="sg">
          <div className="sm"><div className="v" style={{color:"var(--green)"}}>{streak}j</div><div className="l">streak</div></div>
          <div className="sm"><div className="v" style={{color:scoreColor}}>{score}</div><div className="l">score</div></div>
          <div className="sm"><div className="v" style={{color:"var(--green2)"}}>{earnedCount}</div><div className="l">badges</div></div>
          <div className="sm"><div className="v" style={{color:"#a855f7"}}>{longest}j</div><div className="l">record</div></div>
        </div>
      </div>}
    </div>

    {/* ══ Tabs ══ */}
    <div className="tabs">
      {[["cal",<IcoCalendar/>,"Parcours"],["heal",<IcoHeart/>,"Guérison"],["badges",<IcoBadge/>,"Badges"],["goals",<IcoSettings/>,"Config"]].map(([k,icon,label])=><button key={k} className={`tb${tab===k?" on":""}`} onClick={()=>setTab(k)}>{icon}{label}</button>)}
    </div>

    {/* ══ Expand overlays ══ */}
    {expand==="weekly"&&<ExpandView title="Progression hebdomadaire" onClose={()=>setExpand(null)}>
      {[{metric:"clean",color:"#22c55e",label:"Jours clean",e:"✦"},...activeList.map(k=>({metric:k,color:ALL_DRUGS[k]?.color,label:ALL_DRUGS[k]?.name,e:ALL_DRUGS[k]?.emoji}))].map(m=><div key={m.metric} style={{background:"var(--s)",borderRadius:13,padding:13}}>
        <div style={{fontSize:11,color:m.color,fontWeight:600,marginBottom:9}}>{m.e} {m.label}</div>
        <WeekBars weeks={weeklyData} metric={m.metric} color={m.color}/>
      </div>)}
      <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
    </ExpandView>}

    {expand==="spark"&&<ExpandView title="Tendance 30 jours" onClose={()=>setExpand(null)}>
      <div style={{background:"var(--s)",borderRadius:14,padding:14}}><Chart spark={spark}/></div>
      <div style={{background:"var(--s)",borderRadius:13,padding:13}}>
        {[{l:"Jours clean",v:nClean,c:"#22c55e"},...activeList.map(k=>({l:ALL_DRUGS[k]?.name,v:totals[k]||0,c:ALL_DRUGS[k]?.color}))].map(b=><div key={b.l} style={{marginBottom:9}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11,color:"var(--t2)"}}>{b.l}</span><span style={{fontSize:11,fontWeight:700,color:b.c}}>{b.v}</span></div>
          <Bar pct={Math.min((b.v/Math.max(daysCount,1))*100,100)} color={b.c}/>
        </div>)}
      </div>
      <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
    </ExpandView>}

    {showProfile&&<ProfileModal profile={profile} setProfile={setProfile} onClose={()=>setShowProfile(false)}/>}
    {showWidgets&&<WidgetManager widgets={widgets} setWidgets={setWidgets} onClose={()=>setShowWidgets(false)}/>}
    {modal&&<DayModal modal={modal} data={data} activeDrugs={activeDrugs} onSave={saveEntry} onClear={clearEntry} onClose={()=>setModal(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
</body>
</html>
