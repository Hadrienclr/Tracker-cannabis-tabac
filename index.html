<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme:dark)"/>
  <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme:light)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Habit Tracker"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Habit Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0a0a0f;--bg2:#12121c;--bg3:#1a1a28;
      --s:rgba(255,255,255,0.04);--s2:rgba(255,255,255,0.08);
      --b:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.14);
      --t:#e8e8f0;--t2:#9ca3af;--t3:#6b7280;
      --green:#22c55e;--green2:#4ade80;--green3:rgba(34,197,94,0.12);
      --sh:0 2px 16px rgba(0,0,0,0.35);
    }
    @media(prefers-color-scheme:light){:root{
      --bg:#f0f4f8;--bg2:#ffffff;--bg3:#e8edf4;
      --s:rgba(0,0,0,0.04);--s2:rgba(0,0,0,0.08);
      --b:rgba(0,0,0,0.08);--b2:rgba(0,0,0,0.14);
      --t:#0f172a;--t2:#475569;--t3:#94a3b8;
      --green:#16a34a;--green2:#15803d;--green3:rgba(22,163,74,0.1);
      --sh:0 2px 12px rgba(0,0,0,0.08);
    }}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--bg);color:var(--t);font-family:'Inter',system-ui,sans-serif;overflow:hidden;}
    #root{height:100%;}
    .shell{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);}
    .hdr{padding:10px 16px 0;flex-shrink:0;}
    .content{flex:1;overflow-y:auto;padding:8px 16px 160px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .content::-webkit-scrollbar{display:none;}
    .tabs{position:fixed;bottom:0;left:0;right:0;padding:6px 6px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,10,15,0.96);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--b);display:flex;gap:2px;z-index:50;}
    @media(prefers-color-scheme:light){.tabs{background:rgba(240,244,248,0.96);}}
    .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:10px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:9px;font-weight:600;color:var(--t3);transition:color .2s ease,background .2s ease;}
    .tb.on{background:var(--green3);color:var(--green2);}
    .tb svg{transition:transform .28s cubic-bezier(.22,1,.36,1);}
    .tb.on svg{transform:scale(1.1);}
    .tc{animation:tcIn .26s cubic-bezier(.22,1,.36,1);}
    @keyframes tcIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    .card{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);}
    .xcard{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;position:relative;box-shadow:var(--sh);}
    .xbtn{position:absolute;top:11px;right:11px;background:var(--s);border:1px solid var(--b);border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .clbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;}
    .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .sm{background:var(--bg2);border:1px solid var(--b);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--sh);}
    .sm .v{font-size:22px;font-weight:700;}
    .sm .l{font-size:9px;color:var(--t3);margin-top:2px;}
    .pb{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px;}
    .pf{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1);}
    .pb.t{height:9px;}
    .pulse{animation:sp .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes sp{0%{transform:scale(1)}50%{transform:scale(1.32)}100%{transform:scale(1)}}
    .gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
    .gr span{font-size:12px;color:var(--t2);}
    .sban{margin-top:8px;padding:8px 12px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:11px;color:var(--green2);text-align:center;}
    .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .nbtn{background:var(--s);border:1px solid var(--b);color:var(--t);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .14s,transform .14s;}
    .nbtn:active{background:var(--s2);transform:scale(0.88);}
    .vpill{display:flex;background:var(--s);border-radius:8px;padding:2px;gap:2px;}
    .vbtn{padding:4px 9px;border-radius:6px;border:none;font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--t3);transition:all .18s;display:flex;align-items:center;gap:3px;}
    .vbtn.on{background:var(--green3);color:var(--green2);}
    .cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
    .cdl{text-align:center;font-size:10px;font-weight:600;color:var(--t3);padding:3px 0;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1.5px solid transparent;font-size:11px;font-weight:500;user-select:none;opacity:0;animation:cPop forwards;transition:transform .14s,background .2s,border-color .2s;}
    .day:active{transform:scale(0.87)!important;}
    .day.td{border-color:rgba(34,197,94,0.6)!important;}
    .day.bop{animation:cBop .36s cubic-bezier(.34,1.56,.64,1) forwards!important;}
    .day.future{opacity:0.2!important;cursor:default!important;pointer-events:none;}
    .dot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#a855f7;}
    @keyframes cPop{0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)}}
    @keyframes cBop{0%{transform:scale(1)}35%{transform:scale(1.26)}65%{transform:scale(0.93)}100%{transform:scale(1)}}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
    .wday{border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:10px 2px;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:transform .14s,background .2s;}
    .wday:active{transform:scale(0.92);}
    .wday.td{border-color:rgba(34,197,94,0.6)!important;}
    .wday.future{opacity:0.2;cursor:default;pointer-events:none;}
    .year-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
    .ym-card{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:8px 6px;cursor:pointer;transition:all .15s;}
    .ym-card:active{transform:scale(0.96);}
    .ym-name{font-size:10px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em;}
    .ym-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:1.5px;}
    .yd{aspect-ratio:1;border-radius:2px;}
    /* Organ flip */
    .organ-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
    .organ-flip{perspective:900px;height:140px;cursor:pointer;}
    .organ-flip-inner{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;}
    .organ-flip.flipped .organ-flip-inner{transform:rotateY(180deg);}
    .organ-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--b);background:var(--bg2);box-shadow:var(--sh);}
    .organ-front{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;}
    .organ-back-face{transform:rotateY(180deg);background:var(--bg3);padding:10px 11px;display:flex;flex-direction:column;justify-content:space-between;}
    .organ-pb{height:4px;border-radius:2px;background:var(--s2);overflow:hidden;margin-top:4px;width:100%;}
    .organ-pf{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}
    .flip-hint{position:absolute;top:7px;right:8px;opacity:0.3;color:var(--t3);}
    /* Level modal */
    .level-modal{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;animation:moFade .2s ease;}
    .level-box{background:var(--bg2);border:1px solid var(--b);border-radius:20px;padding:24px;width:100%;max-width:340px;max-height:80vh;overflow-y:auto;}
    .level-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--b);}
    .level-row:last-child{border-bottom:none;}
    /* Milestone */
    .milestone-card{background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(168,85,247,0.06));border:1px solid rgba(34,197,94,0.25);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;}
    .mg{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.2),transparent);pointer-events:none;}
    .drug-tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
    .drug-tab{padding:4px 10px;border-radius:20px;border:1px solid var(--b);background:var(--s);color:var(--t3);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s;}
    .drug-tab.on{border-color:currentColor;}
    .rec-step{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
    .wbar-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:3px;height:70px;}
    .wbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
    .wbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;}
    .wbar-lbl{font-size:9px;color:var(--t3);font-weight:600;}
    .wbar-val{font-size:8px;font-weight:700;}
    .ai-box{background:var(--green3);border:1px solid rgba(34,197,94,0.2);border-radius:13px;padding:13px;margin-top:8px;}
    .ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:aiP 2s infinite;flex-shrink:0;}
    @keyframes aiP{0%,100%{opacity:1}50%{opacity:.3}}
    .ai-text{font-size:12px;color:var(--t);line-height:1.65;}
    .ai-loading{display:flex;gap:4px;align-items:center;padding:6px 0;}
    .ai-loading span{width:5px;height:5px;border-radius:50%;background:var(--green);animation:dots 1.2s infinite;}
    .ai-loading span:nth-child(2){animation-delay:.2s;}
    .ai-loading span:nth-child(3){animation-delay:.4s;}
    @keyframes dots{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}
    .ai-sec{margin-top:8px;padding-top:8px;border-top:1px solid rgba(34,197,94,0.15);}
    .ai-sec-t{font-size:9px;color:var(--green);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
    /* Modal */
    .mo{position:fixed;inset:0;background:rgba(0,0,0,0.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:200;display:flex;align-items:flex-end;animation:moFade .2s ease;}
    @keyframes moFade{from{opacity:0}to{opacity:1}}
    .mb{background:var(--bg2);border:1px solid var(--b);border-radius:22px 22px 0 0;padding:18px 15px;padding-bottom:max(24px,calc(16px + env(safe-area-inset-bottom,0px)));width:100%;animation:mbSlide .3s cubic-bezier(.22,1,.36,1);max-height:90vh;overflow-y:auto;}
    @keyframes mbSlide{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .mh{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 14px;cursor:pointer;}
    .ctr-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:11px;border:1.5px solid transparent;margin-bottom:6px;}
    .ctr-row.active{border-color:currentColor;}
    .ctr-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
    .ctr-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
    .ctr-lbl{font-size:13px;font-weight:500;}
    .ctr-sub{font-size:10px;color:var(--t3);margin-top:1px;}
    .ctr-right{display:flex;align-items:center;flex-shrink:0;}
    .ctr-btn{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--b2);background:var(--s);color:var(--t);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;}
    .ctr-btn:active{background:var(--s2);}
    .ctr-val{min-width:36px;text-align:center;font-size:17px;font-weight:700;}
    .slbl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;margin-top:8px;}
    .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
    .tag{padding:5px 10px;border-radius:18px;border:1px solid var(--b);background:var(--s);font-size:11px;font-weight:500;cursor:pointer;color:var(--t3);transition:all .15s;}
    .tag.on{background:var(--green3);border-color:rgba(34,197,94,0.35);color:var(--green2);}
    .mood-row{display:flex;gap:5px;margin-bottom:10px;}
    .mood-btn{flex:1;padding:8px 2px;border-radius:10px;border:1.5px solid transparent;background:var(--s);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .18s;}
    .mood-btn.on{border-color:currentColor;}
    .mood-btn span:first-child{font-size:18px;}
    .mood-btn span:last-child{font-size:9px;font-weight:600;}
    textarea{background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--t);font-family:inherit;font-size:16px;padding:9px;width:100%;outline:none;resize:none;margin-top:4px;transition:border-color .2s;}
    textarea:focus{border-color:rgba(34,197,94,0.4);}
    input[type="number"],input[type="time"],input[type="text"]{background:var(--s);border:1px solid var(--b);border-radius:8px;color:var(--t);font-family:inherit;font-size:16px;padding:7px 9px;outline:none;transition:border-color .2s;}
    input:focus{border-color:rgba(34,197,94,0.4);}
    input[type="number"],input[type="text"]{width:88px;}
    input[type="time"]{width:auto;}
    .bprim{width:100%;padding:13px;border-radius:11px;background:rgba(34,197,94,0.15);border:1.5px solid rgba(34,197,94,0.3);color:var(--green2);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-top:12px;transition:background .18s;}
    .bprim:active{background:rgba(34,197,94,0.25);}
    .leg{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:8px;}
    .li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--t3);}
    .ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .ss{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;}
    .ss .m{background:var(--bg2);border:1px solid var(--b);border-radius:9px;padding:8px 4px;text-align:center;}
    .ss .m .v{font-size:15px;font-weight:700;}
    .ss .m .l{font-size:9px;color:var(--t3);margin-top:1px;}
    .drug-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;border:1.5px solid transparent;margin-bottom:7px;cursor:pointer;background:var(--s);transition:all .18s;}
    .drug-chip.on{background:var(--green3);border-color:rgba(34,197,94,0.25);}
    .toggle{width:42px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s;}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
    .toggle.on{background:var(--green);}.toggle.on::after{transform:translateX(18px);}
    .toggle.off{background:var(--b2);}
    .badge{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;border:1px solid transparent;transition:all .15s;}
    .badge.earned{background:var(--green3);border-color:rgba(34,197,94,0.18);}
    .badge.locked{opacity:.35;}
    .badge-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
    .badge-name{font-size:12px;font-weight:600;}
    .badge-desc{font-size:10px;color:var(--t3);margin-top:1px;}
    .badge-cat{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px;padding-left:2px;}
    .exp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:300;display:flex;flex-direction:column;animation:moFade .22s ease;padding:env(safe-area-inset-top,16px) 14px 16px;}
    @media(prefers-color-scheme:light){.exp-overlay{background:rgba(240,244,248,0.97);}}
    .exp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-top:2px;}
    .exp-title{font-size:16px;font-weight:600;color:var(--t);}
    .exp-close{background:var(--s);border:1px solid var(--b);border-radius:9px;color:var(--t);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .exp-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
    .chart-tip{position:absolute;background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:600;pointer-events:none;z-index:10;white-space:nowrap;box-shadow:var(--sh);color:var(--t);}
    .flame-svg{animation:fw 2s ease-in-out infinite;}
    @keyframes fw{0%,100%{transform:scaleY(1) scaleX(1)}25%{transform:scaleY(1.06) scaleX(0.97)}75%{transform:scaleY(0.96) scaleX(1.03)}}
    .social-btn{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid var(--b);background:var(--s);cursor:pointer;margin-bottom:8px;width:100%;font-family:inherit;font-size:13px;font-weight:500;color:var(--t);transition:background .15s;}
    .social-btn:active{background:var(--s2);}
    .profile-avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid rgba(34,197,94,0.4);}
    .avatar-icon{width:68px;height:68px;border-radius:50%;background:var(--s2);border:1px solid var(--b);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;color:var(--t2);}
    .motiv-area{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px;min-height:80px;color:var(--t);font-family:inherit;font-size:13px;line-height:1.6;width:100%;outline:none;resize:none;transition:border-color .2s;}
    .motiv-area:focus{border-color:rgba(34,197,94,0.4);}
    .widget-list{display:flex;flex-direction:column;gap:6px;}
    .wdg-item{background:var(--bg2);border:1px solid var(--b);border-radius:13px;padding:13px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);touch-action:none;user-select:none;transition:border-color .15s,background .15s,opacity .15s;}
    .wdg-item.dragging{opacity:0.5;}
    .wdg-item.over{border-color:var(--green);background:var(--green3);}
    /* Onboarding */
    .onboard-wrap{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 0;overflow:hidden;}
    .onboard-slides{flex:1;overflow:hidden;position:relative;width:100%;}
    .onboard-slide{display:flex;flex-direction:column;height:100%;padding:0 24px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;float:left;}
    .onboard-footer{padding:16px 24px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));flex-shrink:0;}
    .onboard-dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px;}
    .onboard-dot{width:6px;height:6px;border-radius:50%;background:var(--b2);transition:all .2s;}
    .onboard-dot.on{background:var(--green);width:18px;border-radius:3px;}
    .drug-select-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
    .drug-select-item{border:1.5px solid var(--b);border-radius:12px;padding:10px;cursor:pointer;background:var(--s);display:flex;align-items:center;gap:8px;transition:all .15s;}

function isClean(e,active){if(!e)return false;if(e.clean)return true;if(!e.logged)return false;return Object.keys(active).filter(k=>active[k]).every(k=>(e[k]||0)===0);}
function dayColor(e,active){if(!e)return null;if(isClean(e,active))return"#22c55e";const u=Object.keys(active).filter(k=>active[k]&&(e[k]||0)>0);if(!u.length)return null;if(u.length>=3)return"#9f1239";if(u.length===2)return"#ef4444";return ALL_DRUGS[u[0]]?.color||"#6b7280";}
function dayEmoji(e,active){if(!e)return"·";if(isClean(e,active))return"✦";const u=Object.keys(active).filter(k=>active[k]&&(e[k]||0)>0);if(!u.length)return"·";if(u.length>=3)return"💀";if(u.length===2)return"⚠";return ALL_DRUGS[u[0]]?.emoji||"·";}

function sevrageScore(streak,longest,pct,nClean,daysCount,logged,activeDrugs){
  if(daysCount===0)return 0;
  const active=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  const maxDays=active.length>0?Math.max(...active.map(k=>DRUG_SEVRAGE_DAYS[k]||90)):90;
  const a=pct;
  const b=Math.min((streak/maxDays)*100,100);
  const c=Math.min((longest/maxDays)*100,100);
  const d=daysCount>0?Math.min((logged/daysCount)*100,100):0;
  return Math.round(a*0.45+b*0.3+c*0.15+d*0.1);
}

function getLevel(streak,activeDrugs){
  const active=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  if(!active.length)return{level:1,label:"Début",color:"#6b7280",pct:0,nextDays:30,maxDays:30};
  const maxDays=Math.max(...active.map(k=>DRUG_SEVRAGE_DAYS[k]||90));
  const pct=Math.min((streak/maxDays)*100,100);
  if(pct>=100)return{level:5,label:"Libéré ✦",color:"#a855f7",pct:100,nextDays:null,maxDays};
  if(pct>=66)return{level:4,label:"En force",color:"#22c55e",pct,nextDays:Math.ceil(maxDays-streak),maxDays};
  if(pct>=33)return{level:3,label:"En chemin",color:"#4ade80",pct,nextDays:Math.ceil(maxDays*0.66-streak),maxDays};
  if(pct>=10)return{level:2,label:"Départ",color:"#f97316",pct,nextDays:Math.ceil(maxDays*0.33-streak),maxDays};
  return{level:1,label:"Début",color:"#6b7280",pct,nextDays:Math.ceil(maxDays*0.1-streak),maxDays};
}

function Bar({pct,color,thick}){const ref=useRef(null);useEffect(()=>{if(!ref.current)return;ref.current.style.width="0%";const t=setTimeout(()=>{if(ref.current)ref.current.style.width=pct+"%";},80);return()=>clearTimeout(t);},[pct]);return<div className={`pb${thick?" t":""}`}><div ref={ref} className="pf" style={{background:color}}/></div>;}
function OBar({pct,color}){const ref=useRef(null);useEffect(()=>{if(!ref.current)return;ref.current.style.width="0%";const t=setTimeout(()=>{if(ref.current)ref.current.style.width=pct+"%";},250);return()=>clearTimeout(t);},[pct]);return<div ref={ref} className="organ-pf" style={{background:color}}/>;}
function ExpandView({title,onClose,children}){return<div className="exp-overlay"><div className="exp-hdr"><div className="exp-title">{title}</div><button className="exp-close" onClick={onClose}><IcoClose/></button></div><div className="exp-body">{children}</div></div>;}
function WeekBars({weeks,metric,color}){const max=Math.max(...weeks.map(w=>w[metric]||0),1);return<div className="wbar-wrap">{weeks.map((w,i)=>{const v=w[metric]||0;const h=Math.max((v/max)*62,v>0?4:2);return<div key={i} className="wbar-col"><div className="wbar-val" style={{color:v>0?color:"var(--t3)"}}>{v>0?v:""}</div><div className="wbar" style={{height:h,background:v>0?color:"var(--s2)"}}/><div className="wbar-lbl">S{i+1}</div></div>;})}</div>;}
function useSwipe(onLeft,onRight){const ref=useRef(null);useEffect(()=>{const el=ref.current;if(!el)return;let sx=0,sy=0;const ts=e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;};const te=e=>{const t=e.changedTouches[0];const dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>Math.abs(dy)*1.4&&Math.abs(dx)>40){if(dx<0)onLeft();else onRight();}};el.addEventListener("touchstart",ts,{passive:true});el.addEventListener("touchend",te,{passive:true});return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchend",te);};},[onLeft,onRight]);return ref;}

// ── Organ card ────────────────────────────────────────────────────────────────
function OrganCard({organKey,emoji,name,streak,activeDrugs,loggedDays}){
  const [flipped,setFlipped]=useState(false);
  const active=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  const maxD=active.reduce((mx,k)=>Math.max(mx,ALL_DRUGS[k]?.organs?.[organKey]||0),0);
  const maxDays=active.length>0?Math.max(...active.map(k=>DRUG_SEVRAGE_DAYS[k]||90)):90;
  const hr=Math.min(streak/maxDays,1);
  const health=maxD===0?100:Math.round(30+(100-30)*(1-maxD/100*(1-hr)));
  const color=health>=80?"#22c55e":health>=60?"#4ade80":health>=40?"#f97316":"#ef4444";
  const status=health>=80?"Bon état":health>=60?"En récupération":health>=40?"Effort visible":"En cours";

  const drugs=Object.keys(activeDrugs).filter(k=>activeDrugs[k]&&ALL_DRUGS[k]?.recovery?.length>0);
  const [sel,setSel]=useState(()=>drugs[0]||null);
  useEffect(()=>{if(drugs.length>0&&!drugs.includes(sel))setSel(drugs[0]);},[drugs.join(",")]);
  if(!drugs.length||!sel)return null;
  const d=ALL_DRUGS[sel];
  const totalDays=DRUG_SEVRAGE_DAYS[sel]||90;
  const swRef=useSwipe(()=>{const i=drugs.indexOf(sel);if(i<drugs.length-1)setSel(drugs[i+1]);},()=>{const i=drugs.indexOf(sel);if(i>0)setSel(drugs[i-1]);});

        <div style={{fontSize:10,color:"var(--t3)"}}>Streak : <span style={{color:d.color,fontWeight:700}}>{streak}j</span></div>
        <div style={{fontSize:10,color:"var(--t3)"}}>Objectif : <span style={{color:d.color,fontWeight:700}}>{totalDays}j</span></div>

        </div>
      </div>;})}
    </div>
  </div>;
}

function NextMilestone({streak,activeDrugs}){
  const primary=Object.keys(activeDrugs).find(k=>activeDrugs[k]&&ALL_DRUGS[k]?.recovery?.length>0);
  if(!primary)return null;
  const steps=ALL_DRUGS[primary].recovery,d=ALL_DRUGS[primary];
  const next=steps.find(s=>s.days>streak),prev=steps.filter(s=>s.days<=streak).pop();
  if(!next)return<div className="milestone-card"><div className="mg"/><div style={{fontSize:9,color:"var(--green2)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>🎉 Sevrage complet</div><div style={{fontSize:15,fontWeight:600,color:"var(--t)"}}>Tu es libéré !</div></div>;
  const pct=prev?Math.round(((streak-prev.days)/(next.days-prev.days))*100):Math.round((streak/Math.max(next.days,1))*100);
  const left=next.days-streak;
  return<div className="milestone-card"><div className="mg"/>
    <div style={{fontSize:9,color:"var(--green2)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>Prochain cap — {next.t}</div>
    <div style={{fontSize:15,fontWeight:600,color:"var(--t)",marginBottom:4}}>{next.d}</div>
    <div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}>{d.name} · <span style={{color:d.color,fontWeight:600}}>{left} jour{left>1?"s":""}</span></div>
    <Bar pct={Math.max(pct,3)} color="linear-gradient(90deg,#22c55e,#4ade80)"/>
    <div style={{fontSize:10,color:"var(--green2)",fontWeight:600,marginTop:5}}>{pct}% vers ce cap</div>
  </div>;
}

function Chart({spark}){
  const [tip,setTip]=useState(null);const svgRef=useRef(null);
  const W=300,H=90,p=8,max=Math.max(...spark.map(d=>d.v),1);
  const pts=spark.map((d,i)=>({x:p+(i/Math.max(spark.length-1,1))*(W-p*2),y:H-p-(d.v/max)*(H-p*2),c:d.color||"#22c55e",label:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;
  function handle(cx){const rect=svgRef.current?.getBoundingClientRect();if(!rect)return;const x=(cx-rect.left)*(W/rect.width);const i=Math.max(0,Math.min(Math.round(((x-p)/(W-p*2))*(spark.length-1)),spark.length-1));setTip({i,pt:pts[i],px:(pts[i].x/W)*rect.width});}
  return<div style={{position:"relative"}}>
    {tip&&<div className="chart-tip" style={{left:Math.min(Math.max(tip.px-55,0),200),top:-28,color:tip.pt.c}}>{tip.pt.label}</div>}
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,touchAction:"none"}} onTouchStart={e=>handle(e.touches[0].clientX)} onTouchMove={e=>handle(e.touches[0].clientX)} onTouchEnd={()=>setTimeout(()=>setTip(null),2500)} onClick={e=>handle(e.clientX)}>
      <defs><linearGradient id="cg6" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity=".28"/><stop offset="100%" stopColor="#22c55e" stopOpacity="0"/></linearGradient></defs>
      <path d={area} fill="url(#cg6)"/>
      <path d={path} fill="none" stroke="#22c55e" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      {[0.33,0.66].map(f=>{const y=H-p-f*(H-p*2);return<line key={f} x1={p} y1={y} x2={W-p} y2={y} stroke="var(--b)" strokeWidth="1" strokeDasharray="3,3"/>;})}
      {pts.map((p,i)=>tip?.i===i?<circle key={i} cx={p.x} cy={p.y} r={5} fill={p.c} stroke="var(--bg2)" strokeWidth="2"/>:<circle key={i} cx={p.x} cy={p.y} r={2} fill={p.c} stroke="var(--bg2)" strokeWidth="1.5"/>)}
    </svg>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}><span style={{fontSize:9,color:"var(--t3)"}}>Il y a 30j</span><span style={{fontSize:9,color:"var(--t3)"}}>Aujourd'hui</span></div>
  </div>;
}

// ── Money helper — toutes les drogues ─────────────────────────────────────────
function computeMoneySaved(entries,goals,activeDrugs){
  const active=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  let total=0;
  const details=[];
  active.forEach(k=>{
    const d=ALL_DRUGS[k];
    if(!d)return;
    if(k==="tabac"){
      const cigCPD=(goals.cigPerDay||20)/20*(goals.cigPackCost||10);
      const cleanDays=entries.filter(x=>x.e?.logged&&(x.e?.tabac||0)===0).length;
      const saved=cleanDays*cigCPD;
      if(saved>0)details.push({emoji:d.emoji,name:d.name,saved:saved.toFixed(2)});
      total+=saved;
    } else if(k==="cannabis"){
      const weedCPD=(goals.jointsPerDay||1)*(goals.weedGPerJoint||0.3)*(goals.weedGCost||15);
      const cleanDays=entries.filter(x=>x.e?.logged&&(x.e?.cannabis||0)===0).length;
      const saved=cleanDays*weedCPD;
      if(saved>0)details.push({emoji:d.emoji,name:d.name,saved:saved.toFixed(2)});
      total+=saved;
    } else {
      // Pour les autres drogues, utilise la fréquence hebdo et le coût par prise
      const freq=goals[`${k}_freq`]||0; // prises par semaine
      const costPer=goals[`${k}_cost`]||DRUG_DEFAULT_COST[k]||10;
      if(freq>0){
        const cleanDays=entries.filter(x=>x.e?.logged&&(x.e?.[k]||0)===0).length;
        const savedPerDay=(freq/7)*costPer;
        const saved=cleanDays*savedPerDay;
        if(saved>0)details.push({emoji:d.emoji,name:d.name,saved:saved.toFixed(2)});
        total+=saved;
      }
    }
  });
  return{total:total.toFixed(2),details};
}

// ── Badges ────────────────────────────────────────────────────────────────────
function computeBadges(data,active){
  const vals=Object.values(data),today=new Date();
  const cf=e=>e&&isClean(e,active);
  const cd=vals.filter(cf).length,ld=vals.filter(e=>e?.logged).length;
  let longest=0,run=0,pd=null;

// ── Day Modal ─────────────────────────────────────────────────────────────────
function DayModal({modal,data,activeDrugs,onSave,onClear,onClose}){
  const selKey=dk(modal.y,modal.m,modal.d);
  const raw=data[selKey]||null;
  const activeList=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  const [local,setLocal]=useState(()=>{const base={logged:false,clean:false,note:"",mood:null,ctx:[]};activeList.forEach(k=>{base[k]=0;});return raw?{...base,...raw}:base;});
  const hasCons=activeList.some(k=>(local[k]||0)>0);
  const sheetRef=useRef(null);
  useEffect(()=>{const el=sheetRef.current;if(!el)return;let sy=0;const ts=e=>{sy=e.touches[0].clientY;};const te=e=>{if(e.changedTouches[0].clientY-sy>70)onClose();};el.addEventListener("touchstart",ts,{passive:true});el.addEventListener("touchend",te,{passive:true});return()=>{el.removeEventListener("touchstart",ts);el.removeEventListener("touchend",te);};},[onClose]);
  function toggleClean(){setLocal(p=>{if(p.clean)return{...p,clean:false};const n={...p,clean:true,logged:true};activeList.forEach(k=>{n[k]=0;});return n;});}
  function setVal(key,val){setLocal(p=>({...p,[key]:val,clean:false,logged:true}));}
  return<div className="mo" onClick={onClose}>
    <div className="mb" ref={sheetRef} onClick={e=>e.stopPropagation()}>
      <div className="mh" onClick={onClose}/>
      <div style={{marginBottom:12}}><div style={{fontSize:9,color:"var(--t3)",letterSpacing:".1em",textTransform:"uppercase"}}>Journal du</div><div style={{fontSize:15,fontWeight:600,color:"var(--t)"}}>{modal.d} {MONTHS[modal.m]} {modal.y}</div></div>
      <div className="slbl" style={{marginTop:0}}>Journée</div>
      <div className={`ctr-row${local.clean?" active":""}`} style={{background:local.clean?"rgba(34,197,94,0.12)":"var(--s)",color:"#22c55e",cursor:"pointer"}} onClick={toggleClean}>
        <div className="ctr-left"><div className="ctr-emoji">✦</div><div><div className="ctr-lbl" style={{color:"#22c55e"}}>Journée clean</div><div className="ctr-sub">Aucune substance aujourd'hui</div></div></div>
        {local.clean&&<span style={{color:"#22c55e",fontSize:15,marginRight:4}}>✓</span>}
      </div>
      {activeList.map(k=>{const d=ALL_DRUGS[k];if(!d)return null;const val=local[k]||0;return<React.Fragment key={k}>
        <div className="slbl">{d.name} {d.emoji}</div>
        <div className={`ctr-row${val>0?" active":""}`} style={{background:val>0?d.color+"1a":"var(--s)",color:d.color}}>
          <div className="ctr-left"><div className="ctr-emoji">{d.emoji}</div><div><div className="ctr-lbl" style={{color:val>0?d.color:"var(--t)"}}>{d.unit}</div><div className="ctr-sub">{val>0?(d.gramPerUnit?`≈${(val*d.gramPerUnit).toFixed(1)}g`:`${val} ${val>1?d.unit:d.unitShort}`):"Combien ?"}</div></div></div>
          <div className="ctr-right">
            <button className="ctr-btn" style={{borderColor:val>0?d.color:"var(--b2)"}} onPointerDown={e=>{e.stopPropagation();setVal(k,Math.max(0,val-1));}}>−</button>
            <div className="ctr-val" style={{color:val>0?d.color:"var(--t3)"}}>{val}</div>
            <button className="ctr-btn" style={{borderColor:val>0?d.color:"var(--b2)"}} onPointerDown={e=>{e.stopPropagation();setVal(k,Math.min(99,val+1));}}>+</button>
          </div>
        </div>
      </React.Fragment>;})}
      <div className="slbl">Humeur</div>
      <div className="mood-row">{MOODS.map((m,i)=><button key={i} className={`mood-btn${local.mood===i?" on":""}`} style={{borderColor:local.mood===i?m.c:"transparent",color:local.mood===i?m.c:"var(--t3)"}} onClick={()=>setLocal(p=>({...p,mood:p.mood===i?null:i}))}><span>{m.e}</span><span>{m.l}</span></button>)}</div>
      {hasCons&&<><div className="slbl">Contexte</div><div className="tag-row">{CTXS.map(c=><button key={c} className={`tag${(local.ctx||[]).includes(c)?" on":""}`} onClick={()=>setLocal(p=>({...p,ctx:(p.ctx||[]).includes(c)?(p.ctx||[]).filter(x=>x!==c):[...(p.ctx||[]),c]}))}>{c}</button>)}</div></>}
      <div className="slbl">Note</div>
      <textarea rows={2} placeholder="Comment tu te sens ?" value={local.note||""} onChange={e=>setLocal(p=>({...p,note:e.target.value}))}/>
      <div style={{display:"flex",gap:7,marginTop:12}}>
        {raw&&<button onClick={()=>{onClear(selKey);onClose();}} style={{flex:1,padding:"12px",borderRadius:10,background:"var(--s)",border:"1px solid var(--b)",color:"var(--t3)",fontFamily:"inherit",fontWeight:600,fontSize:12,cursor:"pointer"}}>Effacer</button>}
        <button className="bprim" style={{flex:2,margin:0}} onClick={()=>{onSave(selKey,{...local,logged:true});onClose();}}>Enregistrer</button>
      </div>
    </div>
  </div>;
}

          Continuer

  </div>;
}

// ── Widget Manager ────────────────────────────────────────────────────────────
function WidgetManager({widgets,setWidgets,onClose}){
  const [items,setItems]=useState(()=>[...widgets]);
  const dragIdx=useRef(null);const overIdx=useRef(null);const listRef=useRef(null);
  function save(){setWidgets(items);onClose();}
  function onTouchStart(i,e){dragIdx.current=i;e.currentTarget.classList.add("dragging");}
  function onTouchMove(e){e.preventDefault();const touch=e.touches[0];const els=listRef.current?.querySelectorAll(".wdg-item");if(!els)return;let found=-1;els.forEach((el,i)=>{el.classList.remove("over");const r=el.getBoundingClientRect();if(touch.clientY>=r.top&&touch.clientY<=r.bottom){found=i;el.classList.add("over");}});overIdx.current=found>=0?found:overIdx.current;}
  function onTouchEnd(){const from=dragIdx.current,to=overIdx.current;const els=listRef.current?.querySelectorAll(".wdg-item");if(els)els.forEach(el=>{el.classList.remove("dragging","over");});if(from!==null&&to!==null&&from!==to){const arr=[...items];const item=arr.splice(from,1)[0];arr.splice(to,0,item);setItems(arr);}dragIdx.current=null;overIdx.current=null;}
  return<div className="mo" onClick={onClose}>
    <div className="mb" onClick={e=>e.stopPropagation()}>
      <div className="mh" onClick={onClose}/>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <div style={{fontSize:15,fontWeight:600,color:"var(--t)"}}>Personnaliser l'accueil</div>
        <button onClick={save} style={{background:"var(--green3)",border:"1px solid rgba(34,197,94,0.3)",borderRadius:8,padding:"5px 14px",color:"var(--green2)",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}>Enregistrer</button>
      </div>
      <div style={{fontSize:11,color:"var(--t3)",marginBottom:14}}>Maintiens et glisse · Bascule pour activer</div>
      <div className="widget-list" ref={listRef}>
        {items.map((w,i)=><div key={w.id} className="wdg-item" onTouchStart={e=>onTouchStart(i,e)} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} draggable onDragStart={()=>{dragIdx.current=i;}} onDragOver={e=>{e.preventDefault();overIdx.current=i;}} onDragEnd={()=>{const from=dragIdx.current,to=overIdx.current;if(from!==null&&to!==null&&from!==to){const arr=[...items];const item=arr.splice(from,1)[0];arr.splice(to,0,item);setItems(arr);}dragIdx.current=null;overIdx.current=null;}}>
          <div style={{color:"var(--t3)",flexShrink:0}}><IcoGrip/></div>
          <div style={{flex:1,fontSize:13,fontWeight:500,color:"var(--t)"}}>{w.label}</div>
          <button className={`toggle${w.enabled?" on":" off"}`} onClick={e=>{e.stopPropagation();setItems(prev=>prev.map((x,j)=>j===i?{...x,enabled:!x.enabled}:x));}}/>
        </div>)}
      </div>
    </div>
  </div>;
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const today=new Date();
  const [onboarded,setOnboarded]=useState(()=>load(OSTORE,false));
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [data,setData]=useState(()=>load(STORE,{}));
  const [goals,setGoals]=useState(()=>load(GSTORE,{target:20,notifOn:false,notifTime:"22:00",cigPerDay:20,cigPackCost:10,jointsPerDay:1,weedGPerJoint:0.3,weedGCost:15}));
  const [activeDrugs,setActiveDrugs]=useState(()=>load(DSTORE,DEFAULT_ACTIVE));
  const [profile,setProfile]=useState(()=>load(PSTORE,{loggedIn:false,name:"",photo:null,motivations:"",provider:null}));
  const [widgets,setWidgets]=useState(()=>load(WSTORE,DEFAULT_WIDGETS));
  const [tab,setTab]=useState("cal");
  const [calView,setCalView]=useState("month");
  const [weekOffset,setWeekOffset]=useState(0);
  const [modal,setModal]=useState(null);
  const [bop,setBop]=useState(null);
  const [calKey,setCalKey]=useState(0);
  const [expand,setExpand]=useState(null);
  const [showProfile,setShowProfile]=useState(false);
  const [showWidgets,setShowWidgets]=useState(false);
  const [showLevelModal,setShowLevelModal]=useState(false);
  const [pulse,setPulse]=useState(false);
  const prevStreak=useRef(0);

  useEffect(()=>{try{localStorage.setItem(STORE,JSON.stringify(data));}catch{}},[data]);
  useEffect(()=>{try{localStorage.setItem(GSTORE,JSON.stringify(goals));}catch{}},[goals]);
  useEffect(()=>{try{localStorage.setItem(DSTORE,JSON.stringify(activeDrugs));}catch{}},[activeDrugs]);
  useEffect(()=>{try{localStorage.setItem(PSTORE,JSON.stringify(profile));}catch{}},[profile]);
  useEffect(()=>{try{localStorage.setItem(WSTORE,JSON.stringify(widgets));}catch{}},[widgets]);
  useEffect(()=>{try{localStorage.setItem(OSTORE,JSON.stringify(onboarded));}catch{}},[onboarded]);

  function completeOnboarding({name,age,photo,activeDrugs:ad,goals:g}){
    setActiveDrugs(ad);setGoals(g);setProfile(p=>({...p,name,age,photo}));
    setOnboarded(true);
  }

  if(!onboarded)return<Onboarding onComplete={completeOnboarding}/>;

  const activeList=useMemo(()=>Object.keys(activeDrugs).filter(k=>activeDrugs[k]),[activeDrugs]);
  const daysCount=daysIn(year,month),offset=firstOff(year,month);
  const entries=useMemo(()=>Array.from({length:daysCount},(_,i)=>{const e=data[dk(year,month,i+1)]||null;return{d:i+1,e,clean:isClean(e,activeDrugs)};}),[data,year,month,daysCount,activeDrugs]);
  const logged=entries.filter(x=>x.e?.logged).length;
  const nClean=entries.filter(x=>x.clean).length;
  const pct=logged?Math.round((nClean/logged)*100):0;
  const totals=useMemo(()=>{const t={};activeList.forEach(k=>{t[k]=entries.reduce((s,x)=>s+(x.e?.[k]||0),0);});return t;},[entries,activeList]);
  const weeklyData=useMemo(()=>{const wks=[];for(let w=0;w<5;w++){const start=w*7+1,end=Math.min(start+6,daysCount);if(start>daysCount)break;const we=entries.filter(x=>x.d>=start&&x.d<=end);const wk={clean:we.filter(x=>x.clean).length};activeList.forEach(k=>{wk[k]=we.reduce((s,x)=>s+(x.e?.[k]||0),0);});wks.push(wk);}return wks;},[entries,daysCount,activeList]);

  const [streak,longest]=useMemo(()=>{
    let s=0,cur=new Date(today);while(true){const k=dk(cur.getFullYear(),cur.getMonth(),cur.getDate());if(isClean(data[k],activeDrugs)){s++;cur.setDate(cur.getDate()-1);}else break;}
    let lg=0,run=0,pd=null;for(const k of Object.keys(data).sort()){if(isClean(data[k],activeDrugs)){const d=new Date(k);if(pd&&(d-pd)/86400000===1){run++;}else{run=1;}lg=Math.max(lg,run);pd=d;}else{run=0;pd=null;}}
    return[s,lg];
  },[data,activeDrugs]);

  useEffect(()=>{if(streak>prevStreak.current){setPulse(true);setTimeout(()=>setPulse(false),600);}prevStreak.current=streak;},[streak]);
  const score=sevrageScore(streak,longest,pct,nClean,daysCount,logged,activeDrugs);
  const scoreColor=score>=70?"#22c55e":score>=40?"#f97316":"#ef4444";
  const level=getLevel(streak,activeDrugs);
  const badges=useMemo(()=>computeBadges(data,activeDrugs),[data,activeDrugs]);
  const earnedCount=badges.filter(b=>b.earned).length;
  const allLoggedDays=Object.values(data).filter(e=>e?.logged).length;
  const moneySaved=useMemo(()=>computeMoneySaved(entries,goals,activeDrugs),[entries,goals,activeDrugs]);

  const spark=useMemo(()=>Array.from({length:30},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(29-i));
    const k=dk(d.getFullYear(),d.getMonth(),d.getDate());
    const e=data[k],cl=isClean(e,activeDrugs);
    const tot=e?activeList.reduce((s,dr)=>s+(e[dr]||0),0):0;
    const ms=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
    return{v:cl?3:tot===0?2:tot<=2?1:0,color:cl?"#22c55e":tot===0?"var(--t3)":"#ef4444",label:`${d.getDate()} ${ms[d.getMonth()]} — ${cl?"Clean":tot===0?"Non renseigné":tot+" prise(s)"}`};
  }),[data,activeDrugs,activeList]);

  const aiStats=useMemo(()=>({totals,nClean,daysCount,streak,longest,pct,score}),[totals,nClean,daysCount,streak,longest,pct,score]);

  // Calendar — blocked to today
  const cells=[];for(let i=0;i<offset;i++)cells.push(null);for(let d=1;d<=daysCount;d++)cells.push(d);while(cells.length%7!==0)cells.push(null);
  function getWD(off){const base=new Date(today);const dow=base.getDay()===0?6:base.getDay()-1;base.setDate(base.getDate()-dow+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return{date:d,key:dk(d.getFullYear(),d.getMonth(),d.getDate())};});}
  const weekDays=getWD(weekOffset);
  const prevMonthCb=useCallback(()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);setCalKey(k=>k+1);},[month]);
  // Prevent going to future months
  const nextMonthCb=useCallback(()=>{const nextM=month===11?0:month+1;const nextY=month===11?year+1:year;if(nextY>today.getFullYear()||(nextY===today.getFullYear()&&nextM>today.getMonth()))return;if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);setCalKey(k=>k+1);},[month,year]);
  const monthSwipeRef=useSwipe(nextMonthCb,prevMonthCb);
  const weekSwipeRef=useSwipe(()=>setWeekOffset(w=>w+1),()=>setWeekOffset(w=>w-1));
  const yearSwipeRef=useSwipe(()=>setYear(y=>Math.min(y+1,today.getFullYear())),()=>setYear(y=>y-1));
  function saveEntry(key,d){setData(prev=>({...prev,[key]:d}));setBop(parseInt(key.split("-")[2]));setTimeout(()=>setBop(null),450);}
  function clearEntry(key){setData(prev=>{const n={...prev};delete n[key];return n;});}
  const riskOrder={"Extrême":0,"Très élevé":1,"Élevé":2,"Modéré":3,"Faible":4};
  const sortedDrugs=Object.entries(ALL_DRUGS).sort((a,b)=>(riskOrder[a[1].risk]||9)-(riskOrder[b[1].risk]||9));
  const enabledWidgets=widgets.filter(w=>w.enabled);

  return<div className="shell">
    <div className="hdr">
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
        <div>
          <div style={{fontSize:9,letterSpacing:".15em",color:"var(--t3)",textTransform:"uppercase",fontWeight:600}}>Parcours de guérison</div>
          <h1 style={{fontSize:18,fontWeight:700,color:"var(--t)",lineHeight:1.1,letterSpacing:"-.02em"}}>Habit Tracker{profile.name?` · ${profile.name}`:""}</h1>
        </div>
        <button onClick={()=>setShowProfile(true)} style={{width:34,height:34,borderRadius:"50%",background:"var(--s)",border:"1px solid var(--b)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0,color:"var(--t2)"}}>
          {profile.photo?<img src={profile.photo} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<IcoUser/>}
        </button>
      </div>
    </div>

    <div className="content">

      {/* ══ PARCOURS ══ */}
      {tab==="cal"&&<div className="tc">
        {/* Score card — clickable for levels */}
        <div className="card" style={{background:"linear-gradient(135deg,var(--bg2),var(--bg3))",cursor:"pointer"}} onClick={()=>setShowLevelModal(true)}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
            <div style={{flex:1}}>
              <div style={{fontSize:9,color:"var(--t3)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:5}}>Score de guérison</div>
              <div style={{fontSize:48,fontWeight:700,color:scoreColor,lineHeight:1,letterSpacing:"-.02em"}}>{score}<span style={{fontSize:18}}>/100</span></div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
                <span className="level-badge" style={{background:level.color+"22",color:level.color,border:`1px solid ${level.color}44`}}>Niv.{level.level} · {level.label}</span>
                <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke="var(--t3)" strokeWidth="2" strokeLinecap="round"><polyline points="9 18 15 12 9 6"/></svg>
              </div>
              <div style={{marginTop:10}}><Bar pct={score} color={`linear-gradient(90deg,${scoreColor},${scoreColor}88)`} thick/></div>
            </div>
            <div style={{paddingLeft:16}}><Flame streak={streak}/></div>
          </div>
        </div>

        <div className="nav">

    </div>

    <div className="tabs">
      {[["cal",<IcoCalendar/>,"Parcours"],["heal",<IcoHeart/>,"Guérison"],["badges",<IcoBadge/>,"Badges"],["goals",<IcoSettings/>,"Config"]].map(([k,icon,label])=><button key={k} className={`tb${tab===k?" on":""}`} onClick={()=>setTab(k)}>{icon}{label}</button>)}
    </div>

    {expand==="weekly"&&<ExpandView title="Progression hebdomadaire" onClose={()=>setExpand(null)}>
      <div style={{background:"var(--s)",borderRadius:13,padding:13}}><div style={{fontSize:11,color:"var(--green)",fontWeight:600,marginBottom:9}}>✦ Jours clean</div><WeekBars weeks={weeklyData} metric="clean" color="#22c55e"/></div>
      {activeList.map(k=><div key={k} style={{background:"var(--s)",borderRadius:13,padding:13}}><div style={{fontSize:11,color:ALL_DRUGS[k]?.color,fontWeight:600,marginBottom:9}}>{ALL_DRUGS[k]?.emoji} {ALL_DRUGS[k]?.name}</div><WeekBars weeks={weeklyData} metric={k} color={ALL_DRUGS[k]?.color}/></div>)}
      <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
    </ExpandView>}

    {expand==="spark"&&<ExpandView title="Tendance 30 jours" onClose={()=>setExpand(null)}>
      <div style={{background:"var(--s)",borderRadius:14,padding:14}}><Chart spark={spark}/></div>
      <div style={{background:"var(--s)",borderRadius:13,padding:13}}>
        {[{l:"Jours clean",v:nClean,c:"#22c55e"},...activeList.map(k=>({l:ALL_DRUGS[k]?.name,v:totals[k]||0,c:ALL_DRUGS[k]?.color}))].map(b=><div key={b.l} style={{marginBottom:9}}><div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11,color:"var(--t2)"}}>{b.l}</span><span style={{fontSize:11,fontWeight:700,color:b.c}}>{b.v}</span></div><Bar pct={Math.min((b.v/Math.max(daysCount,1))*100,100)} color={b.c}/></div>)}
      </div>
      <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
    </ExpandView>}

    {showLevelModal&&<ScoreLevelModal score={score} streak={streak} activeDrugs={activeDrugs} onClose={()=>setShowLevelModal(false)}/>}
    {showProfile&&<ProfileModal profile={profile} setProfile={setProfile} activeDrugs={activeDrugs} onClose={()=>setShowProfile(false)}/>}
    {showWidgets&&<WidgetManager widgets={widgets} setWidgets={setWidgets} onClose={()=>setShowWidgets(false)}/>}
    {modal&&<DayModal modal={modal} data={data} activeDrugs={activeDrugs} onSave={saveEntry} onClear={clearEntry} onClose={()=>setModal(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}</script>
</body>
</html>
