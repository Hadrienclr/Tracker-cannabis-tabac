<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f" media="(prefers-color-scheme: dark)"/>
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Recovery"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Recovery Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    /* ── Theme tokens ── */
    :root{
      --bg:#0a0a0f; --bg2:#12121c; --bg3:#1a1a28;
      --s:rgba(255,255,255,0.04); --s2:rgba(255,255,255,0.07);
      --b:rgba(255,255,255,0.08); --b2:rgba(255,255,255,0.12);
      --t:#e8e8f0; --t2:#9ca3af; --t3:#6b7280;
      --green:#22c55e; --green2:#4ade80; --green3:rgba(34,197,94,0.12);
      --shadow:0 4px 24px rgba(0,0,0,0.4);
    }
    @media(prefers-color-scheme:light){
      :root{
        --bg:#f0f4f8; --bg2:#ffffff; --bg3:#e8edf4;
        --s:rgba(0,0,0,0.04); --s2:rgba(0,0,0,0.07);
        --b:rgba(0,0,0,0.08); --b2:rgba(0,0,0,0.12);
        --t:#0f172a; --t2:#475569; --t3:#94a3b8;
        --green:#16a34a; --green2:#15803d; --green3:rgba(22,163,74,0.1);
        --shadow:0 4px 24px rgba(0,0,0,0.1);
      }
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--bg);color:var(--t);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;}
    #root{height:100%;display:flex;flex-direction:column;}
    .shell{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);}
    .hdr{padding:10px 16px 0;flex-shrink:0;}
    .content{flex:1;overflow-y:auto;padding:8px 16px 160px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .content::-webkit-scrollbar{display:none;}
    .tabs{position:fixed;bottom:0;left:0;right:0;padding:6px 6px 0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:rgba(10,10,15,0.95);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--b);display:flex;gap:2px;z-index:50;}
    @media(prefers-color-scheme:light){.tabs{background:rgba(240,244,248,0.95);}}
    .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:9px;font-weight:600;color:var(--t3);transition:all .22s cubic-bezier(.34,1.56,.64,1);}
    .tb.on{background:var(--green3);color:var(--green2);}
    .tb svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
    .tb.on svg{transform:scale(1.12);}
    .tc{animation:tIn .2s ease;}
    @keyframes tIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

    /* ── Calendar ── */
    .vpill{display:flex;background:var(--s);border-radius:8px;padding:2px;gap:2px;}
    .vbtn{padding:4px 9px;border-radius:6px;border:none;font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--t3);transition:all .18s;display:flex;align-items:center;gap:3px;}
    .vbtn.on{background:var(--green3);color:var(--green2);}
    .cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
    .cdl{text-align:center;font-size:10px;font-weight:600;color:var(--t3);letter-spacing:.04em;padding:3px 0;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1.5px solid transparent;font-size:11px;font-weight:500;user-select:none;opacity:0;animation:cPop forwards;transition:transform .14s ease,background .2s,border-color .2s;}
    .day:active{transform:scale(0.87)!important;}
    .day.td{border-color:rgba(34,197,94,0.6)!important;}
    .day.bop{animation:cBop .36s cubic-bezier(.34,1.56,.64,1) forwards!important;}
    .dot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#a855f7;}
    @keyframes cPop{0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)}}
    @keyframes cBop{0%{transform:scale(1)}35%{transform:scale(1.26)}65%{transform:scale(0.93)}100%{transform:scale(1)}}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
    .wday{border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:7px 2px;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:transform .14s,background .2s;animation:tIn .25s ease;}
    .wday:active{transform:scale(0.92);}
    .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .nbtn{background:var(--s);border:1px solid var(--b);color:var(--t);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .14s,transform .14s;}
    .nbtn:active{background:var(--s2);transform:scale(0.88);}

    /* ── Cards ── */
    .card{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);}
    .clbl{font-size:10px;color:var(--t3);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;}
    .xcard{background:var(--bg2);border:1px solid var(--b);border-radius:16px;padding:14px;margin-bottom:10px;position:relative;box-shadow:var(--shadow);}
    .xbtn{position:absolute;top:11px;right:11px;background:var(--s);border:1px solid var(--b);border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .sg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .sm{background:var(--bg2);border:1px solid var(--b);border-radius:14px;padding:12px;text-align:center;box-shadow:var(--shadow);}
    .sm .v{font-size:22px;font-weight:700;font-family:'DM Serif Display',serif;}
    .sm .l{font-size:9px;color:var(--t3);margin-top:2px;}
    .pb{height:5px;border-radius:3px;background:var(--s2);overflow:hidden;margin-top:5px;}
    .pf{height:100%;border-radius:3px;width:0;transition:width .9s cubic-bezier(.4,0,.2,1);}
    .pb.t{height:9px;}
    .pulse{animation:sp .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes sp{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}

    /* ── Modal ── */
    .mo{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:200;display:flex;align-items:flex-end;animation:fadeIn .18s ease;}
    .mb{background:var(--bg2);border:1px solid var(--b);border-radius:22px 22px 0 0;padding:18px 15px;padding-bottom:max(24px,calc(16px + env(safe-area-inset-bottom,0px)));width:100%;animation:sUp .28s cubic-bezier(.22,1,.36,1);max-height:88vh;overflow-y:auto;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes sUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    .mh{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:0 auto 14px;}
    .ctr-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:11px;border:1.5px solid transparent;margin-bottom:6px;}
    .ctr-row.active{border-color:currentColor;}
    .ctr-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
    .ctr-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
    .ctr-lbl{font-size:13px;font-weight:500;}
    .ctr-sub{font-size:10px;color:var(--t3);margin-top:1px;}
    .ctr-right{display:flex;align-items:center;flex-shrink:0;}
    .ctr-btn{width:36px;height:36px;border-radius:9px;border:1.5px solid var(--b2);background:var(--s);color:var(--t);font-size:20px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;}
    .ctr-btn:active{background:var(--s2);}
    .ctr-val{min-width:36px;text-align:center;font-size:17px;font-weight:700;font-family:'DM Serif Display',serif;}
    .slbl{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;margin-top:8px;}
    .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
    .tag{padding:5px 10px;border-radius:18px;border:1px solid var(--b);background:var(--s);font-size:11px;font-weight:500;cursor:pointer;color:var(--t3);}
    .tag.on{background:var(--green3);border-color:rgba(34,197,94,0.35);color:var(--green2);}
    .mood-row{display:flex;gap:5px;margin-bottom:10px;}
    .mood-btn{flex:1;padding:8px 2px;border-radius:10px;border:1.5px solid transparent;background:var(--s);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;}
    .mood-btn.on{border-color:currentColor;}
    .mood-btn span:first-child{font-size:18px;}
    .mood-btn span:last-child{font-size:9px;font-weight:600;}
    textarea{background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--t);font-family:inherit;font-size:13px;padding:9px;width:100%;outline:none;resize:none;margin-top:4px;}
    textarea:focus{border-color:rgba(34,197,94,0.4);}
    input[type="number"],input[type="time"],input[type="text"]{background:var(--s);border:1px solid var(--b);border-radius:8px;color:var(--t);font-family:inherit;font-size:13px;padding:7px 9px;outline:none;}
    input[type="number"],input[type="text"]{width:84px;}
    input[type="time"]{width:auto;}
    .bprim{width:100%;padding:13px;border-radius:11px;background:rgba(34,197,94,0.15);border:1.5px solid rgba(34,197,94,0.3);color:var(--green2);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-top:12px;}
    .bprim:active{background:rgba(34,197,94,0.25);}
    .expbtn{background:var(--green3);border:1px solid rgba(34,197,94,0.2);color:var(--green2);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;}
    .gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
    .gr span{font-size:12px;color:var(--t2);}
    .leg{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:8px;}
    .li{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--t3);}
    .ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .ss{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;}
    .ss .m{background:var(--bg2);border:1px solid var(--b);border-radius:9px;padding:8px 4px;text-align:center;}
    .ss .m .v{font-size:15px;font-weight:700;}
    .ss .m .l{font-size:9px;color:var(--t3);margin-top:1px;}
    .sban{margin-top:8px;padding:8px 12px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:11px;color:var(--green2);text-align:center;}
    .drug-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;border:1.5px solid transparent;margin-bottom:7px;cursor:pointer;background:var(--s);}
    .drug-chip.on{background:var(--green3);border-color:rgba(34,197,94,0.25);}
    .drug-chip-ico{font-size:18px;width:26px;text-align:center;}
    .drug-chip-risk{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
    .toggle{width:42px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
    .toggle.on{background:var(--green);}.toggle.on::after{transform:translateX(18px);}
    .toggle.off{background:var(--b2);}
    .badge{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;border:1px solid transparent;}
    .badge.earned{background:var(--green3);border-color:rgba(34,197,94,0.18);}
    .badge.locked{opacity:.35;}
    .badge-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
    .badge-name{font-size:12px;font-weight:600;}
    .badge-desc{font-size:10px;color:var(--t3);margin-top:1px;}
    .badge-cat{font-size:9px;color:var(--t3);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:14px 0 6px;padding-left:2px;}
    .wbar-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:3px;height:60px;}
    .wbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
    .wbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;}
    .wbar-lbl{font-size:9px;color:var(--t3);font-weight:600;}
    .wbar-val{font-size:8px;font-weight:700;}

    /* ── Expand overlay ── */
    .exp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:300;display:flex;flex-direction:column;animation:fadeIn .2s ease;padding:env(safe-area-inset-top,16px) 14px 16px;}
    @media(prefers-color-scheme:light){.exp-overlay{background:rgba(240,244,248,0.97);}}
    .exp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-top:2px;}
    .exp-title{font-size:16px;font-family:'DM Serif Display',serif;color:var(--t);}
    .exp-close{background:var(--s);border:1px solid var(--b);border-radius:9px;color:var(--t);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .exp-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}

    /* ── AI box ── */
    .ai-box{background:var(--green3);border:1px solid rgba(34,197,94,0.2);border-radius:13px;padding:13px;margin-top:8px;}
    .ai-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:aiP 2s infinite;}
    @keyframes aiP{0%,100%{opacity:1}50%{opacity:.3}}
    .ai-text{font-size:12px;color:var(--t);line-height:1.65;}
    .ai-loading{display:flex;gap:4px;align-items:center;padding:6px 0;}
    .ai-loading span{width:5px;height:5px;border-radius:50%;background:var(--green);animation:dots 1.2s infinite;}
    .ai-loading span:nth-child(2){animation-delay:.2s;}
    .ai-loading span:nth-child(3){animation-delay:.4s;}
    @keyframes dots{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}
    .ai-sec{margin-top:8px;padding-top:8px;border-top:1px solid rgba(34,197,94,0.15);}
    .ai-sec-t{font-size:9px;color:var(--green);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}

    /* ── HEALING TAB ── */
    /* Flame animation */
    .flame-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;}
    .flame{position:relative;display:inline-flex;align-items:center;justify-content:center;}
    .flame-svg{animation:flameWave 2s ease-in-out infinite;}
    @keyframes flameWave{0%,100%{transform:scaleY(1) scaleX(1)}25%{transform:scaleY(1.06) scaleX(0.97)}75%{transform:scaleY(0.96) scaleX(1.03)}}
    .flame-num{position:absolute;font-size:22px;font-weight:700;font-family:'DM Serif Display',serif;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.5);}

    /* Organ recovery cards */
    .organ-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
    .organ-card{background:var(--bg2);border:1px solid var(--b);border-radius:14px;padding:12px;text-align:center;position:relative;overflow:hidden;}
    .organ-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 14px 14px;}
    .organ-emoji{font-size:24px;margin-bottom:4px;display:block;}
    .organ-name{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:6px;}
    .organ-pct{font-size:20px;font-weight:700;font-family:'DM Serif Display',serif;margin-bottom:4px;}
    .organ-status{font-size:9px;color:var(--t3);line-height:1.3;}
    .organ-bar{height:4px;border-radius:2px;background:var(--s2);margin-top:6px;overflow:hidden;}
    .organ-fill{height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.4,0,.2,1);}

    /* Milestone card */
    .milestone-card{background:linear-gradient(135deg,rgba(34,197,94,0.12),rgba(168,85,247,0.06));border:1px solid rgba(34,197,94,0.25);border-radius:16px;padding:16px;margin-bottom:10px;position:relative;overflow:hidden;}
    .milestone-glow{position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,0.2),transparent);pointer-events:none;}
    .milestone-label{font-size:9px;color:var(--green2);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
    .milestone-title{font-size:16px;font-weight:700;color:var(--t);margin-bottom:4px;}
    .milestone-desc{font-size:12px;color:var(--t2);margin-bottom:10px;line-height:1.5;}
    .milestone-days{font-size:11px;color:var(--green2);font-weight:600;}

    /* Avoided substances */
    .avoided-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--b);}
    .avoided-row:last-child{border-bottom:none;}
    .avoided-num{font-size:22px;font-weight:700;font-family:'DM Serif Display',serif;min-width:44px;text-align:right;}
    .avoided-label{font-size:12px;font-weight:500;color:var(--t);}
    .avoided-equiv{font-size:10px;color:var(--t3);margin-top:2px;}

    /* Interactive chart */
    .chart-touch{touch-action:pan-y;user-select:none;-webkit-user-select:none;}
    .chart-tooltip{position:absolute;background:var(--bg2);border:1px solid var(--b);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:600;pointer-events:none;z-index:10;white-space:nowrap;box-shadow:var(--shadow);}

    /* Radar chart */
    .radar-wrap{display:flex;justify-content:center;align-items:center;padding:8px 0;}

    /* Profile section */
    .profile-section{background:var(--bg2);border:1px solid var(--b);border-radius:18px;padding:20px;margin-bottom:10px;box-shadow:var(--shadow);}
    .profile-avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid rgba(34,197,94,0.4);}
    .profile-avatar-placeholder{width:72px;height:72px;border-radius:50%;background:var(--s2);border:2px dashed var(--b2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:28px;flex-shrink:0;}
    .social-btn{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:11px;border:1px solid var(--b);background:var(--s);cursor:pointer;margin-bottom:7px;width:100%;font-family:inherit;font-size:13px;font-weight:500;color:var(--t);transition:background .15s;}
    .social-btn:active{background:var(--s2);}
    .motiv-area{background:var(--s);border:1px solid var(--b);border-radius:12px;padding:12px;min-height:80px;color:var(--t);font-family:inherit;font-size:13px;line-height:1.6;width:100%;outline:none;resize:none;}
    .motiv-area:focus{border-color:rgba(34,197,94,0.4);}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Drug DB ───────────────────────────────────────────────────────────────────
const ALL_DRUGS={
  tabac:   {name:"Tabac",emoji:"🚬",color:"#f97316",risk:"Élevé",riskColor:"#f97316",unit:"cigarettes",unitShort:"cig",defaultOn:true,
    recovery:[{t:"20 min",d:"Tension artérielle normalisée",days:0},{t:"8h",d:"CO sanguin divisé par 2",days:0},{t:"48h",d:"Nicotine éliminée",days:2},{t:"72h",d:"Bronches dilatées",days:3},{t:"1 sem.",d:"Circulation améliorée",days:7},{t:"1 mois",d:"Risque cardio en baisse",days:30},{t:"3 mois",d:"+30% capacité pulmonaire",days:90},{t:"1 an",d:"Risque infarctus ÷2",days:365}],

function OrganCards({streak,activeDrugs}){
  const organs=[

    {key:"cerveau",emoji:"🧠",name:"Cerveau"},

  const active=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  return(
    <div className="organ-grid">
      {organs.map(({key,emoji,name})=>{
        // Max damage from active drugs
        const maxDamage=active.reduce((mx,k)=>{const d=ALL_DRUGS[k];return Math.max(mx,d?.organs?.[key]||0);},0);
        // Recovery based on streak (0-100 = healed)
        const healRate=streak>=90?1:streak>=30?0.7:streak>=14?0.5:streak>=7?0.35:streak>=3?0.2:streak>=1?0.1:0;

        const health=Math.round(100-damage);
        const color=health>=80?"#22c55e":health>=60?"#4ade80":health>=40?"#f97316":"#ef4444";
        const status=health>=80?"Bon état":health>=60?"En récupération":health>=40?"Endommagé":"Critique";
        return(
          <div key={key} className="organ-card">
            <div className="organ-card" style={{background:"transparent",border:"none",padding:0}}>

              <div className="organ-bar">
                <OrgBar pct={health} color={color}/>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── Next milestone ────────────────────────────────────────────────────────────
function NextMilestone({streak,activeDrugs}){
  const primary=Object.keys(activeDrugs).find(k=>activeDrugs[k]&&ALL_DRUGS[k]?.recovery?.length>0);
  if(!primary)return null;
  const steps=ALL_DRUGS[primary].recovery;
  const next=steps.find(s=>s.days>streak);
  const prev=steps.filter(s=>s.days<=streak).pop();
  if(!next)return(
    <div className="milestone-card">
      <div className="milestone-glow"/>
      <div className="milestone-label">🏆 Tous les caps atteints</div>
      <div className="milestone-title">Tu es au maximum de la récupération</div>
      <div className="milestone-desc">{prev?.d}</div>
    </div>
  );
  const pct=prev?Math.round(((streak-prev.days)/(next.days-prev.days))*100):Math.round((streak/next.days)*100);
  const daysLeft=next.days-streak;
  return(
    <div className="milestone-card">
      <div className="milestone-glow"/>
      <div className="milestone-label">🎯 Prochain cap — {next.t}</div>
      <div className="milestone-title">{next.d}</div>
      <div className="milestone-desc">{ALL_DRUGS[primary].name} · {daysLeft} jour{daysLeft>1?"s":""} restant{daysLeft>1?"s":""}</div>
      <Bar pct={Math.max(pct,3)} color="linear-gradient(90deg,#22c55e,#4ade80)"/>
      <div className="milestone-days" style={{marginTop:6}}>{pct}% vers ce cap</div>
    </div>
  );
}

// ── Interactive 30-day chart ──────────────────────────────────────────────────
function InteractiveChart({spark,onExpand}){
  const [tooltip,setTooltip]=useState(null);
  const svgRef=useRef(null);
  const W=300,H=90,p=8;
  const max=Math.max(...spark.map(d=>d.v),1);
  const pts=spark.map((d,i)=>({x:p+(i/Math.max(spark.length-1,1))*(W-p*2),y:H-p-(d.v/max)*(H-p*2),c:d.color||"#22c55e",v:d.v,label:d.label}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;
  function handleTouch(e){
    e.preventDefault();
    const rect=svgRef.current?.getBoundingClientRect();
    if(!rect)return;
    const touch=e.touches[0]||e.changedTouches[0];
    const x=(touch.clientX-rect.left)*(W/rect.width);
    const idx=Math.round(((x-p)/(W-p*2))*(spark.length-1));
    if(idx>=0&&idx<pts.length)setTooltip({x:pts[idx].x*(rect.width/W)+rect.left-rect.left,idx,pt:pts[idx]});
  }
  return(
    <div style={{position:"relative"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <div className="clbl" style={{margin:0}}>Tendance 30 jours</div>
        <button className="xbtn" style={{position:"relative",top:0,right:0}} onClick={onExpand}><IcoExpand/></button>
      </div>
      {tooltip&&<div className="chart-tooltip" style={{left:Math.min(tooltip.x,220),top:0,transform:"translateX(-50%)",color:tooltip.pt.c}}>
        {tooltip.pt.label}
      </div>}
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H,touchAction:"none"}}
        onTouchStart={handleTouch} onTouchMove={handleTouch} onTouchEnd={()=>setTimeout(()=>setTooltip(null),1500)}
        onClick={e=>{const rect=svgRef.current?.getBoundingClientRect();const x=(e.clientX-rect.left)*(W/rect.width);const idx=Math.round(((x-p)/(W-p*2))*(spark.length-1));if(idx>=0&&idx<pts.length)setTooltip({x:pts[idx].x*(rect.width/W),idx,pt:pts[idx]});}}>
        <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity=".25"/><stop offset="100%" stopColor="#22c55e" stopOpacity="0"/></linearGradient></defs>
        <path d={area} fill="url(#cg)"/>
        <path d={path} fill="none" stroke="#22c55e" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        {pts.map((p,i)=>tooltip?.idx===i
          ?<circle key={i} cx={p.x} cy={p.y} r={5} fill={p.c} stroke="var(--bg2)" strokeWidth="2"/>
          :<circle key={i} cx={p.x} cy={p.y} r={2} fill={p.c} stroke="var(--bg2)" strokeWidth="1.5"/>
        )}
        {/* Grid lines */}
        {[0.25,0.5,0.75].map(f=>{
          const y=H-p-(f/1)*(H-p*2);
          return<line key={f} x1={p} y1={y} x2={W-p} y2={y} stroke="var(--b)" strokeWidth="1" strokeDasharray="3,3"/>;
        })}
      </svg>
      <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
        <span style={{fontSize:9,color:"var(--t3)"}}>Il y a 30j</span>
        <span style={{fontSize:9,color:"var(--t3)"}}>Aujourd'hui</span>
      </div>
    </div>
  );
}

// ── Radar chart ───────────────────────────────────────────────────────────────
function RadarChart({streak,moodAvg,nClean,daysCount,totalCigs,totalJoints,moneyTotal}){
  const labels=["Sommeil","Énergie","Humeur","Finances","Clarté"];
  const vals=[
    Math.min(streak>=14?90:streak>=7?70:streak>=3?50:streak>=1?35:20,100),
    Math.min(streak>=7?80:streak>=3?60:streak>=1?40:25,100),
    Math.min(moodAvg>0?moodAvg*20:streak>=3?50:30,100),
    Math.min(moneyTotal>0?Math.min(moneyTotal*2,90):20,100),
    Math.min(daysCount>0?(nClean/daysCount)*100:20,100),
  ];
  const cx=120,cy=110,r=80;
  const angles=labels.map((_,i)=>(i/labels.length)*Math.PI*2-Math.PI/2);
  const pts=vals.map((v,i)=>{const a=angles[i];const rv=r*(v/100);return{x:cx+Math.cos(a)*rv,y:cy+Math.sin(a)*rv};});
  const outer=angles.map(a=>({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r}));
  const polyPath=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ")+" Z";
  const outerPath=outer.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ")+" Z";
  return(
    <div className="radar-wrap">
      <svg width={240} height={220} viewBox="0 0 240 220">
        <defs>
          <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor="#22c55e" stopOpacity=".4"/>
            <stop offset="100%" stopColor="#4ade80" stopOpacity=".1"/>
          </linearGradient>
        </defs>
        {/* Grid */}
        {[0.25,0.5,0.75,1].map(f=>{
          const gPts=angles.map(a=>({x:cx+Math.cos(a)*r*f,y:cy+Math.sin(a)*r*f}));
          return<polygon key={f} points={gPts.map(p=>`${p.x},${p.y}`).join(" ")} fill="none" stroke="var(--b)" strokeWidth="1"/>;
        })}
        {/* Axes */}
        {outer.map((p,i)=><line key={i} x1={cx} y1={cy} x2={p.x} y2={p.y} stroke="var(--b)" strokeWidth="1"/>)}
        {/* Data */}
        <path d={polyPath} fill="url(#rg)" stroke="#22c55e" strokeWidth="2"/>
        {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={3} fill="#22c55e" stroke="var(--bg2)" strokeWidth="1.5"/>)}
        {/* Labels */}
        {labels.map((l,i)=>{
          const a=angles[i];const lx=cx+Math.cos(a)*(r+16);const ly=cy+Math.sin(a)*(r+16);
          return<text key={i} x={lx} y={ly} textAnchor="middle" dominantBaseline="middle" fontSize="10" fill="var(--t2)" fontFamily="DM Sans">{l}</text>;
        })}
      </svg>
    </div>
  );
}

// ── Avoided substances ────────────────────────────────────────────────────────
function AvoidedSection({data,activeDrugs,goals}){
  const allVals=Object.values(data);
  const active=Object.keys(activeDrugs).filter(k=>activeDrugs[k]);
  const totalConsumed={};active.forEach(k=>{totalConsumed[k]=allVals.reduce((s,e)=>s+(e?.[k]||0),0);});
  const loggedDays=allVals.filter(e=>e?.logged).length;
  const rows=active.map(k=>{
    const d=ALL_DRUGS[k];if(!d)return null;
    const consumed=totalConsumed[k]||0;
    const daysActive=allVals.filter(e=>e?.[k]>0).length;
    const avgPerDay=daysActive>0?consumed/daysActive:1;
    const cleanDays=allVals.filter(e=>e?.logged&&(e[k]||0)===0).length;
    const avoided=Math.round(cleanDays*avgPerDay);
    if(avoided<=0)return null;
    let equiv="";
    if(k==="tabac")equiv=`≈ ${(avoided*6/60).toFixed(1)}h de vie regagnées`;
    if(k==="cannabis")equiv=`≈ ${(avoided*0.3).toFixed(1)}g de THC non consommé`;
    if(k==="alcool")equiv=`≈ ${(avoided*10).toFixed(0)} calories évitées`;
    const moneySaved=k==="tabac"?(cleanDays*(goals.cigCost||10)).toFixed(0):k==="cannabis"?(cleanDays*(goals.weedCost||15)*0.3).toFixed(0):null;
    return{key:k,d,avoided,equiv,moneySaved};
  }).filter(Boolean);
  if(!rows.length)return null;
  return(
    <div className="card">
      <div className="clbl">Ce que tu as évité</div>
      {rows.map(r=>(
        <div key={r.key} className="avoided-row">
          <div style={{fontSize:20}}>{r.d.emoji}</div>
          <div className="avoided-num" style={{color:r.d.color}}>{r.avoided}</div>
          <div style={{flex:1}}>
            <div className="avoided-label">{r.d.unit} non consommé{r.avoided>1?"s":""}</div>
            {r.equiv&&<div className="avoided-equiv">{r.equiv}</div>}
            {r.moneySaved&&<div className="avoided-equiv" style={{color:"#22c55e"}}>≈ {r.moneySaved}€ économisés</div>}
          </div>
        </div>
      ))}
    </div>
  );
}

      <button onClick={generateMotivation} disabled={generating} style={{width:"100%",marginTop:8,padding:"10px",borderRadius:10,background:generating?"var(--s)":"rgba(168,85,247,0.15)",border:"1px solid rgba(168,85,247,0.25)",color:generating?"var(--t3)":"#d8b4fe",fontFamily:"inherit",fontWeight:600,fontSize:13,cursor:generating?"not-allowed":"pointer"}}>
        {generating?"✨ Génération...":"✨ Générer avec l'IA"}
      </button>
      {profile.motivations&&<div style={{marginTop:12,padding:"12px 14px",background:"rgba(168,85,247,0.07)",border:"1px solid rgba(168,85,247,0.15)",borderRadius:12}}>
        <div style={{fontSize:10,color:"#a855f7",fontWeight:700,marginBottom:6,letterSpacing:".06em",textTransform:"uppercase"}}>Mes motivations</div>
        <p style={{fontSize:12,color:"var(--t)",lineHeight:1.7,fontStyle:"italic"}}>{profile.motivations}</p>
      </div>}
      <button onClick={()=>setProfile(p=>({...p,loggedIn:false}))} style={{width:"100%",marginTop:12,padding:"10px",borderRadius:10,background:"var(--s)",border:"1px solid var(--b)",color:"var(--t3)",fontFamily:"inherit",fontSize:12,cursor:"pointer"}}>Se déconnecter</button>
    </div>
  );

  return(
    <div style={{padding:"0 16px 20px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <div style={{fontSize:16,fontFamily:"'DM Serif Display',serif",color:"var(--t)"}}>Créer un profil</div>
        <button onClick={onClose} style={{background:"var(--s)",border:"1px solid var(--b)",borderRadius:8,padding:"5px 12px",color:"var(--t2)",fontSize:12,cursor:"pointer",fontFamily:"inherit"}}>Fermer</button>
      </div>
      <div style={{textAlign:"center",marginBottom:20}}>
        <div style={{fontSize:40,marginBottom:8}}>🌱</div>
        <div style={{fontSize:14,fontWeight:600,color:"var(--t)",marginBottom:4}}>Recovery Tracker</div>
        <div style={{fontSize:12,color:"var(--t2)"}}>Crée ton profil pour personnaliser ton parcours de guérison</div>
      </div>
      {socials.map((s,i)=>(
        <button key={i} className="social-btn" onClick={()=>setProfile(p=>({...p,loggedIn:true,provider:s.label}))}>
          {s.isG?<span style={{fontWeight:800,fontSize:15,color:s.color}}>G</span>:<span style={{fontSize:18}}>{s.icon}</span>}
          <span>{s.label}</span>
        </button>
      ))}
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App(){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [data,setData]=useState(()=>load(STORE,{}));
  const [goals,setGoals]=useState(()=>load(GSTORE,{target:20,notifOn:false,notifTime:"22:00",cigCost:10,weedCost:15}));
  const [activeDrugs,setActiveDrugs]=useState(()=>load(DSTORE,DEFAULT_ACTIVE));
  const [profile,setProfile]=useState(()=>load(PSTORE,{loggedIn:false,name:"",photo:null,motivations:"",drugs:""}));
  const [tab,setTab]=useState("cal");
  const [modal,setModal]=useState(null);
  const [calView,setCalView]=useState("month");
  const [weekOffset,setWeekOffset]=useState(0);
  const [bop,setBop]=useState(null);
  const [calKey,setCalKey]=useState(0);
  const [expand,setExpand]=useState(null);
  const [showProfile,setShowProfile]=useState(false);
  const [pulse,setPulse]=useState(false);
  const prevStreak=useRef(0);

  useEffect(()=>{try{localStorage.setItem(STORE,JSON.stringify(data));}catch{}},[data]);
  useEffect(()=>{try{localStorage.setItem(GSTORE,JSON.stringify(goals));}catch{}},[goals]);
  useEffect(()=>{try{localStorage.setItem(DSTORE,JSON.stringify(activeDrugs));}catch{}},[activeDrugs]);
  useEffect(()=>{try{localStorage.setItem(PSTORE,JSON.stringify(profile));}catch{}},[profile]);

  const activeList=useMemo(()=>Object.keys(activeDrugs).filter(k=>activeDrugs[k]),[activeDrugs]);
  const daysCount=daysIn(year,month),offset=firstOff(year,month);

  const entries=useMemo(()=>Array.from({length:daysCount},(_,i)=>{
    const e=data[dk(year,month,i+1)]||null;
    return{d:i+1,e,clean:isClean(e,activeDrugs)};
  }),[data,year,month,daysCount,activeDrugs]);

  const logged=entries.filter(x=>x.e?.logged).length;
  const nClean=entries.filter(x=>x.clean).length;
  const pct=logged?Math.round((nClean/logged)*100):0;
  const totals=useMemo(()=>{const t={};activeList.forEach(k=>{t[k]=entries.reduce((s,x)=>s+(x.e?.[k]||0),0);});return t;},[entries,activeList]);

  const prevM=month===0?11:month-1,prevY=month===0?year-1:year;
  const prevEntries=useMemo(()=>{const dim=daysIn(prevY,prevM);return Array.from({length:dim},(_,i)=>{const e=data[dk(prevY,prevM,i+1)]||null;return{e,clean:isClean(e,activeDrugs)};});},[data,prevY,prevM,activeDrugs]);
  const prevClean=prevEntries.filter(x=>x.clean).length;

  const weeklyData=useMemo(()=>{const wks=[];for(let w=0;w<5;w++){const start=w*7+1,end=Math.min(start+6,daysCount);if(start>daysCount)break;const we=entries.filter(x=>x.d>=start&&x.d<=end);const wk={clean:we.filter(x=>x.clean).length};activeList.forEach(k=>{wk[k]=we.reduce((s,x)=>s+(x.e?.[k]||0),0);});wks.push(wk);}return wks;},[entries,daysCount,activeList]);

  let streak=0,curD=new Date(today);
  while(true){const k=dk(curD.getFullYear(),curD.getMonth(),curD.getDate());if(isClean(data[k],activeDrugs)){streak++;curD.setDate(curD.getDate()-1);}else break;}
  useEffect(()=>{if(streak>prevStreak.current){setPulse(true);setTimeout(()=>setPulse(false),600);}prevStreak.current=streak;},[streak]);
  let longest=0,run=0,prevD2=null;
  for(const k of Object.keys(data).sort()){if(isClean(data[k],activeDrugs)){const d=new Date(k);if(prevD2&&(d-prevD2)/86400000===1){run++;}else{run=1;}longest=Math.max(longest,run);prevD2=d;}else{run=0;prevD2=null;}}

  const score=sevrageScore(streak,longest,pct,nClean,daysCount);
  const scoreColor=score>=70?"#22c55e":score>=40?"#f97316":"#ef4444";
  const badges=useMemo(()=>computeBadges(data,activeDrugs),[data,activeDrugs]);
  const earnedCount=badges.filter(b=>b.earned).length;

  const moodVals=Object.values(data).filter(e=>e?.mood!=null).map(e=>e.mood);
  const moodAvg=moodVals.length?moodVals.reduce((s,v)=>s+v,0)/moodVals.length:0;
  const moneyTotal=useMemo(()=>{
    const cigSaved=entries.filter(x=>!["tabac"].some(t=>x.e?.[t]>0)).length;
    const weedSaved=entries.filter(x=>!["cannabis"].some(t=>x.e?.[t]>0)).length;
    return Math.round(cigSaved*(goals.cigCost||10)+weedSaved*(goals.weedCost||15)*0.3);
  },[entries,goals]);

  const spark=useMemo(()=>Array.from({length:30},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(29-i));
    const k=dk(d.getFullYear(),d.getMonth(),d.getDate());
    const e=data[k];const cl=isClean(e,activeDrugs);
    const tot=e?activeList.reduce((s,dr)=>s+(e[dr]||0),0):0;
    const months=["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
    return{v:cl?3:tot===0?2:tot<=2?1:0,color:cl?"#22c55e":tot===0?"var(--t3)":"#ef4444",label:`${d.getDate()} ${months[d.getMonth()]} — ${cl?"Clean":tot===0?"Non renseigné":tot+" substance(s)"}`};
  }),[data,activeDrugs,activeList]);

  const aiStats=useMemo(()=>({totals,nClean,daysCount,streak,longest,pct,score}),[totals,nClean,daysCount,streak,longest,pct,score]);

  // Calendar
  const cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let d=1;d<=daysCount;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);
  function getWD(off){const base=new Date(today);const dow=base.getDay()===0?6:base.getDay()-1;base.setDate(base.getDate()-dow+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return{date:d,key:dk(d.getFullYear(),d.getMonth(),d.getDate())};});}
  const weekDays=getWD(weekOffset);
  function changeMonth(dir){if(dir<0){if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}else{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}setCalKey(k=>k+1);}
  function saveEntry(key,d){setData(prev=>({...prev,[key]:d}));setBop(parseInt(key.split("-")[2]));setTimeout(()=>setBop(null),450);}
  function clearEntry(key){setData(prev=>{const n={...prev};delete n[key];return n;});}
  function exportJSON(){const blob=new Blob([JSON.stringify({data,goals,activeDrugs,profile},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recovery_tracker.json";a.click();}

  const riskOrder={"Extrême":0,"Très élevé":1,"Élevé":2,"Modéré":3,"Faible":4};
  const sortedDrugs=Object.entries(ALL_DRUGS).sort((a,b)=>(riskOrder[a[1].risk]||9)-(riskOrder[b[1].risk]||9));

  return(
    <div className="shell">
      {/* Header */}
      <div className="hdr">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div>
            <div style={{fontSize:9,letterSpacing:".15em",color:"var(--t3)",textTransform:"uppercase",fontWeight:600}}>Parcours de guérison</div>
            <h1 style={{fontSize:17,fontFamily:"'DM Serif Display',serif",fontWeight:400,color:"var(--t)",lineHeight:1.1}}>Recovery Tracker</h1>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            {/* Profile button */}
            <button onClick={()=>setShowProfile(true)} style={{width:34,height:34,borderRadius:"50%",background:"var(--s)",border:"1px solid var(--b)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
              {profile.photo
                ?<img src={profile.photo} alt="profil" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
                :<span style={{fontSize:16}}>👤</span>}
            </button>
            <button className="expbtn" onClick={exportJSON}>↓ JSON</button>
          </div>
        </div>
      </div>

      <div className="content">

        {/* ══ MON PARCOURS ══ */}
        {tab==="cal"&&<div className="tc">
          {/* Streak hero */}
          <div className="card" style={{background:"linear-gradient(135deg,var(--bg2),var(--bg3))",marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div style={{flex:1}}>
                <div style={{fontSize:9,color:"var(--t3)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:6}}>Score de guérison</div>
                <div style={{fontSize:44,fontWeight:700,fontFamily:"'DM Serif Display',serif",color:scoreColor,lineHeight:1}}>{score}<span style={{fontSize:16}}>/100</span></div>
                <div style={{fontSize:11,color:"var(--t2)",marginTop:4}}>{score>=70?"Bonne progression 🌱":score>=40?"En chemin 🚶":score>=20?"Continue ✊":"Commence aujourd'hui"}</div>
                <div style={{marginTop:10}}><Bar pct={score} color={`linear-gradient(90deg,${scoreColor},${scoreColor}88)`} thick/></div>
              </div>
              <div style={{paddingLeft:16}}>
                <FlameStreak streak={streak}/>
              </div>
            </div>
          </div>

          <div className="nav">
            <button className="nbtn" onClick={()=>calView==="month"?changeMonth(-1):setWeekOffset(w=>w-1)}>‹</button>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <span style={{fontSize:13,fontWeight:600}}>{calView==="week"?`${weekDays[0].date.getDate()}–${weekDays[6].date.getDate()} ${MONTHS_S[weekDays[3].date.getMonth()]}`:`${MONTHS[month]} ${year}`}</span>
              <div className="vpill">
                <button className={`vbtn${calView==="month"?" on":""}`} onClick={()=>setCalView("month")}><IcoMonth/>Mois</button>
                <button className={`vbtn${calView==="week"?" on":""}`} onClick={()=>setCalView("week")}><IcoWeek/>Sem.</button>
              </div>
            </div>
            <button className="nbtn" onClick={()=>calView==="month"?changeMonth(1):setWeekOffset(w=>w+1)}>›</button>
          </div>

          {calView==="month"&&<>
            <div className="cal-hdr">{DAYS.map(d=><div key={d} className="cdl">{d}</div>)}</div>
            <div className="cal-grid" key={calKey}>
              {cells.map((d,i)=>{
                if(!d)return<div key={`e${i}`}/>;
                const e=data[dk(year,month,d)]||null,col=dayColor(e,activeDrugs);
                const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
                return<div key={d} className={`day${isToday?" td":""}${bop===d?" bop":""}`}
                  style={{background:col?col+"22":"var(--s)",borderColor:col||(isToday?"rgba(34,197,94,0.5)":"transparent"),color:col||"var(--t3)",animationDuration:`${Math.min(i*14,260)+160}ms`}}
                  onClick={()=>setModal({y:year,m:month,d})}>
                  <span style={{fontSize:11,fontWeight:isToday?700:500}}>{d}</span>
                  {e&&<span style={{fontSize:8,marginTop:1}}>{dayEmoji(e,activeDrugs)}</span>}
                  {e?.mood!=null&&<span style={{position:"absolute",bottom:2,right:2,fontSize:7}}>{MOODS[e.mood]?.e}</span>}
                  {e?.note&&<div className="dot"/>}
                </div>;
              })}
            </div>
          </>}

          {calView==="week"&&<div className="week-grid">
            {weekDays.map(({date,key},i)=>{
              const e=data[key]||null,col=dayColor(e,activeDrugs);
              const isToday=date.toDateString()===today.toDateString();
              return<div key={key} className={`wday${isToday?" td":""}`}
                style={{background:col?col+"18":"var(--s)",borderColor:col||(isToday?"rgba(34,197,94,0.5)":"transparent")}}
                onClick={()=>setModal({y:date.getFullYear(),m:date.getMonth(),d:date.getDate()})}>
                <div style={{fontSize:9,fontWeight:600,color:"var(--t3)",textTransform:"uppercase",marginBottom:2}}>{DAYS_S[i]}</div>
                <div style={{fontSize:14,fontWeight:700,color:col||(isToday?"#4ade80":"var(--t)"),marginBottom:2}}>{date.getDate()}</div>
                <div style={{fontSize:12}}>{e?dayEmoji(e,activeDrugs):"·"}</div>
                {e&&activeList.filter(k=>(e[k]||0)>0).slice(0,2).map(k=><div key={k} style={{fontSize:8,color:ALL_DRUGS[k]?.color,marginTop:1}}>{e[k]}{ALL_DRUGS[k]?.emoji}</div>)}
                {e?.mood!=null&&<div style={{fontSize:10,marginTop:1}}>{MOODS[e.mood]?.e}</div>}
              </div>;
            })}
          </div>}

          <div className="leg">
            <div className="li"><div className="ld" style={{background:"#22c55e"}}/>Clean</div>
            {activeList.map(k=><div key={k} className="li"><div className="ld" style={{background:ALL_DRUGS[k]?.color}}/>{ALL_DRUGS[k]?.name}</div>)}
            <div className="li"><div className="ld" style={{background:"#ef4444"}}/>2+</div>
            <div className="li"><div className="ld" style={{background:"#9f1239"}}/>3+</div>
          </div>
          <div className="ss" style={{marginTop:10}}>
            <div className="m"><div className="v" style={{color:"#22c55e"}}>{nClean}</div><div className="l">jours clean</div></div>
            <div className="m"><div className={`v${pulse?" pulse":""}`} style={{color:"#4ade80",display:"inline-block"}}>{streak}j</div><div className="l">streak</div></div>
            <div className="m"><div className="v" style={{color:"#a3e635"}}>{pct}%</div><div className="l">taux</div></div>
          </div>
        </div>}

        {/* ══ GUÉRISON — full dynamic ══ */}
        {tab==="heal"&&<div className="tc">
          {/* Flame + score */}
          <div className="card" style={{background:"linear-gradient(135deg,var(--bg2),var(--bg3))"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
              <div>
                <div style={{fontSize:9,color:"var(--t3)",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:6}}>Guérison en cours</div>
                <div style={{fontSize:42,fontWeight:700,fontFamily:"'DM Serif Display',serif",color:scoreColor,lineHeight:1}}>{score}<span style={{fontSize:16}}>/100</span></div>
                <div style={{fontSize:11,color:"var(--t2)",marginTop:3}}>{streak} jour{streak>1?"s":""} de streak · Record {longest}j</div>
              </div>
              <FlameStreak streak={streak}/>
            </div>
          </div>

          {/* Next milestone */}
          <NextMilestone streak={streak} activeDrugs={activeDrugs}/>

          {/* Organs */}
          <div className="card">
            <div className="clbl">Tes organes en récupération</div>
            <OrganCards streak={streak} activeDrugs={activeDrugs}/>
            <div style={{fontSize:10,color:"var(--t3)",marginTop:4,textAlign:"center"}}>Basé sur {streak} jour{streak>1?"s":""} de streak actuel</div>
          </div>

          {/* Interactive chart */}
          <div className="card">
            <InteractiveChart spark={spark} onExpand={()=>setExpand("spark")}/>
          </div>

          {/* Radar */}
          <div className="card">
            <div className="clbl">Ton état global — Radar</div>
            <RadarChart streak={streak} moodAvg={moodAvg} nClean={nClean} daysCount={daysCount} totalCigs={totals.tabac||0} totalJoints={totals.cannabis||0} moneyTotal={moneyTotal}/>
            <div style={{display:"flex",flexWrap:"wrap",gap:8,justifyContent:"center",marginTop:4}}>
              {["Sommeil","Énergie","Humeur","Finances","Clarté"].map(l=><span key={l} style={{fontSize:9,color:"var(--t3)"}}>{l}</span>)}
            </div>
          </div>

          {/* Avoided */}
          <AvoidedSection data={data} activeDrugs={activeDrugs} goals={goals}/>

          {/* Weekly progression */}
          <div className="xcard">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div className="clbl" style={{margin:0}}>Par semaine</div>
              <button className="xbtn" onClick={()=>setExpand("weekly")}><IcoExpand/></button>
            </div>
            <div style={{marginBottom:7}}><div style={{fontSize:9,color:"#22c55e",fontWeight:600,marginBottom:4}}>✦ Jours clean</div><WeekBars weeks={weeklyData} metric="clean" color="#22c55e"/></div>
            {activeList.slice(0,2).map(k=><div key={k} style={{marginBottom:7}}><div style={{fontSize:9,color:ALL_DRUGS[k]?.color,fontWeight:600,marginBottom:4}}>{ALL_DRUGS[k]?.emoji} {ALL_DRUGS[k]?.name}</div><WeekBars weeks={weeklyData} metric={k} color={ALL_DRUGS[k]?.color}/></div>)}
          </div>

          {/* Fact médical */}
          <div className="card" style={{background:"var(--green3)",border:"1px solid rgba(34,197,94,0.2)"}}>
            <div style={{fontSize:9,color:"var(--green)",fontWeight:700,marginBottom:5,letterSpacing:".08em",textTransform:"uppercase"}}>💊 Fact médical</div>
            <p style={{fontSize:12,color:"var(--t)",lineHeight:1.6,fontStyle:"italic"}}>{streak>=90?"90+ jours : tes poumons ont restauré leurs cils bronchiques. Capacité respiratoire +30%. Risque cardiovasculaire cliniquement réduit.":streak>=30?"30 jours : ton foie s'est partiellement régénéré. Les récepteurs dopaminergiques retrouvent leur sensibilité normale.":streak>=14?"2 semaines : la mémoire à court terme s'améliore mesurément. L'anxiété de sevrage atteint son pic puis décroît naturellement.":streak>=7?"7 jours : ta circulation sanguine s'est déjà améliorée. L'oxygénation cellulaire est optimisée.":streak>=3?"72h : les substances sont en cours d'élimination. Le système nerveux recalibre ses neurotransmetteurs.":"Chaque heure sans consommer modifie la chimie de ton cerveau. Le processus commence maintenant."}</p>
          </div>
        </div>}

        {/* ══ BADGES ══ */}
        {tab==="badges"&&<div className="tc">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div style={{fontSize:12,color:"var(--t2)"}}><span style={{color:"#4ade80",fontWeight:700}}>{earnedCount}</span>/{badges.length} obtenus</div>
            <div style={{fontSize:11,color:"#22c55e",fontWeight:700}}>{Math.round((earnedCount/badges.length)*100)}%</div>
          </div>
          <div style={{marginBottom:12}}><Bar pct={(earnedCount/badges.length)*100} color="linear-gradient(90deg,#22c55e,#4ade80)"/></div>
          {badges.map(b=>(
            <React.Fragment key={b.id}>
              {b.cat&&<div className="badge-cat">{b.cat}</div>}
              <div className={`badge${b.earned?" earned":" locked"}`}>
                <div className="badge-icon" style={{filter:b.earned?"none":"grayscale(1) opacity(0.25)"}}>{b.icon}</div>
                <div style={{flex:1}}>
                  <div className="badge-name" style={{color:b.earned?"var(--t)":"var(--t3)"}}>{b.name}</div>
                  <div className="badge-desc">{b.desc}</div>
                </div>
                {b.earned&&<div style={{color:"#22c55e",fontSize:13,marginLeft:"auto",flexShrink:0}}>✓</div>}
              </div>
            </React.Fragment>
          ))}
        </div>}

        {/* ══ CONFIG ══ */}
        {tab==="goals"&&<div className="tc">
          <div className="card">
            <div className="clbl">Substances actives</div>
            <div style={{fontSize:11,color:"var(--t3)",marginBottom:10}}>Active uniquement ce que tu consommes ou as consommé.</div>
            {sortedDrugs.map(([k,d])=>(
              <div key={k} className={`drug-chip${activeDrugs[k]?" on":""}`} onClick={()=>setActiveDrugs(prev=>({...prev,[k]:!prev[k]}))}>
                <div className="drug-chip-ico">{d.emoji}</div>
                <div style={{flex:1}}><div style={{fontSize:13,fontWeight:500,color:activeDrugs[k]?d.color:"var(--t3)"}}>{d.name}</div><div style={{fontSize:10,color:"var(--t3)"}}>{d.unit}</div></div>
                <div className="drug-chip-risk" style={{background:`${d.riskColor}22`,color:d.riskColor,flexShrink:0}}>{d.risk}</div>
                <div style={{marginLeft:8,flexShrink:0}}><div className={`toggle${activeDrugs[k]?" on":" off"}`} style={{background:activeDrugs[k]?d.color:undefined}}/></div>
              </div>
            ))}
          </div>
          <div className="card">
            <div className="clbl">Paramètres</div>
            {[{l:"Objectif jours clean / mois",k:"target",max:31},{l:"Coût paquet cigs (€)",k:"cigCost"},{l:"Coût cannabis / g (€)",k:"weedCost"}].map(g=>(
              <div key={g.k} className="gr"><span>{g.l}</span><input type="number" value={goals[g.k]||0} onChange={e=>setGoals(p=>({...p,[g.k]:+e.target.value}))} min="0" step={g.k.includes("Cost")?0.5:1} max={g.max||99}/></div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,color:"var(--t)"}}>Progression</span><span style={{fontSize:12,fontWeight:700,color:"#22c55e"}}>{nClean} / {goals.target}</span></div>
            <Bar pct={Math.min((nClean/Math.max(goals.target,1))*100,100)} color="linear-gradient(90deg,#22c55e,#4ade80)" thick/>
            {nClean>=goals.target&&<div className="sban">🎉 Objectif atteint !</div>}
          </div>
          <div className="card">
            <div className="clbl">Rappel quotidien</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:goals.notifOn?10:0}}>
              <div><div style={{fontSize:12,color:"var(--t)",fontWeight:500}}>Notification du soir</div><div style={{fontSize:10,color:"var(--t3)",marginTop:1}}>Rappel de renseigner ta journée</div></div>
              <button className={`toggle${goals.notifOn?" on":" off"}`} onClick={async()=>{if(!goals.notifOn){if("Notification" in window){const p=await Notification.requestPermission();if(p==="granted")setGoals(g=>({...g,notifOn:true}));}else setGoals(g=>({...g,notifOn:true}));}else setGoals(g=>({...g,notifOn:false}));}}/>
            </div>
            {goals.notifOn&&<div className="gr" style={{marginBottom:0}}><span>Heure</span><input type="time" value={goals.notifTime||"22:00"} onChange={e=>setGoals(p=>({...p,notifTime:e.target.value}))}/></div>}
          </div>
          <div className="sg">
            <div className="sm"><div className="v" style={{color:"#22c55e"}}>{streak}j</div><div className="l">streak</div></div>
            <div className="sm"><div className="v" style={{color:scoreColor}}>{score}</div><div className="l">score</div></div>
            <div className="sm"><div className="v" style={{color:"#4ade80"}}>{earnedCount}</div><div className="l">badges</div></div>
            <div className="sm"><div className="v" style={{color:"#a855f7"}}>{longest}j</div><div className="l">record</div></div>
          </div>
        </div>}
      </div>

      {/* ══ Tabs ══ */}
      <div className="tabs">
        {[["cal",<IcoCalendar/>,"Parcours"],["heal",<IcoHeart/>,"Guérison"],["badges",<IcoBadge/>,"Badges"],["goals",<IcoSettings/>,"Config"]].map(([k,icon,label])=>(
          <button key={k} className={`tb${tab===k?" on":""}`} onClick={()=>setTab(k)}>{icon}{label}</button>
        ))}
      </div>

      {/* ══ Expand overlays ══ */}
      {expand==="weekly"&&<ExpandView title="Progression hebdomadaire" onClose={()=>setExpand(null)}>
        {[{metric:"clean",color:"#22c55e",label:"Jours clean",e:"✦"},...activeList.map(k=>({metric:k,color:ALL_DRUGS[k]?.color,label:ALL_DRUGS[k]?.name,e:ALL_DRUGS[k]?.emoji}))].map(m=>(
          <div key={m.metric} style={{background:"var(--s)",borderRadius:13,padding:13}}>
            <div style={{fontSize:11,color:m.color,fontWeight:600,marginBottom:9}}>{m.e} {m.label}</div>
            <WeekBars weeks={weeklyData} metric={m.metric} color={m.color}/>
          </div>
        ))}
        <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
      </ExpandView>}

      {expand==="spark"&&<ExpandView title="Tendance 30 jours — tap pour détails" onClose={()=>setExpand(null)}>
        <div style={{background:"var(--s)",borderRadius:14,padding:14}}>
          <InteractiveChart spark={spark} onExpand={()=>{}}/>
        </div>
        <div style={{background:"var(--s)",borderRadius:13,padding:13}}>
          {[{l:"Jours clean",v:nClean,c:"#22c55e"},...activeList.map(k=>({l:ALL_DRUGS[k]?.name,v:totals[k]||0,c:ALL_DRUGS[k]?.color}))].map(b=>(
            <div key={b.l} style={{marginBottom:9}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11,color:"var(--t2)"}}>{b.l}</span><span style={{fontSize:11,fontWeight:700,color:b.c}}>{b.v}</span></div>
              <Bar pct={Math.min((b.v/Math.max(daysCount,1))*100,100)} color={b.c}/>
            </div>
          ))}
        </div>
        <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
      </ExpandView>}

      {/* Profile overlay */}
      {showProfile&&(
        <div className="mo" onClick={()=>setShowProfile(false)}>
          <div className="mb" style={{maxHeight:"92vh"}} onClick={e=>e.stopPropagation()}>
            <div className="mh"/>
            <ProfileSection profile={profile} setProfile={setProfile} onClose={()=>setShowProfile(false)}/>
          </div>
        </div>
      )}

      {/* Day modal */}
      {modal&&<DayModal modal={modal} data={data} activeDrugs={activeDrugs} onSave={saveEntry} onClear={clearEntry} onClose={()=>setModal(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}
</script>
</body>
</html>
