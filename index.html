<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="theme-color" content="#0a0a0f"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Recovery"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon-192.png"/>
  <title>Recovery Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--s:rgba(255,255,255,0.035);--b:rgba(255,255,255,0.07);--t:#e8e8f0;--m:#6b7280;}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;background:var(--bg);color:var(--t);font-family:'DM Sans',system-ui,sans-serif;overflow:hidden;}
    #root{height:100%;display:flex;flex-direction:column;}
    .shell{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);}
    .hdr{padding:10px 16px 0;flex-shrink:0;}
    .content{flex:1;overflow-y:auto;padding:8px 16px calc(68px + max(env(safe-area-inset-bottom,0px),10px));-webkit-overflow-scrolling:touch;}
    .tabs{position:fixed;bottom:0;left:0;right:0;padding:5px 6px 0;padding-bottom:max(env(safe-area-inset-bottom,0px),10px);background:rgba(10,10,15,0.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--b);display:flex;gap:2px;z-index:50;}
    .tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 1px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:9px;font-weight:600;color:var(--m);transition:all .22s cubic-bezier(.34,1.56,.64,1);}
    .tb.on{background:rgba(34,197,94,0.12);color:#4ade80;}
    .tb svg{transition:transform .25s cubic-bezier(.34,1.56,.64,1);}
    .tb.on svg{transform:scale(1.12);}
    .tc{animation:tIn .2s ease;}
    @keyframes tIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .vpill{display:flex;background:rgba(255,255,255,0.05);border-radius:8px;padding:2px;gap:2px;}
    .vbtn{padding:4px 9px;border-radius:6px;border:none;font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;background:transparent;color:var(--m);transition:all .18s;display:flex;align-items:center;gap:3px;}
    .vbtn.on{background:rgba(34,197,94,0.18);color:#4ade80;}
    .cal-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px;}
    .cdl{text-align:center;font-size:10px;font-weight:600;color:var(--m);letter-spacing:.04em;padding:3px 0;}
    .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
    .day{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:1.5px solid transparent;font-size:11px;font-weight:500;user-select:none;opacity:0;animation:cPop forwards;transition:transform .14s ease,background .2s,border-color .2s;}
    .day:active{transform:scale(0.87)!important;}
    .day.td{border-color:rgba(34,197,94,0.6)!important;}
    .day.bop{animation:cBop .36s cubic-bezier(.34,1.56,.64,1) forwards!important;}
    .dot{position:absolute;top:2px;right:2px;width:4px;height:4px;border-radius:50%;background:#a855f7;}
    @keyframes cPop{0%{opacity:0;transform:scale(0.5)}100%{opacity:1;transform:scale(1)}}
    @keyframes cBop{0%{transform:scale(1)}35%{transform:scale(1.26)}65%{transform:scale(0.93)}100%{transform:scale(1)}}
    .week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
    .wday{border-radius:12px;display:flex;flex-direction:column;align-items:center;padding:7px 2px;cursor:pointer;border:1.5px solid transparent;user-select:none;transition:transform .14s,background .2s;animation:tIn .25s ease;}
    .wday:active{transform:scale(0.92);}
    .wday.td{border-color:rgba(34,197,94,0.6)!important;}
    .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
    .nbtn{background:rgba(255,255,255,0.07);border:1px solid var(--b);color:var(--t);border-radius:9px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background .14s,transform .14s;}
    .nbtn:active{background:rgba(255,255,255,0.13);transform:scale(0.88);}
    .card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:13px;margin-bottom:9px;}
    .clbl{font-size:10px;color:var(--m);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-bottom:9px;}
    .sg{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px;}
    .sm{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:11px;text-align:center;}
    .sm .v{font-size:22px;font-weight:700;font-family:'DM Serif Display',serif;}
    .sm .l{font-size:9px;color:var(--m);margin-top:2px;}
    .pb{height:5px;border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden;margin-top:5px;}
    .pf{height:100%;border-radius:3px;width:0;transition:width .85s cubic-bezier(.4,0,.2,1);}
    .pb.t{height:9px;}
    .br{margin-bottom:8px;}.br:last-child{margin-bottom:0;}
    .bl{display:flex;justify-content:space-between;margin-bottom:3px;font-size:11px;}
    .bl span:first-child{color:#9ca3af;}
    .pulse{animation:sp .5s cubic-bezier(.34,1.56,.64,1);}
    @keyframes sp{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
    .exp-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:300;display:flex;flex-direction:column;animation:fadeIn .2s ease;padding:env(safe-area-inset-top,16px) 14px calc(env(safe-area-inset-bottom,0px)+14px);}
    .exp-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;padding-top:2px;}
    .exp-title{font-size:16px;font-family:'DM Serif Display',serif;color:#f0f0f8;}
    .exp-close{background:rgba(255,255,255,0.08);border:1px solid var(--b);border-radius:9px;color:var(--t);width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .exp-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    .xcard{background:var(--s);border:1px solid var(--b);border-radius:13px;padding:13px;margin-bottom:9px;position:relative;}
    .xbtn{position:absolute;top:11px;right:11px;background:rgba(255,255,255,0.06);border:1px solid var(--b);border-radius:7px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
    .mo{position:fixed;inset:0;background:rgba(0,0,0,0.78);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:200;display:flex;align-items:flex-end;animation:fadeIn .18s ease;}
    .mb{background:#12121c;border:1px solid rgba(255,255,255,0.1);border-radius:22px 22px 0 0;padding:18px 15px calc(16px + max(env(safe-area-inset-bottom,0px),8px));width:100%;animation:sUp .28s cubic-bezier(.22,1,.36,1);max-height:94vh;overflow-y:auto;}
    @keyframes sUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
    .mh{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.13);margin:0 auto 14px;}
    .ctr-row{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;border-radius:11px;border:1.5px solid transparent;margin-bottom:6px;transition:border-color .15s,background .15s;}
    .ctr-row.active{border-color:currentColor;}
    .ctr-left{display:flex;align-items:center;gap:8px;}
    .ctr-emoji{font-size:16px;width:22px;text-align:center;flex-shrink:0;}
    .ctr-lbl{font-size:13px;font-weight:500;}
    .ctr-sub{font-size:10px;color:var(--m);margin-top:1px;}
    .ctr-right{display:flex;align-items:center;flex-shrink:0;}
    .ctr-btn{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:var(--t);font-size:18px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .14s,transform .14s;font-family:inherit;line-height:1;}
    .ctr-btn:active{transform:scale(0.88);}
    .ctr-val{min-width:32px;text-align:center;font-size:16px;font-weight:700;font-family:'DM Serif Display',serif;}
    .slbl{font-size:9px;color:var(--m);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;margin-top:2px;}
    .tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
    .tag{padding:5px 10px;border-radius:18px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);font-size:11px;font-weight:500;cursor:pointer;transition:all .15s;color:#9ca3af;}
    .tag.on{background:rgba(34,197,94,0.12);border-color:rgba(34,197,94,0.35);color:#4ade80;}
    .mood-row{display:flex;gap:5px;margin-bottom:10px;}
    .mood-btn{flex:1;padding:8px 2px;border-radius:10px;border:1.5px solid transparent;background:rgba(255,255,255,0.04);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:all .18s;}
    .mood-btn.on{border-color:currentColor;}
    .mood-btn span:first-child{font-size:18px;}
    .mood-btn span:last-child{font-size:9px;font-weight:600;}
    textarea{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:10px;color:var(--t);font-family:inherit;font-size:13px;padding:9px;width:100%;outline:none;resize:none;margin-top:4px;transition:border-color .2s;}
    textarea:focus{border-color:rgba(34,197,94,0.4);}
    input[type="number"],input[type="time"]{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;color:var(--t);font-family:inherit;font-size:13px;padding:6px 8px;width:84px;outline:none;}
    input[type="time"]{width:auto;}
    .bprim{width:100%;padding:12px;border-radius:11px;background:rgba(34,197,94,0.15);border:1.5px solid rgba(34,197,94,0.3);color:#4ade80;font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;margin-top:11px;transition:background .2s,transform .14s;}
    .bprim:active{background:rgba(34,197,94,0.25);transform:scale(0.97);}
    .expbtn{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#4ade80;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;}
    .gr{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
    .gr span{font-size:12px;color:#9ca3af;}
    .chk{display:inline-block;animation:chkP .28s cubic-bezier(.34,1.56,.64,1);}
    @keyframes chkP{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
    /* Recovery hero */
    .hero{background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(168,85,247,0.06));border:1px solid rgba(34,197,94,0.2);border-radius:18px;padding:18px;margin-bottom:10px;}
    .hero-score{font-size:52px;font-weight:700;font-family:'DM Serif Display',serif;line-height:1;}
    /* Recovery timeline */
    .rec-step{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
    .rec-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:4px;}
    /* Badge */
    .badge{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;margin-bottom:6px;border:1px solid transparent;}
    .badge.earned{background:rgba(34,197,94,0.06);border-color:rgba(34,197,94,0.18);}
    .badge.locked{opacity:.38;}
    .badge-icon{font-size:20px;width:32px;text-align:center;flex-shrink:0;}
    .badge-name{font-size:12px;font-weight:600;}
    .badge-desc{font-size:10px;color:#6b7280;margin-top:1px;}
    .badge-cat{font-size:9px;color:var(--m);font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin:12px 0 5px;padding-left:2px;}
    /* Week bars */
    .wbar-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:3px;height:60px;}
    .wbar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
    .wbar{width:100%;border-radius:3px 3px 0 0;min-height:3px;}
    .wbar-lbl{font-size:9px;color:var(--m);font-weight:600;}
    .wbar-val{font-size:8px;font-weight:700;}
    /* AI box */
    .ai-box{background:rgba(34,197,94,0.05);border:1px solid rgba(34,197,94,0.15);border-radius:13px;padding:13px;margin-top:8px;}
    .ai-hdr{display:flex;align-items:center;gap:7px;margin-bottom:9px;}
    .ai-dot{width:6px;height:6px;border-radius:50%;background:#22c55e;animation:aiP 2s infinite;}
    @keyframes aiP{0%,100%{opacity:1}50%{opacity:.3}}
    .ai-text{font-size:12px;color:#bbf7d0;line-height:1.65;}
    .ai-loading{display:flex;gap:4px;align-items:center;padding:6px 0;}
    .ai-loading span{width:5px;height:5px;border-radius:50%;background:#22c55e;animation:dots 1.2s infinite;}
    .ai-loading span:nth-child(2){animation-delay:.2s;}
    .ai-loading span:nth-child(3){animation-delay:.4s;}
    @keyframes dots{0%,80%,100%{transform:scale(0);opacity:.4}40%{transform:scale(1);opacity:1}}
    .ai-sec{margin-top:8px;padding-top:8px;border-top:1px solid rgba(34,197,94,0.1);}
    .ai-sec-t{font-size:9px;color:#22c55e;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;}
    /* Drug toggle */
    .drug-chip{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:11px;border:1.5px solid transparent;margin-bottom:7px;cursor:pointer;transition:all .15s;background:rgba(255,255,255,0.03);}
    .drug-chip.on{background:rgba(34,197,94,0.08);border-color:rgba(34,197,94,0.25);}
    .drug-chip-ico{font-size:18px;width:26px;text-align:center;}
    .drug-chip-name{font-size:13px;font-weight:500;flex:1;}
    .drug-chip-risk{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
    /* Sev */
    .sev-score{background:linear-gradient(135deg,rgba(34,197,94,0.1),rgba(34,197,94,0.04));border:1px solid rgba(34,197,94,0.2);border-radius:15px;padding:16px;margin-bottom:9px;text-align:center;}
    .delta-up{color:#22c55e;font-size:11px;font-weight:700;}
    .delta-dn{color:#ef4444;font-size:11px;font-weight:700;}
    .toggle{width:42px;height:24px;border-radius:12px;border:none;cursor:pointer;position:relative;transition:background .2s;}
    .toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s;}
    .toggle.on{background:#22c55e;}.toggle.on::after{transform:translateX(18px);}
    .toggle.off{background:rgba(255,255,255,0.15);}
    .leg{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:8px;}
    .li{display:flex;align-items:center;gap:4px;font-size:9px;color:#9ca3af;}
    .ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
    .motiv{background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.14);border-radius:13px;padding:13px;margin-bottom:9px;}
    .motiv .mt{font-size:9px;color:#22c55e;font-weight:700;margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase;}
    .motiv p{font-size:12px;color:#86efac;line-height:1.6;font-style:italic;}
    .sban{margin-top:8px;padding:8px 12px;background:rgba(34,197,94,0.1);border-radius:8px;font-size:11px;color:#4ade80;text-align:center;animation:tIn .4s ease;}
    .ss{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:10px;}
    .ss .m{background:var(--s);border:1px solid var(--b);border-radius:9px;padding:8px 4px;text-align:center;}
    .ss .m .v{font-size:15px;font-weight:700;}
    .ss .m .l{font-size:9px;color:var(--m);margin-top:1px;}
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ─── Drug Database ────────────────────────────────────────────────────────────
const ALL_DRUGS = {

  cannabis:{ name:"Cannabis",         emoji:"🍃", color:"#a855f7", risk:"Modéré",   riskColor:"#a855f7", unit:"joints",     unitShort:"joint", defaultOn:true,  gramPerUnit:0.3,

function getDayTotal(entry, activeDrugs){
  if(!entry) return 0;
  return Object.keys(activeDrugs).filter(k=>activeDrugs[k]).reduce((s,k)=>s+(entry[k]||0),0);
}
function getDayColor(entry, activeDrugs){
  if(!entry) return null;
  if(entry.clean) return "#22c55e";
  const total = getDayTotal(entry, activeDrugs);
  if(total === 0) return null;
  // Find primary drug (most consumed)
  const drugs = Object.keys(activeDrugs).filter(k=>activeDrugs[k]&&(entry[k]||0)>0);
  if(drugs.length === 0) return null;
  if(drugs.length >= 3) return "#9f1239";
  if(drugs.length === 2) return "#ef4444";
  return ALL_DRUGS[drugs[0]]?.color || "#6b7280";
}
function getDayEmoji(entry, activeDrugs){
  if(!entry) return "·";
  if(entry.clean) return "✦";
  const drugs = Object.keys(activeDrugs).filter(k=>activeDrugs[k]&&(entry[k]||0)>0);
  if(drugs.length === 0) return "·";
  if(drugs.length >= 3) return "💀";
  if(drugs.length === 2) return "⚠";
  return ALL_DRUGS[drugs[0]]?.emoji || "·";
}
function isCleanDay(entry, activeDrugs){
  if(!entry) return false;
  if(entry.clean) return true;
  return Object.keys(activeDrugs).filter(k=>activeDrugs[k]).every(k=>(entry[k]||0)===0) && entry.logged;
}

/* Animated bar */
function Bar({pct,color,thick}){
  const ref=useRef(null);
  useEffect(()=>{if(!ref.current)return;ref.current.style.width="0%";const t=setTimeout(()=>{if(ref.current)ref.current.style.width=pct+"%";},60);return()=>clearTimeout(t);},[pct]);
  return(<div className={`pb${thick?" t":""}`}><div ref={ref} className="pf" style={{background:color}}/></div>);
}

/* Sparkline */
function Spark({data,height=50}){
  if(!data?.length)return null;
  const W=300,H=height,p=6,max=Math.max(...data.map(d=>d.v),1);
  const pts=data.map((d,i)=>({x:p+(i/Math.max(data.length-1,1))*(W-p*2),y:H-p-(d.v/max)*(H-p*2),c:d.color||"#6b7280"}));
  const path=pts.map((p,i)=>`${i===0?"M":"L"} ${p.x} ${p.y}`).join(" ");
  const area=`${path} L ${pts[pts.length-1].x} ${H} L ${pts[0].x} ${H} Z`;
  return(<svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",height:H}}><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#22c55e" stopOpacity=".25"/><stop offset="100%" stopColor="#22c55e" stopOpacity="0"/></linearGradient></defs><path d={area} fill="url(#sg)"/><path d={path} fill="none" stroke="#22c55e" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>{pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={2} fill={p.c} stroke="#0a0a0f" strokeWidth="1.5"/>)}</svg>);
}

}

    {cat:null,id:"s7",icon:"🏆",name:"2 mois",desc:"60 jours — ton corps se régénère",earned:longest>=60},
    {cat:null,id:"s8",icon:"🦋",name:"3 mois — Renaissance",desc:"Poumons restaurés, cognition rétablie",earned:longest>=90},
    {cat:null,id:"s9",icon:"🌍",name:"6 mois",desc:"180 jours de liberté",earned:longest>=180},
    {cat:null,id:"s10",icon:"🌟",name:"1 an clean",desc:"365 jours — transformation complète",earned:longest>=365},

    {cat:"🚭 Sevrage tabac",id:"t1",icon:"🚭",name:"3 jours sans tabac",desc:"La nicotine quitte ton sang",earned:consecNo("tabac")>=3},
    {cat:null,id:"t2",icon:"💨",name:"1 semaine sans fumer",desc:"Cils bronchiques qui repoussent",earned:consecNo("tabac")>=7},
    {cat:null,id:"t3",icon:"🫁",name:"1 mois sans tabac",desc:"Risque cardiovasculaire déjà réduit",earned:consecNo("tabac")>=30},
    {cat:null,id:"t4",icon:"❤️",name:"3 mois sans tabac",desc:"+30% capacité pulmonaire",earned:consecNo("tabac")>=90},

    {cat:"🍃 Sevrage cannabis",id:"w1",icon:"🍃",name:"3 jours sans joints",desc:"THC sanguin en baisse",earned:consecNo("cannabis")>=3},
    {cat:null,id:"w2",icon:"🧠",name:"1 semaine sans weed",desc:"Mémoire en récupération",earned:consecNo("cannabis")>=7},
    {cat:null,id:"w3",icon:"💡",name:"2 semaines sans cannabis",desc:"Cognition et sommeil améliorés",earned:consecNo("cannabis")>=14},
    {cat:null,id:"w4",icon:"🌟",name:"1 mois sans cannabis",desc:"Système endocannabinoïde rétabli",earned:consecNo("cannabis")>=30},

    {cat:"🍺 Sevrage alcool",id:"a1",icon:"💧",name:"3 jours sans alcool",desc:"Foie en récupération",earned:consecNo("alcool")>=3},
    {cat:null,id:"a2",icon:"🫀",name:"2 semaines sans alcool",desc:"Tension artérielle normalisée",earned:consecNo("alcool")>=14},
    {cat:null,id:"a3",icon:"🌊",name:"1 mois sans alcool",desc:"Foie régénéré, sommeil profond restauré",earned:consecNo("alcool")>=30},

    {cat:"✦ Jours clean cumulés",id:"c1",icon:"🌱",name:"10 jours clean",desc:"Au total",earned:cleanDays>=10},
    {cat:null,id:"c2",icon:"🌿",name:"25 jours clean",desc:"Au total",earned:cleanDays>=25},
    {cat:null,id:"c3",icon:"🌳",name:"50 jours clean",desc:"Au total",earned:cleanDays>=50},
    {cat:null,id:"c4",icon:"🏔️",name:"100 jours clean",desc:"Un cap majeur",earned:cleanDays>=100},
    {cat:null,id:"c5",icon:"🌍",name:"200 jours clean",desc:"Tu as changé ta vie",earned:cleanDays>=200},

    {cat:"😊 Bien-être",id:"b1",icon:"😊",name:"Bonne humeur × 5",desc:"5 jours avec humeur ≥ 4",earned:goodMoodDays>=5},
    {cat:null,id:"b2",icon:"🌈",name:"20 jours positifs",desc:"20 jours avec humeur positive",earned:goodMoodDays>=20},
    {cat:null,id:"b3",icon:"🛡️",name:"Jamais les 3 à la fois",desc:"Aucun jour avec 3+ substances simultanées",earned:loggedDays>=7&&multiDrugDays===0},

    {cat:"🔒 Secrets",id:"x1",icon:"🦅",name:"Phénix",desc:"Rechute puis 7 jours clean",earned:(()=>{const keys=Object.keys(data).sort();let hadRelapse=false;for(let i=0;i<keys.length;i++){const e=data[keys[i]];if(e&&!cleanFn(e)&&Object.keys(activeDrugs).filter(k=>activeDrugs[k]).some(k=>(e[k]||0)>0))hadRelapse=true;if(hadRelapse){let s=0;for(let j=i;j<keys.length&&j<i+7;j++){if(cleanFn(data[keys[j]]))s++;}if(s===7)return true;}}return false;})()},
    {cat:null,id:"x2",icon:"🌅",name:"Week-end propre",desc:"Samedi ET dimanche clean la même semaine",earned:(()=>{const d=new Date(today);const dow=d.getDay()===0?6:d.getDay()-1;const sat=new Date(d);sat.setDate(d.getDate()-(dow-5+7)%7);const sun=new Date(sat);sun.setDate(sat.getDate()+1);const ks=dk(sat.getFullYear(),sat.getMonth(),sat.getDate());const ksu=dk(sun.getFullYear(),sun.getMonth(),sun.getDate());return cleanFn(data[ks])&&cleanFn(data[ksu]);})()},
    {cat:null,id:"x3",icon:"📆",name:"4 lundis clean",desc:"4 lundis consécutifs sans rien",earned:(()=>{const d=new Date(today);const dow=d.getDay()===0?6:d.getDay()-1;let c=0;for(let w=0;w<4;w++){const lun=new Date(d);lun.setDate(d.getDate()-dow-w*7);if(cleanFn(data[dk(lun.getFullYear(),lun.getMonth(),lun.getDate())]))c++;}return c>=4;})()},
  ];
}

function App(){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  const [data,setData]=useState(()=>load(STORE,{}));
  const [goals,setGoals]=useState(()=>load(GSTORE,{target:20,notifOn:false,notifTime:"22:00"}));
  const [activeDrugs,setActiveDrugs]=useState(()=>load(DSTORE,DEFAULT_ACTIVE));
  const [tab,setTab]=useState("cal");
  const [modal,setModal]=useState(null);
  const [calView,setCalView]=useState("month");
  const [weekOffset,setWeekOffset]=useState(0);
  const [bop,setBop]=useState(null);
  const [calKey,setCalKey]=useState(0);
  const [expand,setExpand]=useState(null);
  const [pulse,setPulse]=useState(false);
  const prevStreak=useRef(0);

  useEffect(()=>{try{localStorage.setItem(STORE,JSON.stringify(data));}catch{}},[data]);
  useEffect(()=>{try{localStorage.setItem(GSTORE,JSON.stringify(goals));}catch{}},[goals]);
  useEffect(()=>{try{localStorage.setItem(DSTORE,JSON.stringify(activeDrugs));}catch{}},[activeDrugs]);

  const activeList=useMemo(()=>Object.keys(activeDrugs).filter(k=>activeDrugs[k]),[activeDrugs]);
  const daysCount=daysIn(year,month),offset=firstOff(year,month);

  const entries=useMemo(()=>Array.from({length:daysCount},(_,i)=>{
    const e=data[dk(year,month,i+1)]||null;
    const clean=e?isCleanDay(e,activeDrugs):false;
    return{d:i+1,e,clean};
  }),[data,year,month,daysCount,activeDrugs]);

  const logged=entries.filter(x=>x.e).length;
  const nClean=entries.filter(x=>x.clean).length;
  const pct=logged?Math.round((nClean/logged)*100):0;

  const totals=useMemo(()=>{
    const t={};
    activeList.forEach(k=>{t[k]=entries.reduce((s,x)=>s+(x.e?.(k)||0),0);});
    return t;
  },[entries,activeList]);

  const prevM=month===0?11:month-1,prevY=month===0?year-1:year;
  const prevEntries=useMemo(()=>{const dim=daysIn(prevY,prevM);return Array.from({length:dim},(_,i)=>{const e=data[dk(prevY,prevM,i+1)]||null;return{e,clean:e?isCleanDay(e,activeDrugs):false};});},[data,prevY,prevM,activeDrugs]);
  const prevClean=prevEntries.filter(x=>x.clean).length;

  const weeklyData=useMemo(()=>{
    const wks=[];
    for(let w=0;w<5;w++){
      const start=w*7+1,end=Math.min(start+6,daysCount);
      if(start>daysCount)break;
      const we=entries.filter(x=>x.d>=start&&x.d<=end);
      const wk={clean:we.filter(x=>x.clean).length};
      activeList.forEach(k=>{wk[k]=we.reduce((s,x)=>s+(x.e?.[k]||0),0);});
      wks.push(wk);
    }
    return wks;
  },[entries,daysCount,activeList]);

  // Streak
  let streak=0,cur=new Date(today);
  while(true){const k=dk(cur.getFullYear(),cur.getMonth(),cur.getDate());const e=data[k];if(e&&isCleanDay(e,activeDrugs)){streak++;cur.setDate(cur.getDate()-1);}else break;}
  useEffect(()=>{if(streak>prevStreak.current){setPulse(true);setTimeout(()=>setPulse(false),600);}prevStreak.current=streak;},[streak]);
  let longest=0,run=0,prevD=null;
  for(const k of Object.keys(data).sort()){if(isCleanDay(data[k],activeDrugs)){const d=new Date(k);if(prevD&&(d-prevD)/86400000===1){run++;}else{run=1;}longest=Math.max(longest,run);prevD=d;}else{run=0;prevD=null;}}

  const score=sevrageScore(streak,longest,pct,nClean,daysCount);
  const scoreColor=score>=70?"#22c55e":score>=40?"#f97316":"#ef4444";

  const spark=useMemo(()=>Array.from({length:28},(_,i)=>{
    const d=new Date(today);d.setDate(d.getDate()-(27-i));
    const k=dk(d.getFullYear(),d.getMonth(),d.getDate());
    const e=data[k];
    const clean=e&&isCleanDay(e,activeDrugs);
    const total=e?getDayTotal(e,activeDrugs):0;
    return{v:clean?3:total===0?2:total<=2?1:0,color:clean?"#22c55e":total===0?"#4b5563":"#ef4444"};
  }),[data,activeDrugs]);

  const badges=useMemo(()=>computeBadges(data,activeDrugs),[data,activeDrugs]);
  const earnedCount=badges.filter(b=>b.earned).length;

  // Calendar cells
  const cells=[];
  for(let i=0;i<offset;i++)cells.push(null);
  for(let d=1;d<=daysCount;d++)cells.push(d);
  while(cells.length%7!==0)cells.push(null);

  function getWeekDays(off){const base=new Date(today);const dow=base.getDay()===0?6:base.getDay()-1;base.setDate(base.getDate()-dow+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);return{date:d,key:dk(d.getFullYear(),d.getMonth(),d.getDate())};});}
  const weekDays=getWeekDays(weekOffset);

  function changeMonth(dir){if(dir<0){if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}else{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}setCalKey(k=>k+1);}

  function updateEntry(y,m,d,patch){
    const key=dk(y,m,d);
    setData(prev=>({...prev,[key]:{logged:true,...(prev[key]||{}),...patch}}));
  }

  const selKey=modal?dk(modal.y,modal.m,modal.d):null;
  const selRaw=selKey?data[selKey]:null;
  const sel={logged:false,clean:false,note:"",mood:null,ctx:[],...(selRaw||{})};
  activeList.forEach(k=>{if(sel[k]===undefined)sel[k]=0;});

  function setClean(v){if(!modal)return;const patch={clean:v,logged:true};if(v)activeList.forEach(k=>{patch[k]=0;});updateEntry(modal.y,modal.m,modal.d,patch);if(v){setBop(modal.d);setTimeout(()=>setBop(null),450);}}
  function setDrugVal(drugKey,val){if(!modal)return;updateEntry(modal.y,modal.m,modal.d,{[drugKey]:val,clean:false,logged:true});if(val>0){setBop(modal.d);setTimeout(()=>setBop(null),450);}}
  function setMood(m){if(!modal)return;updateEntry(modal.y,modal.m,modal.d,{mood:sel.mood===m?null:m});}
  function toggleCtx(c){if(!modal)return;const arr=sel.ctx||[];updateEntry(modal.y,modal.m,modal.d,{ctx:arr.includes(c)?arr.filter(x=>x!==c):[...arr,c]});}
  function setNote(note){if(!modal)return;updateEntry(modal.y,modal.m,modal.d,{note});}
  function clearDay(){if(!modal)return;setData(prev=>{const n={...prev};delete n[dk(modal.y,modal.m,modal.d)];return n;});}
  function exportJSON(){const blob=new Blob([JSON.stringify({data,goals,activeDrugs},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="recovery_tracker.json";a.click();}

  const aiStats=useMemo(()=>({totals,nClean,daysCount,streak,longest,pct,score}),[totals,nClean,daysCount,streak,longest,pct,score]);

  // Recovery steps for primary drug
  const primaryDrug=activeList.find(k=>ALL_DRUGS[k]?.effects?.recovery?.length>0);
  const recSteps=primaryDrug?ALL_DRUGS[primaryDrug].effects.recovery:[];

  const riskOrder={"Extrême":0,"Très élevé":1,"Élevé":2,"Modéré":3,"Faible":4};
  const sortedDrugs=Object.entries(ALL_DRUGS).sort((a,b)=>(riskOrder[a[1].risk]||9)-(riskOrder[b[1].risk]||9));

  return(
    <div className="shell">
      <div className="hdr">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
          <div>
            <div style={{fontSize:9,letterSpacing:".15em",color:"#6b7280",textTransform:"uppercase",fontWeight:600}}>Parcours de guérison</div>
            <h1 style={{fontSize:17,fontFamily:"'DM Serif Display',serif",fontWeight:400,color:"#f0f0f8",lineHeight:1.1}}>Recovery Tracker</h1>
          </div>
          <button className="expbtn" onClick={exportJSON}>↓ JSON</button>
        </div>
      </div>

      <div className="content">

        {/* ══ MON PARCOURS (calendrier) ══ */}
        {tab==="cal"&&(<div className="tc">

          {/* Hero recovery banner */}
          <div className="hero">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontSize:9,color:"#86efac",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>Score de guérison</div>
                <div className="hero-score" style={{color:scoreColor}}>{score}<span style={{fontSize:18}}>/100</span></div>
                <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>{score>=70?"Bonne progression 🌱":score>=40?"En chemin 🚶":score>=20?"Continue ✊":"Commence aujourd'hui"}</div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:9,color:"#9ca3af",marginBottom:3}}>Streak actuel</div>
                <div style={{fontSize:28,fontWeight:700,color:"#22c55e",fontFamily:"'DM Serif Display',serif"}} className={pulse?"pulse":""}>{streak}<span style={{fontSize:13}}> j</span></div>
                <div style={{fontSize:9,color:"#9ca3af",marginTop:2}}>Record : {longest}j</div>
              </div>
            </div>
            <div style={{marginTop:12}}><Bar pct={score} color={`linear-gradient(90deg,${scoreColor},${scoreColor}88)`} thick/></div>
          </div>

          <div className="nav">
            <button className="nbtn" onClick={()=>calView==="month"?changeMonth(-1):setWeekOffset(w=>w-1)}>‹</button>
            <div style={{display:"flex",alignItems:"center",gap:7}}>
              <span style={{fontSize:13,fontWeight:600}}>{calView==="week"?`${weekDays[0].date.getDate()}–${weekDays[6].date.getDate()} ${MONTHS_S[weekDays[3].date.getMonth()]}`:`${MONTHS[month]} ${year}`}</span>
              <div className="vpill">
                <button className={`vbtn${calView==="month"?" on":""}`} onClick={()=>setCalView("month")}><IcoMonth/>Mois</button>
                <button className={`vbtn${calView==="week"?" on":""}`} onClick={()=>setCalView("week")}><IcoWeek/>Sem.</button>
              </div>
            </div>
            <button className="nbtn" onClick={()=>calView==="month"?changeMonth(1):setWeekOffset(w=>w+1)}>›</button>
          </div>

          {calView==="month"&&<>
            <div className="cal-hdr">{DAYS.map(d=><div key={d} className="cdl">{d}</div>)}</div>
            <div className="cal-grid" key={calKey}>
              {cells.map((d,i)=>{
                if(!d)return <div key={`e${i}`}/>;
                const e=data[dk(year,month,d)]||null;
                const col=getDayColor(e,activeDrugs);
                const isToday=d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
                return(<div key={d} className={`day${isToday?" td":""}${bop===d?" bop":""}`}
                  style={{background:col?col+"22":"rgba(255,255,255,0.03)",borderColor:col||(isToday?"rgba(34,197,94,0.5)":"transparent"),color:col||"#6b7280",animationDuration:`${Math.min(i*14,260)+160}ms`}}
                  onClick={()=>setModal({y:year,m:month,d})}>
                  <span style={{fontSize:11,fontWeight:isToday?700:500}}>{d}</span>
                  {e&&<span style={{fontSize:8,marginTop:1}}>{getDayEmoji(e,activeDrugs)}</span>}
                  {e?.mood!=null&&<span style={{position:"absolute",bottom:2,right:2,fontSize:7}}>{MOODS[e.mood]?.e}</span>}
                  {e?.note&&<div className="dot"/>}
                </div>);
              })}
            </div>
          </>}

          {calView==="week"&&(<div className="week-grid">
            {weekDays.map(({date,key},i)=>{
              const e=data[key]||null,col=getDayColor(e,activeDrugs);
              const isToday=date.toDateString()===today.toDateString();
              return(<div key={key} className={`wday${isToday?" td":""}`}
                style={{background:col?col+"18":"rgba(255,255,255,0.03)",borderColor:col||(isToday?"rgba(34,197,94,0.5)":"transparent")}}
                onClick={()=>setModal({y:date.getFullYear(),m:date.getMonth(),d:date.getDate()})}>
                <div style={{fontSize:9,fontWeight:600,color:"var(--m)",textTransform:"uppercase",marginBottom:2}}>{DAYS_S[i]}</div>
                <div style={{fontSize:14,fontWeight:700,color:col||(isToday?"#4ade80":"#e8e8f0"),marginBottom:2}}>{date.getDate()}</div>
                <div style={{fontSize:12}}>{e?getDayEmoji(e,activeDrugs):"·"}</div>
                {e&&activeList.filter(k=>(e[k]||0)>0).slice(0,2).map(k=><div key={k} style={{fontSize:8,color:ALL_DRUGS[k]?.color,marginTop:1}}>{e[k]}{ALL_DRUGS[k]?.emoji}</div>)}
                {e?.mood!=null&&<div style={{fontSize:10,marginTop:1}}>{MOODS[e.mood]?.e}</div>}
              </div>);
            })}
          </div>)}

          <div className="leg">
            <div className="li"><div className="ld" style={{background:"#22c55e"}}/>Clean</div>
            {activeList.map(k=><div key={k} className="li"><div className="ld" style={{background:ALL_DRUGS[k]?.color}}/>{ALL_DRUGS[k]?.name}</div>)}
            <div className="li"><div className="ld" style={{background:"#ef4444"}}/>2+ substances</div>
            <div className="li"><div className="ld" style={{background:"#9f1239"}}/>3+ substances</div>
          </div>

          <div className="ss" style={{marginTop:10}}>
            <div className="m"><div className="v" style={{color:"#22c55e"}}>{nClean}</div><div className="l">jours clean</div></div>
            <div className="m"><div className={`v${pulse?" pulse":""}`} style={{color:"#4ade80",display:"inline-block"}}>{streak}j</div><div className="l">streak</div></div>
            <div className="m"><div className="v" style={{color:"#a3e635"}}>{pct}%</div><div className="l">taux</div></div>
          </div>
        </div>)}

        {/* ══ GUÉRISON (stats) ══ */}
        {tab==="stats"&&(<div className="tc">

          {/* Score */}
          <div className="sev-score">
            <div style={{fontSize:9,color:"#86efac",fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4}}>Score de guérison</div>
            <div style={{fontSize:50,fontWeight:700,fontFamily:"'DM Serif Display',serif",color:scoreColor,lineHeight:1}}>{score}<span style={{fontSize:18}}>/100</span></div>
            <div style={{fontSize:11,color:"#9ca3af",marginTop:3}}>Streak {streak}j · Record {longest}j · {pct}% clean</div>
            <div style={{marginTop:10}}><Bar pct={score} color={`linear-gradient(90deg,${scoreColor},${scoreColor}66)`} thick/></div>
          </div>

          {/* Recovery timeline */}
          {recSteps.length>0&&<div className="card">
            <div className="clbl">Timeline de récupération — {ALL_DRUGS[primaryDrug]?.name}</div>
            <div style={{fontSize:10,color:"#4b5563",marginBottom:10}}>Basé sur {streak} jour{streak>1?"s":""} de streak actuel</div>
            {recSteps.map((s,idx)=>{
              const done=streak>=(idx===0?0:idx===1?0:idx===2?2:idx===3?3:idx===4?7:idx===5?14:idx===6?30:idx===7?90:365);
              return(<div key={idx} className="rec-step">
                <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                  <div className="rec-dot" style={{background:done?"#22c55e":"rgba(255,255,255,0.1)",boxShadow:done?"0 0 7px #22c55e44":""}}/>
                  {idx<recSteps.length-1&&<div style={{width:2,height:20,background:"rgba(255,255,255,0.06)",marginTop:2}}/>}
                </div>
                <div style={{paddingBottom:idx<recSteps.length-1?6:0}}>
                  <div style={{fontSize:11,fontWeight:700,color:done?"#22c55e":"#4b5563",marginBottom:1}}>{s.t}</div>
                  <div style={{fontSize:11,color:done?"#e8e8f0":"#4b5563",lineHeight:1.4}}>{s.d}</div>
                </div>
              </div>);
            })}
          </div>}

          {/* Totaux */}
          <div className="card">
            <div className="clbl">Consommation ce mois</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7}}>
              {activeList.filter(k=>(totals[k]||0)>0||(ALL_DRUGS[k]?.defaultOn)).map(k=>{
                const d=ALL_DRUGS[k];if(!d)return null;
                return(<div key={k} style={{background:"rgba(255,255,255,0.04)",border:`1px solid ${d.color}22`,borderRadius:11,padding:"9px 5px",textAlign:"center"}}>
                  <div style={{fontSize:9,marginBottom:2}}>{d.emoji}</div>
                  <div style={{fontSize:18,fontWeight:700,color:(totals[k]||0)>0?d.color:"#4b5563",fontFamily:"'DM Serif Display',serif"}}>{totals[k]||0}</div>
                  <div style={{fontSize:9,color:"#e8e8f0",fontWeight:500}}>{d.unitShort}</div>
                  {d.gramPerUnit&&(totals[k]||0)>0&&<div style={{fontSize:8,color:"#6b7280"}}>≈{((totals[k]||0)*d.gramPerUnit).toFixed(1)}g</div>}
                </div>);
              })}
            </div>
          </div>

          {/* vs mois précédent */}
          <div className="card">
            <div className="clbl">vs {MONTHS_S[prevM]}</div>
            <div style={{display:"flex",justifyContent:"space-between"}}>
              {[{l:"Jours clean",cur:nClean,prev:prevClean,better:"up"}].map(s=>{
                const diff=s.cur-s.prev;const improved=diff>0;
                return(<div key={s.l} style={{flex:1,textAlign:"center"}}>
                  <div style={{fontSize:24,fontWeight:700,color:"#22c55e",fontFamily:"'DM Serif Display',serif"}}>{s.cur}</div>
                  <div style={{fontSize:10,color:"#9ca3af",margin:"3px 0"}}>{s.l}</div>
                  {diff!==0&&<div className={improved?"delta-up":"delta-dn"}>{improved?"↑":"↓"}{Math.abs(diff)}</div>}
                </div>);
              })}
              <div style={{flex:1,textAlign:"center"}}>
                <div style={{fontSize:24,fontWeight:700,color:scoreColor,fontFamily:"'DM Serif Display',serif"}}>{score}</div>
                <div style={{fontSize:10,color:"#9ca3af",margin:"3px 0"}}>Score sevrage</div>
              </div>
              <div style={{flex:1,textAlign:"center"}}>
                <div style={{fontSize:24,fontWeight:700,color:"#a855f7",fontFamily:"'DM Serif Display',serif"}}>{longest}</div>
                <div style={{fontSize:10,color:"#9ca3af",margin:"3px 0"}}>Record streak</div>
              </div>
            </div>
          </div>

          {/* Progression hebdo */}
          <div className="xcard">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div className="clbl" style={{margin:0}}>Par semaine</div>
              <button className="xbtn" onClick={()=>setExpand("weekly")}><IcoExpand/></button>
            </div>
            <div style={{marginBottom:7}}><div style={{fontSize:9,color:"#22c55e",fontWeight:600,marginBottom:4}}>✦ Jours clean</div><WeekBars weeks={weeklyData} metric="clean" color="#22c55e"/></div>
            {activeList.slice(0,2).map(k=><div key={k} style={{marginBottom:7}}><div style={{fontSize:9,color:ALL_DRUGS[k]?.color,fontWeight:600,marginBottom:4}}>{ALL_DRUGS[k]?.emoji} {ALL_DRUGS[k]?.name}</div><WeekBars weeks={weeklyData} metric={k} color={ALL_DRUGS[k]?.color}/></div>)}
          </div>

          {/* Tendance */}
          <div className="xcard">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:7}}>
              <div className="clbl" style={{margin:0}}>Tendance 28j</div>
              <button className="xbtn" onClick={()=>setExpand("spark")}><IcoExpand/></button>
            </div>
            <Spark data={spark}/>
          </div>

          <div className="motiv">
            <div className="mt">💊 Fact médical</div>
            <p>{streak>=90?"90+ jours : tes poumons ont restauré leurs cils bronchiques. Capacité respiratoire +30%. Le risque cardiovasculaire est cliniquement réduit.":streak>=30?"30 jours : ton foie s'est partiellement régénéré. Les récepteurs dopaminergiques reprennent leur sensibilité normale.":streak>=14?"2 semaines : la mémoire à court terme s'améliore mesuralement. L'anxiété de sevrage atteint son pic puis décroît.":streak>=7?"7 jours : ta circulation sanguine s'est déjà améliorée. L'oxygénation cellulaire est optimisée.":streak>=3?"72h : les substances sont en cours d'élimination. Le système nerveux recalibre ses neurotransmetteurs.":"Chaque heure sans consommer modifie la chimie de ton cerveau. Le processus commence immédiatement."}</p>
          </div>
        </div>)}

        {/* ══ BADGES ══ */}
        {tab==="badges"&&(<div className="tc">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <div style={{fontSize:12,color:"#9ca3af"}}><span style={{color:"#4ade80",fontWeight:700}}>{earnedCount}</span>/{badges.length}</div>
            <div style={{fontSize:11,color:"#22c55e",fontWeight:700}}>{Math.round((earnedCount/badges.length)*100)}% obtenus</div>
          </div>
          <div style={{marginBottom:12}}><Bar pct={(earnedCount/badges.length)*100} color="linear-gradient(90deg,#22c55e,#4ade80)"/></div>
          {badges.map((b)=>(
            <React.Fragment key={b.id}>
              {b.cat&&<div className="badge-cat">{b.cat}</div>}
              <div className={`badge${b.earned?" earned":" locked"}`}>
                <div className="badge-icon" style={{filter:b.earned?"none":"grayscale(1) opacity(0.25)"}}>{b.icon}</div>
                <div style={{flex:1}}>
                  <div className="badge-name" style={{color:b.earned?"#e8e8f0":"#4b5563"}}>{b.name}</div>
                  <div className="badge-desc">{b.desc}</div>
                </div>
                {b.earned&&<div style={{color:"#22c55e",fontSize:13,marginLeft:"auto",flexShrink:0}}>✓</div>}
              </div>
            </React.Fragment>
          ))}
        </div>)}

        {/* ══ RÉGLAGES ══ */}
        {tab==="goals"&&(<div className="tc">

          {/* Substances actives */}
          <div className="card">
            <div className="clbl">Substances à suivre</div>
            <div style={{fontSize:11,color:"#4b5563",marginBottom:12}}>Active uniquement les substances que tu consommes ou as consommées.</div>
            {sortedDrugs.map(([k,d])=>(
              <div key={k} className={`drug-chip${activeDrugs[k]?" on":""}`} onClick={()=>setActiveDrugs(prev=>({...prev,[k]:!prev[k]}))}>
                <div className="drug-chip-ico">{d.emoji}</div>
                <div style={{flex:1}}>
                  <div className="drug-chip-name" style={{color:activeDrugs[k]?d.color:"#9ca3af"}}>{d.name}</div>
                  <div style={{fontSize:10,color:"#6b7280"}}>{d.unit}</div>
                </div>
                <div className="drug-chip-risk" style={{background:`${d.riskColor}22`,color:d.riskColor}}>{d.risk}</div>
                <div style={{marginLeft:8}}>
                  <div className={`toggle${activeDrugs[k]?" on":" off"}`} style={{background:activeDrugs[k]?d.color:"rgba(255,255,255,0.15)"}}/>
                </div>
              </div>
            ))}
          </div>

          {/* Objectif */}
          <div className="card">
            <div className="clbl">Objectif mensuel</div>
            <div className="gr"><span>Jours clean visés / mois</span><input type="number" value={goals.target} onChange={e=>setGoals(p=>({...p,target:+e.target.value}))} min="1" max="31"/></div>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:12,color:"#e8e8f0"}}>Progression</span><span style={{fontSize:12,fontWeight:700,color:"#22c55e"}}>{nClean} / {goals.target}</span></div>
            <Bar pct={Math.min((nClean/Math.max(goals.target,1))*100,100)} color="linear-gradient(90deg,#22c55e,#4ade80)" thick/>
            {nClean>=goals.target&&<div style={{marginTop:8,padding:"7px 11px",background:"rgba(34,197,94,0.1)",borderRadius:8,fontSize:11,color:"#4ade80",textAlign:"center"}}>🎉 Objectif atteint !</div>}
          </div>

          {/* Rappels */}
          <div className="card">
            <div className="clbl">Rappels</div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:goals.notifOn?10:0}}>
              <div><div style={{fontSize:12,color:"#e8e8f0",fontWeight:500}}>Notification du soir</div><div style={{fontSize:10,color:"#6b7280",marginTop:1}}>Rappel de renseigner ta journée</div></div>
              <button className={`toggle${goals.notifOn?" on":" off"}`} onClick={async()=>{if(!goals.notifOn){if("Notification" in window){const p=await Notification.requestPermission();if(p==="granted")setGoals(g=>({...g,notifOn:true}));}else setGoals(g=>({...g,notifOn:true}));}else setGoals(g=>({...g,notifOn:false}));}}/>
            </div>
            {goals.notifOn&&<div className="gr" style={{marginBottom:0}}><span>Heure</span><input type="time" value={goals.notifTime||"22:00"} onChange={e=>setGoals(p=>({...p,notifTime:e.target.value}))}/></div>}
          </div>

          {/* Résumé */}
          <div className="sg">
            <div className="sm"><div className="v" style={{color:"#22c55e"}}>{streak}j</div><div className="l">streak actuel</div></div>
            <div className="sm"><div className="v" style={{color:scoreColor}}>{score}</div><div className="l">score guérison</div></div>
            <div className="sm"><div className="v" style={{color:"#4ade80"}}>{earnedCount}</div><div className="l">badges</div></div>
            <div className="sm"><div className="v" style={{color:"#a855f7"}}>{longest}j</div><div className="l">record streak</div></div>
          </div>
        </div>)}
      </div>

      {/* Tabs */}
      <div className="tabs">
        {[["cal",<IcoCalendar/>,"Mon parcours"],["stats",<IcoChart/>,"Guérison"],["badges",<IcoBadge/>,"Badges"],["goals",<IcoSettings/>,"Config"]].map(([k,icon,label])=>(<button key={k} className={`tb${tab===k?" on":""}`} onClick={()=>setTab(k)}>{icon}{label}</button>))}
      </div>

      {/* Expand overlays */}
      {expand==="weekly"&&(<ExpandView title="Progression hebdomadaire" onClose={()=>setExpand(null)}>
        <div style={{background:"rgba(255,255,255,0.03)",borderRadius:13,padding:13}}>
          <div style={{fontSize:11,color:"#22c55e",fontWeight:600,marginBottom:9}}>✦ Jours clean par semaine</div>
          <WeekBars weeks={weeklyData} metric="clean" color="#22c55e"/>
        </div>
        {activeList.map(k=><div key={k} style={{background:"rgba(255,255,255,0.03)",borderRadius:13,padding:13}}>
          <div style={{fontSize:11,color:ALL_DRUGS[k]?.color,fontWeight:600,marginBottom:9}}>{ALL_DRUGS[k]?.emoji} {ALL_DRUGS[k]?.name}</div>
          <WeekBars weeks={weeklyData} metric={k} color={ALL_DRUGS[k]?.color}/>
        </div>)}
        <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
      </ExpandView>)}

      {expand==="spark"&&(<ExpandView title="Tendance 28 jours" onClose={()=>setExpand(null)}>
        <div style={{background:"rgba(255,255,255,0.03)",borderRadius:14,padding:14}}><Spark data={spark} height={140}/></div>
        <div style={{background:"rgba(255,255,255,0.03)",borderRadius:13,padding:13}}>
          {[{l:"Jours clean",v:nClean,c:"#22c55e"},...activeList.map(k=>({l:ALL_DRUGS[k]?.name,v:(totals[k]||0),c:ALL_DRUGS[k]?.color}))].map(b=>(
            <div key={b.l} style={{marginBottom:9}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}><span style={{fontSize:11,color:"#9ca3af"}}>{b.l}</span><span style={{fontSize:11,fontWeight:700,color:b.c}}>{b.v}</span></div>
              <Bar pct={Math.min((b.v/Math.max(daysCount,1))*100,100)} color={b.c}/>
            </div>
          ))}
        </div>
        <AIAnalysis stats={aiStats} activeDrugs={activeDrugs}/>
      </ExpandView>)}

      {/* Modal */}
      {modal&&(<div className="mo" onClick={()=>setModal(null)}>
        <div className="mb" onClick={e=>e.stopPropagation()}>
          <div className="mh"/>
          <div style={{marginBottom:13}}>
            <div style={{fontSize:9,color:"#6b7280",letterSpacing:".1em",textTransform:"uppercase"}}>Journal du</div>
            <div style={{fontSize:15,fontFamily:"'DM Serif Display',serif",color:"#f0f0f8"}}>{modal.d} {MONTHS[modal.m]} {modal.y}</div>
          </div>

          {/* Clean */}
          <div className="slbl">Journée</div>
          <div className={`ctr-row${sel.clean?" active":""}`} style={{background:sel.clean?"rgba(34,197,94,0.12)":"rgba(255,255,255,0.04)",color:"#22c55e",cursor:"pointer",marginBottom:11}} onClick={()=>setClean(!sel.clean)}>
            <div className="ctr-left"><div className="ctr-emoji">✦</div><div><div className="ctr-lbl" style={{color:"#22c55e"}}>Journée clean</div><div className="ctr-sub">Aucune substance aujourd'hui</div></div></div>
            {sel.clean&&<span style={{color:"#22c55e",fontSize:15,marginRight:3}} className="chk">✓</span>}
          </div>

          {/* Drug counters */}
          {activeList.map(k=>{
            const d=ALL_DRUGS[k];if(!d)return null;
            const val=sel[k]||0;
            return(<React.Fragment key={k}>
              <div className="slbl" style={{marginTop:7}}>{d.name} {d.emoji}</div>
              <div className={`ctr-row${val>0?" active":""}`} style={{background:val>0?d.color+"1a":"rgba(255,255,255,0.04)",color:d.color}}>
                <div className="ctr-left">
                  <div className="ctr-emoji">{d.emoji}</div>
                  <div>
                    <div className="ctr-lbl" style={{color:val>0?d.color:"#e8e8f0"}}>{d.unit}</div>
                    <div className="ctr-sub">{val>0?(d.gramPerUnit?`≈${(val*d.gramPerUnit).toFixed(1)}g`:val>1?`${val} ${d.unit}`:`1 ${d.unitShort}`):"Combien ?"}</div>
                  </div>
                </div>
                <Counter value={val} onChange={v=>setDrugVal(k,v)} color={d.color}/>
              </div>
            </React.Fragment>);
          })}

          {/* Humeur */}
          <div className="slbl" style={{marginTop:10}}>Humeur 😊</div>
          <div className="mood-row">
            {MOODS.map((m,i)=>(<button key={i} className={`mood-btn${sel.mood===i?" on":""}`} style={{borderColor:sel.mood===i?m.c:"transparent",color:sel.mood===i?m.c:"#6b7280"}} onClick={()=>setMood(i)}><span>{m.e}</span><span>{m.l}</span></button>))}
          </div>

          {/* Contexte si conso */}
          {activeList.some(k=>(sel[k]||0)>0)&&<>
            <div className="slbl">Contexte 🏷️</div>
            <div className="tag-row">{CTXS.map(c=>(<button key={c} className={`tag${(sel.ctx||[]).includes(c)?" on":""}`} onClick={()=>toggleCtx(c)}>{c}</button>))}</div>
          </>}

          <div className="slbl">Note</div>
          <textarea rows={2} placeholder="Comment tu te sens ?" value={sel.note||""} onChange={e=>setNote(e.target.value)}/>

          <div style={{display:"flex",gap:7,marginTop:11}}>
            {selRaw&&<button onClick={()=>{clearDay();setModal(null);}} style={{flex:1,padding:"11px",borderRadius:10,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.07)",color:"#6b7280",fontFamily:"inherit",fontWeight:600,fontSize:12,cursor:"pointer"}}>Effacer</button>}
            <button className="bprim" style={{flex:2,margin:0}} onClick={()=>setModal(null)}>Enregistrer</button>
          </div>
        </div>
      </div>)}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});}
</script>
</body>
</html>
